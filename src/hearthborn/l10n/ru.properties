Standard\:\ the\ default\ graphics\ values.\ Economy\ mode\ is\ for\ laptops\ with\ integrated\ graphics\ whose\ fans\ run\ at\ full\ speed\:\ no\ shadows,\ 30\ FPS\ limit\ and\ simple\ lighting.\ The\ picture\ keeps\ its\ sharpness.\ Every\ value\ can\ still\ be\ changed\ below.=Стандартный: значения графики по умолчанию. Экономичный режим для ноутбуков со встроенной графикой, у которых кулеры работают на полную: без теней, лимит 30 кадров/с и простое освещение. Чёткость картинки не страдает. Любое значение можно изменить ниже.
Smooths\ the\ edges\ of\ text\ so\ it\ looks\ less\ jagged.\ On\ by\ default\ on\ Windows\ and\ Linux,\ where\ text\ looks\ rough\ without\ it;\ off\ by\ default\ on\ macOS,\ where\ the\ hinted\ text\ is\ crisper.\ Applies\ after\ you\ close\ the\ client\ window\ completely\ and\ start\ it\ again;\ logging\ out\ to\ the\ character\ screen\ is\ not\ enough.\ Speech\ bubbles\ over\ characters\ are\ always\ smoothed.=Сглаживает края текста, чтобы он выглядел менее рваным. По умолчанию включено в Windows и Linux, где без него текст выглядит грубо, и выключено в macOS, где текст без сглаживания чётче. Применяется после того, как вы полностью закроете окно программы и запустите её снова; выхода на экран выбора персонажа недостаточно. Облачка речи над персонажами всегда сглажены.
Ask\ before\ planting\ below\ the\ quality\ roster\ record.\ Applies\ to\ all\ fields.\ When\ off,\ better\ recorded\ quality\ is\ reported\ only\ in\ System\ chat.=Спрашивать перед посадкой, если качество ниже рекорда из списка качеств. Действует для всех полей. Когда выключено, о лучшем записанном качестве сообщается только в системном чате.
