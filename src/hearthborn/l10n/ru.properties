Inheritance\ summary=Наследование: без погребения — 15% потраченных LP и FEP; только череп — 25%; тело без черепа — 35%; целое тело — 45%. Предок должен был прожить не менее восьми часов.
Inheritance\ help=Создайте нового персонажа. До входа в костёр в стартовой локации нажмите ПКМ на надгробие предка и выберите наследование.\n\nНаследуется доля потраченных очков знаний (LP) и очков характеристик (FEP), а не такой же процент уровней умений.\n\nБез погребения: 15%.\nПогребение только черепа: 25%.\nПогребение тела без черепа: 35%.\nПогребение целого тела: 45%.\nГосударственные похороны: 45% без необходимости вернуть тело.\n\nУ алтаря предков оплакивание возвращает наследство шагами по 6%, до 45%. Стоимость начинается с 1 нумена и каждый раз увеличивается на 2.\n\nМолитвы могут вернуть память о знакомых персонажах (без статуса родства), камнях власти и открытиях — по 5 нуменов. Воспоминания о войне возвращают один уровень боевых приёмов за молитву стоимостью 3 нумена.\n\nНаследовать можно персонажа, прожившего не менее восьми часов. Наследник обычно появляется у костра предка, если тот сохранился. Выбор маяка дикой местности заменяет эту точку появления. Наследование также может передать личный клайм.

