Food\ Event\ Points\ (FEPs)\ are\ acquired\ by\ eating\ various\ types\ of\ food.\ Whenever\ the\ FEP-meter\ fills\ up,\ a\ Food\ Event\ is\ triggered\ randomly,\ with\ the\ chance\ of\ any\ particular\ event\ determined\ by\ the\ amount\ of\ points\ for\ it\ in\ the\ meter.\ Most\ Food\ Events\ increase\ a\ Base\ Attribute\ by\ some\ amount.\n=Очки пищевых событий (FEP) набираются при употреблении различной еды. Когда шкала FEP заполняется, случайным образом происходит пищевое событие. Вероятность каждого события зависит от числа соответствующих очков в шкале. Большинство пищевых событий повышает одну из основных характеристик.\n

