For\ laptops\ with\ integrated\ graphics\ whose\ fans\ run\ at\ full\ speed\:\ no\ shadows,\ 30\ FPS\ limit,\ reduced\ render\ scale\ and\ simple\ lighting.\ Every\ value\ can\ still\ be\ changed\ below.=Для ноутбуков со встроенной графикой, у которых вентиляторы работают на полную: без теней, ограничение 30 кадров в секунду, сниженный масштаб отрисовки и простое освещение. Любое значение ниже можно изменить.
The\ position\ where\ you\ last\ logged\ out\ is\ not\ available,\ because\ that\ location\ has\ become\ occupied.\ Would\ you\ like\ to\ restart\ at\ your\ hearth\ fire\ instead?=Место, где вы вышли в прошлый раз, недоступно: его заняли. Хотите вместо этого начать у своего очага?
Scales\ the\ button\ panels\:\ the\ 4×4\ menu\ and\ the\ strip\ menu,\ system\ buttons,\ the\ 0-9\ and\ F\ panels,\ extra\ panels\ and\ the\ equipment\ strip.\ Windows\ keep\ their\ size.=Масштабирует панели кнопок: меню 4×4 и полосу, системные кнопки, панели 0–9 и F, дополнительные панели и панель экипировки. Окна сохраняют свой размер.
Bind\ a\ key\ to\ an\ element\ not\ listed\ above,\ such\ as\ an\ action-menu\ button.\ Click\ the\ element\ to\ bind,\ and\ then\ press\ the\ key\ to\ bind\ to\ it.\ Right-click\ to\ stop\ rebinding.=Назначьте клавишу элементу, которого нет в списке выше, например кнопке меню действий. Нажмите на элемент, затем нажмите клавишу, которую нужно назначить. Правый щелчок останавливает назначение.
Colours=Цвета
Click\ a\ square\ to\ choose\ the\ colour\ of\ that\ band.\ The\ numbers\ on\ item\ icons\ use\ it\ when\ "Colour\ quality\ by\ tier"\ is\ on.=Нажмите на квадрат, чтобы выбрать цвет этого уровня. Числа на значках предметов берут его, когда включено «Красить качество по уровню».
