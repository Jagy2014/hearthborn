Finish\ the\ current\ action\ and\ empty\ the\ cursor\ before\ starting\ auto-shoot.=Перед включением автострельбы завершите текущее действие и освободите курсор.
Select\ an\ animal\ for\ auto-shoot.\ Right-click\ or\ Escape\ cancels.=Выберите животное для автострельбы. Правый клик или Escape отменяют выбор.
Select\ a\ living\ animal\ for\ auto-shoot.=Выберите живое животное для автострельбы.
Start\ auto-shoot\ at\ the\ current\ animal\ target,\ or\ select\ an\ animal.\ Click\ again\ or\ press\ Escape\ to\ stop.\ Moving\ pauses\ shooting;\ it\ resumes\ after\ you\ stop\ and\ recover.=Включить автострельбу по текущей цели-животному или выбрать животное. Повторный клик или Escape выключают её. Во время движения стрельба на паузе; возобновляется после остановки и восстановления.
Repeat\ shots\ at\ this\ animal\ after\ recovery.\ Moving\ pauses\ shooting;\ it\ resumes\ when\ you\ stop.\ Escape,\ changing\ target\ or\ weapon\ stops\ auto-shoot.=Повторять выстрелы по этому животному после восстановления. Движение ставит стрельбу на паузу; после остановки она возобновляется. Escape, смена цели или оружия выключают автострельбу.
Shoot\ once\ at\ the\ current\ animal\ target.=Один выстрел по текущей цели-животному.
Repeat\ shots\ at\ this\ animal.\ Moving,\ Escape,\ changing\ target\ or\ weapon\ stops\ auto-shoot.=Повторять выстрелы по этому животному. Движение, Escape, смена цели или оружия выключают автострельбу.
