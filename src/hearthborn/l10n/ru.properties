Smooth\ text=Сглаживание текста
Antialiases\ text\ so\ it\ looks\ less\ jagged.\ Applies\ after\ restarting\ the\ client.=Сглаживает текст, чтобы он выглядел менее «рубленым». Применяется после перезапуска клиента.
Text\ smoothing\ applies\ after\ you\ close\ the\ client\ window\ completely\ and\ start\ it\ again\ (logging\ out\ to\ the\ character\ screen\ is\ not\ enough).=Сглаживание текста применится после полного закрытия окна программы и повторного запуска (выхода на экран выбора персонажа недостаточно).

Automatic\ item\ stacking=Автоматическая укладка предметов в стопки
Sets\ the\ game's\ own\ item\ stacking,\ which\ stacks\ picked-up\ items\ for\ you,\ to\ this\ state\ at\ every\ login,\ and\ now.\ Until\ you\ tick\ or\ untick\ it,\ the\ game's\ setting\ is\ left\ alone.=Включает или выключает встроенную в игру укладку подобранных предметов в стопки при каждом входе и сразу сейчас. Пока вы не поставили или не сняли галочку, настройка игры не трогается.
Stacks\ identical\ items\ in\ the\ inventory\ a\ moment\ after\ new\ ones\ arrive,\ for\ example\ when\ picked\ up\ from\ the\ ground.\ Needs\ the\ inventory\ window\ open\ and\ an\ empty\ cursor.\ Same\ as\ the\ Stack\ button\ in\ the\ window\ header.=Складывает одинаковые предметы в инвентаре в стопки вскоре после появления новых, например при подборе с земли. Нужно открытое окно инвентаря и пустой курсор. То же, что кнопка стопок в заголовке окна.

