LMB\:\ select\ ·\ Double\ LMB\:\ transfer\ all\nShift+LMB\:\ take\ best\ ·\ Shift+RMB\:\ take\ worst\nCtrl+Shift+LMB/RMB\:\ take\ five\ best/worst\nRMB\:\ actions\ ·\ Arrow\:\ show\ stacks=ЛКМ — выделить · Двойной ЛКМ — перенести всё\nShift+ЛКМ — лучший · Shift+ПКМ — худший\nCtrl+Shift+ЛКМ/ПКМ — пять лучших/худших\nПКМ — действия · Стрелка — показать стеки
