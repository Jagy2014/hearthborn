The\ harvest\ stockpile\ area\ is\ full\ or\ blocked.\ Make\ room\ and\ resume.=Область стокпайлов урожая заполнена или перекрыта. Освободите место и продолжите.
Choose\ a\ crop\ for\ the\ empty\ field\ before\ starting.=Перед запуском выберите культуру для пустого поля.
The\ saved\ field\ uses\ an\ unknown\ crop\ profile.=В сохранённом поле указана неизвестная культура.
This\ crop\ is\ not\ supported\ by\ field\ processing\ yet\:\ %s.=Эта культура пока не поддерживается обработчиком полей: %s.
The\ selected\ field\ contains\ mixed\ crops.\ Select\ one\ crop\ per\ field.=В выбранном поле смешаны культуры. Выделите поле с одной культурой.
The\ crop\ changed\ during\ an\ unfinished\ cycle.\ Check\ the\ field\ before\ resuming.=Культура изменилась во время незавершённого цикла. Проверьте поле перед продолжением.
Finish\ this\ field\ cycle\ before\ changing\ its\ crop.=Завершите обработку поля перед сменой культуры.
The\ crop\ is\ detected\ from\ plants.\ Manual\ selection\ is\ for\ empty\ fields.=Культура определяется по растениям. Ручной выбор предназначен для пустого поля.
Select\ the\ field\ on\ the\ map.\ The\ crop\ will\ be\ detected\ from\ its\ plants.=Выделите поле на карте. Культура определится по растениям.
Select\ the\ harvest\ stockpile\ area\ on\ the\ map.=Выделите на карте область стокпайлов урожая.
Not\ enough\ plantable\ seeds\ for\ the\ whole\ field.\ Each\ packet\ needs\ at\ least\ %d\ seeds.=Не хватает пригодных семян для всего поля. В каждой пачке должно быть не меньше %d семян.
Save\ a\ field,\ seed\ storage\ and\ a\ harvest\ stockpile\ area.\ One\ field\ contains\ one\ crop,\ detected\ from\ its\ plants\ before\ harvesting.\ Empty\ fields\ use\ their\ saved\ crop;\ choose\ a\ crop\ manually\ for\ a\ new\ empty\ field.\nSupports\ wheat,\ barley,\ flax\ and\ hemp\ grown\ to\ full\ seed\ maturity.\ Compares\ old\ and\ harvested\ seed\ qualities\ after\ the\ whole\ harvest,\ loads\ the\ planting\ reserve\ in\ batches\ and\ sows\ every\ empty\ tile.\ Young\ plants\ are\ retained.\ Fills\ matching\ product\ stockpiles\ before\ creating\ new\ ones.\ Keep\ eight\ free\ inventory\ slots\ for\ a\ scythe;\ its\ native\ swing\ may\ also\ affect\ crops\ outside\ the\ field\ edge.\nMenu\ use\ opens\ the\ field\ list\ without\ starting\ work.\ Select\ a\ field\ and\ press\ Process\ field\ to\ start\ or\ resume.\ Pause,\ Stop\ and\ saved\ progress\ are\ available.\ Mixed\ fields,\ root\ crops,\ sprouted\ grains\ and\ seed\ barrels\ are\ not\ supported\ yet.=Сохраните поле, хранилище семян и область стокпайлов урожая. Одно поле содержит одну культуру, которая определяется по растениям до уборки. Для пустого поля используется сохранённая культура; в новом пустом поле выберите её вручную.\nПоддерживаются пшеница, ячмень, лён и конопля полной семенной зрелости. После полной уборки сравнивает качество прежних и собранных семян, заранее набирает резерв и засевает пустые клетки. Молодые растения сохраняются. Заполняет подходящие стокпайлы продукта, затем создаёт новые. Для косы оставьте восемь свободных ячеек; штатный взмах может задеть растения за границей поля.\nКоманда в меню открывает список полей без запуска работы. Выберите поле и нажмите «Обработать поле», чтобы начать или продолжить. Доступны пауза, остановка и сохранение прогресса. Смешанные поля, корнеплоды, пророщенное зерно и семенные бочки пока не поддерживаются.
