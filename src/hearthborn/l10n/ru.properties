Shows\ the\ current\ and\ final\ growth\ stages,\ for\ example\ 3/5,\ in\ colours\ from\ red\ to\ green.\ Fully\ grown\ crops\ are\ always\ shown;\ hold\ Space\ to\ show\ the\ other\ stages.=Показывает текущую и конечную стадии роста, например 3/5, цветом от красного к зелёному. Выросшие растения показываются всегда; удерживайте пробел, чтобы увидеть остальные стадии.
