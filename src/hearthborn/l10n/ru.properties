Dim\ the\ chat\ when\ idle=Затемнять чат в простое
Only\ for\ the\ chat\ without\ the\ frame.\ When\ the\ chat\ is\ not\ in\ focus,\ nothing\ is\ under\ the\ pointer\ and\ no\ message\ came\ for\ a\ few\ seconds,\ the\ panel\ turns\ almost\ transparent.\ The\ words\ dim\ less.\ A\ tab\ with\ new\ messages\ stays\ bright.=Только для чата без рамки. Когда чат не в фокусе, под курсором ничего нет и несколько секунд не приходили сообщения, панель становится почти прозрачной, текст тускнеет слабее. Вкладка с новыми сообщениями остаётся яркой.
A\ new\ file\ every\ day,\ kept\ for\ %d\ days.\ System\ messages\ are\ not\ saved.=Каждый день новый файл, хранится %d дн. Системные сообщения не сохраняются.
