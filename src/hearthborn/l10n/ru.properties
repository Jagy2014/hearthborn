Root\ crops\:\ keep\ the\ best\ roots\ for\ one\ planting\ in\ these\ cupboards.\ Surplus\ goes\ to\ harvest\ stockpiles.=Корнеплоды: в этих шкафах остаются лучшие на один засев. Остальное отправляется в кучи урожая.
This\ field\ is\ not\ loaded.\ Move\ closer\ to\ it\ first.=Это поле не загружено. Сначала подойдите ближе.
You\ are\ already\ inside\ this\ field.=Вы уже находитесь на этом поле.
This\ field\ is\ outside\ local\ walking\ range.\ Move\ closer.=Поле слишком далеко для местного поиска пути. Подойдите ближе.
Cannot\ start\ a\ route\ to\ this\ field\ right\ now.=Сейчас не удалось начать движение к этому полю.
Double-click\ the\ field\ name\ to\ walk\ there\ with\ pathfinding.\ The\ field\ must\ be\ loaded.=Двойной щелчок по названию — идти к полю с поиском пути. Поле должно быть загружено.

The\ map\ changed.\ Start\ butchering\ again.=Карта изменилась. Запустите разделку заново.
Put\ the\ held\ item\ away\ and\ start\ butchering\ again.=Уберите предмет с курсора и запустите разделку заново.
Finish\ the\ current\ action\ before\ starting\ butchering.=Закончите текущее действие перед запуском разделки.
Close\ the\ current\ menu\ before\ starting\ butchering.=Закройте текущее меню перед запуском разделки.
Finish\ the\ current\ placement\ or\ area\ selection\ first.=Сначала закончите размещение объекта или выделение области.
Animal\ butchering\ completed.\ Carcasses\ processed\:\ %d.\ Skipped\:\ %d.=Разделка животных завершена. Обработано туш: %d. Пропущено: %d.
Cannot\ reach\ this\ carcass.\ Skipping\:\ %s.=Не удалось подойти или начать разделку. Пропускаю: %s.
Butchering\ did\ not\ finish\ after\ repeated\ actions.\ Check\ the\ carcass\ and\ restart.=После повторных действий разделка не завершилась. Проверьте тушу и запустите скрипт заново.
Not\ enough\ space\ in\ the\ inventory.\ Butchering\ stopped.=В инвентаре недостаточно места. Разделка остановлена.
Not\ enough\ drinking\ water.\ Refill\ and\ restart\ butchering.=Недостаточно питьевой воды. Пополните запас и запустите разделку заново.

Animal\ butchering\ started.\ Looking\ for\ carcasses\ within\ 20\ tiles.=Разделка животных запущена. Ищу туши в пределах 20 клеток.
Leave\ combat\ before\ starting\ animal\ butchering.=Сначала выйдите из боя, затем запустите разделку животных.
Carcass\ data\ is\ still\ loading.\ Try\ animal\ butchering\ again\ shortly.=Данные туш ещё не загрузились. Повторите запуск разделки чуть позже.
Waiting\ for\ nearby\ carcass\ data\ to\ load.=Жду загрузки данных ближайших туш.
Carcasses\ found\:\ %d.\ Skin,\ clean,\ meat,\ then\ bones.=Найдено туш: %d. По очереди: шкура, потрошение, мясо, затем кости.
Stockpile\ materials\ and\ contents=Материалы и содержимое куч
Field\ saved;\ waiting\ for\ crop\ data=Поле сохранено; жду данные растений
Loading\ the\ selected\ area=Загружается выбранная область
Selection\ kept.\ Waiting\ for\ data;\ the\ button\ below\ cancels.=Выбор сохранён. Жду данные; кнопка внизу отменяет ожидание.
Field\ boundaries\ saved.\ Crop\ data\ is\ still\ loading;\ choose\ the\ planting\ crop\ manually.=Границы поля сохранены. Растения ещё загружаются; выберите культуру для посадки вручную.
The\ selected\ map\ area\ did\ not\ load.\ Move\ closer\ and\ select\ it\ again.=Выбранная область карты не загрузилась. Подойдите ближе и выделите её снова.
Save\ field\ boundaries,\ planting\ storage\ and\ a\ harvest\ stockpile\ area.\ Choose\ the\ planting\ crop\ for\ an\ empty\ or\ mixed\ field.=Сохраните границы поля, хранилище посадочного материала и область куч урожая. Для пустого или смешанного поля выберите культуру для посадки.
Supports\ grains,\ fibre\ crops,\ pipeweed,\ carrots,\ turnips,\ onions,\ garlic\ and\ leeks.\ Harvest\ only\ collects\ the\ crop;\ Process\ also\ selects\ planting\ material\ and\ sows\ empty\ tiles.\ Young\ and\ unrelated\ crops\ are\ kept.=Поддерживаются зерновые, волокнистые культуры, табак, морковь, репа, лук, чеснок и порей. «Только убрать» собирает урожай; «Обработать» также отбирает посадочный материал и засевает пустые клетки. Молодые и посторонние растения сохраняются.
Opens\ the\ field\ list\ without\ starting\ work.\ Use\ Process\ or\ Harvest\ only\ in\ a\ field\ row.\ Pause\ and\ Stop\ are\ available.\ Leave\ eight\ inventory\ slots\ free\ for\ a\ scythe;\ its\ swing\ can\ affect\ crops\ outside\ the\ selected\ boundary.=Открывает список полей без запуска работы. Запуск — кнопками «Обработать» или «Только убрать» в строке поля. Доступны пауза и остановка. Для косы оставьте восемь свободных ячеек; её взмах может задеть растения за выбранными границами.
Transfer\ an\ item\ through\ a\ stockpile\ window,\ or\ fill/create\ a\ pile,\ to\ remember\ its\ material\ or\ contents.\ Ore,\ trash,\ flower\ and\ wool\ piles\ show\ the\ last\ identified\ item\ icon.=Переложите предмет через окно кучи либо наполните или создайте кучу, чтобы запомнить материал или содержимое. Над кучами руды, мусора, цветов и шерсти показывается значок последнего опознанного предмета.

A\ fixed\ horizontal\ toolbar\ with\ 22\ slots.=Горизонтальная панель фиксированной ширины на 22 ячейки.
Font\ size=Размер шрифта
Scales\ all\ text\ in\ the\ client.\ The\ new\ size\ applies\ after\ you\ close\ the\ client\ window\ completely\ and\ start\ it\ again;\ logging\ out\ to\ the\ character\ screen\ is\ not\ enough.=Масштабирует весь текст клиента. Новый размер применится после того, как вы полностью закроете окно программы и запустите её снова; выхода на экран выбора персонажа недостаточно.
Font\ size\ applies\ after\ you\ close\ the\ client\ window\ completely\ and\ start\ it\ again\ (logging\ out\ to\ the\ character\ screen\ is\ not\ enough).=Размер шрифта применится после полного закрытия окна программы и повторного запуска (выхода на экран выбора персонажа недостаточно).

Mouse\ wheel\ on\ this\ system\:=Колесо мыши в этой системе:
