Finish\ the\ current\ action\ and\ empty\ the\ cursor\ before\ shooting.=Завершите текущее действие и освободите курсор перед выстрелом.
Select\ an\ animal\ to\ shoot\ once.\ Right-click\ or\ Escape\ cancels.=Выберите животное для одного выстрела. Правый клик или Escape отменяют выбор.
Select\ a\ living\ animal\ to\ shoot.=Выберите живое животное для выстрела.
Stop\ moving\ before\ shooting.=Остановитесь перед выстрелом.
Wait\ for\ recovery\ before\ shooting.=Дождитесь восстановления перед выстрелом.
Shooting\ did\ not\ finish.\ Press\ Shoot\ target\ to\ try\ again.=Стрельба не завершилась. Для новой попытки нажмите «Выстрелить».
Shoot\ once\ at\ the\ current\ animal\ target.\ Aim\ confirmation\ is\ automatic;\ each\ shot\ requires\ a\ new\ click.=Один выстрел по текущей цели-животному. Прицел подтверждается автоматически; для каждого выстрела нажимайте кнопку заново.
Switch\ between\ your\ bow\ and\ a\ carried\ sword.\ Without\ a\ sword,\ put\ the\ bow\ away.=Сменить лук на меч из вещей или взять лук обратно. Если меча нет — убрать лук.
Helps\ with\ attacks\ in\ an\ existing\ animal\ fight.\ Does\ not\ select\ or\ engage\ animals.\ With\ a\ bow,\ use\ Shoot\ target\ or\ its\ shortcut\ in\ the\ Combat\ key\ settings.=Помогает с атаками в уже начатом бою с животным. Сама не выбирает и не атакует животных. С луком используйте кнопку «Выстрелить» или её сочетание клавиш из настроек боя.
