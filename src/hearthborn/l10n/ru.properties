Left\ click\:\ best\ to\ worst\ quality\nRight\ click\:\ worst\ to\ best\ quality\nGrouped\ by\ name;\ large\ items,\ such\ as\ cheese\ trays,\ are\ sorted\ among\ themselves=ЛКМ: от лучшего качества к худшему\nПКМ: от худшего к лучшему\nПо названию; крупные предметы (например, поддоны для сыра) сортируются между собой
The\ tiles\ under\ supports\ are\ shaded\ while\ the\ radii\ of\ supports\ are\ shown,\ and\ not\ otherwise.=Клетки под подпорками закрашиваются, пока показаны радиусы подпорок, и не закрашиваются без них.
