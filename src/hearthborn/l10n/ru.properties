Starts\ the\ saved\ field\ containing\ your\ character\ and\ opens\ its\ compact\ control\ panel.\ Shift-click\ opens\ the\ field\ list\ without\ starting\ work.\ Outside\ saved\ fields\ or\ with\ missing\ settings,\ the\ field\ list\ opens\ instead.\ Leave\ eight\ inventory\ slots\ free\ for\ a\ scythe;\ its\ swing\ can\ affect\ crops\ outside\ the\ selected\ boundary.=Запускает сохранённое поле под персонажем и открывает его компактную панель. Shift-клик открывает список полей без запуска. Вне сохранённых полей или при незавершённой настройке откроется список. Оставьте восемь свободных клеток инвентаря для косы; её взмах может затронуть растения за границей поля.
No\ fields\ saved\ yet.=Пока нет сохранённых полей.
