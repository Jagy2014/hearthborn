# Short base-attribute explanations, based on Ring of Brodgar's Attributes page.
Affects\ melee\ damage,\ mining\ and\ destruction.\ With\ Smithing,\ limits\ metalworking\ quality.=Влияет на урон в ближнем бою, добычу руды и разрушение объектов. Вместе с кузнечным делом ограничивает качество металлообработки.
Changes\ melee\ attack\ cooldowns\ according\ to\ the\ Agility\ difference\ between\ opponents.=Влияет на задержку между ближними атаками в зависимости от разницы проворства у противников.
Increases\ study\ attention.\ With\ Stealth,\ helps\ conceal\ criminal\ scents.=Увеличивает внимание для изучения диковинок. Вместе со скрытностью помогает скрывать преступные следы.
Increases\ maximum\ hit\ points\ and\ lowers\ the\ stamina\ cost\ of\ swimming.=Увеличивает максимальное здоровье и снижает расход выносливости при плавании.
With\ Exploration,\ reveals\ forageables\ and\ scents.\ With\ Cooking,\ limits\ dough\ quality.=Вместе с исследованием помогает находить природные предметы и следы. Вместе с кулинарией ограничивает качество теста.
Affects\ quest\ rewards,\ authority\ gain,\ party\ size\ and\ bonfire\ feasting\ bonuses.=Влияет на награды за задания, прирост авторитета, размер группы и бонусы пира у костра.
Affects\ the\ quality\ of\ pottery,\ sausages,\ sewn\ items\ and\ leather;\ also\ lockpicking.=Влияет на качество керамики, колбас, швейных изделий и кожи, а также на взлом замков.
Affects\ casting-rod\ fish\ choices\ and\ travel-weariness\ capacity\ in\ worlds\ that\ use\ it.=Влияет на выбор рыбы при ловле на закидную удочку и на допустимую усталость от путешествий в мирах, где она действует.
Affects\ the\ quality\ of\ jewelry,\ silk\ items,\ crafted\ curiosities\ and\ pigments.=Влияет на качество украшений, шёлковых изделий, создаваемых диковинок и пигментов.

# Short ability explanations, based on Ring of Brodgar's Abilities and Combat moves pages.
Helps\ unarmed\ attacks\ create\ openings.\ Strengthens\ defense\ in\ maneuvers\ based\ on\ Unarmed\ Combat.=Помогает атакам без оружия повышать уязвимости противника. Усиливает защиту стоек, использующих рукопашный бой.
Helps\ weapon\ attacks\ create\ openings.\ Strengthens\ defense\ in\ maneuvers\ based\ on\ Melee\ Combat.=Помогает атакам оружием повышать уязвимости противника. Усиливает защиту стоек, использующих ближний бой.
Affects\ ranged\ weapon\ damage\ and\ limits\ the\ quality\ of\ crafted\ bows,\ slings\ and\ arrows.=Влияет на урон дальнобойного оружия и ограничивает качество создаваемых луков, пращей и стрел.
With\ Perception,\ determines\ which\ forageables\ and\ criminal\ scents\ you\ can\ see.=Вместе с восприятием определяет, какие природные предметы и преступные следы вы можете видеть.
With\ Intelligence,\ makes\ your\ criminal\ scents\ harder\ to\ detect\ and\ track.=Вместе с интеллектом затрудняет обнаружение ваших преступных следов и выслеживание по ним.
With\ Dexterity,\ limits\ the\ quality\ of\ crafted\ clothing\ and\ leather\ items.=Вместе с ловкостью ограничивает качество создаваемой одежды и кожаных изделий.
With\ Strength,\ limits\ metal\ item\ quality;\ with\ Psyche,\ jewelry\ quality.=Вместе с силой ограничивает качество металлических изделий, а с духовностью — украшений.
Caps\ gathered\ clay,\ stone\ and\ ore\ quality.\ Also\ affects\ pottery\ and\ stoneworking.=Ограничивает качество добываемой глины, камня и руды. Также влияет на керамику и обработку камня.
Limits\ the\ quality\ of\ wooden\ items\ and\ sawn\ boards.=Ограничивает качество деревянных изделий и выпиливаемых досок.
With\ the\ recipe's\ attributes,\ limits\ the\ quality\ of\ food\ and\ some\ other\ crafted\ products.=Вместе с атрибутами, указанными в рецепте, ограничивает качество еды и некоторых других изделий.
Affects\ crop\ quality\ improvement\ and\ products\ obtained\ from\ butchering\ domestic\ animals.=Влияет на повышение качества урожая и качество продуктов разделки домашних животных.
