Left\ click\ turns\ animal\ auto-attack\ on\ or\ off.\ While\ it\ says\ paused,\ left\ click\ fights\ again\ and\ right\ click\ turns\ it\ off.\ Click\ the\ ground\ to\ run\ away.=ЛКМ включает или выключает автоатаку животных. Пока написано «пауза», ЛКМ снова дерётся, ПКМ выключает. Клик по земле — убежать.
