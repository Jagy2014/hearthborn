Hemp\ (seeds)=Конопля (семена)
One\ field\ contains\ one\ crop.=Одно поле — одна культура.
Crop\ for\ an\ empty\ field\:=Культура для пустого поля:
Detect\ from\ plants=Определить по растениям
Harvest\ stockpile\ area=Область стокпайлов урожая
Harvest\:\ %s=Урожай: %s
Ready\ to\ process\ field.=Готово к обработке поля.
Collecting\ and\ storing\ the\ harvest\ product.=Сбор и складирование урожая.
Select\ the\ field,\ seed\ storage\ and\ harvest\ stockpile\ areas\ first.=Сначала выберите поле, хранилище семян и область стокпайлов урожая.
