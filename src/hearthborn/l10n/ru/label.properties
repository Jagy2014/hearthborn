Digging\ has\ various\ effects\ on\ different\ terrains\\.\n\nOn\ certain\ terrains,\ digging\ extracts\ some\ resource\ native\ to\ it,\ such\ as\ sand\ from\ beaches,\ or\ clay\ from\ shallows\\.\n\nOn\ terraformable\ terrains,\ such\ as\ forests\ and\ plains,\ digging\ will\ lower\ the\ height\ of\ the\ terrain,\ extracting\ Soil\\.\ Soil\ can\ be\ placed\ back\ to\ raise\ the\ terrain\ by\ holding\ \\$col\\[246,229,34\\]\\{Shift\\}\ while\ interacting\ with\ the\ terrain\ using\ Soil\\.\n\nWhen\ terraforming\ \\(either\ by\ digging\ or\ by\ placing\ soil\\),\ normally\ the\ action\ will\ affect\ the\ corner\ between\ tiles\ closest\ to\ the\ clicked\ location\\.\ By\ additionally\ holding\ \\$col\\[246,229,34\\]\\{Ctrl\\}\ while\ performing\ the\ action,\ the\ action\ will\ instead\ proceed\ to\ level\ the\ four\ corners\ of\ the\ tile\ being\ clicked,\ either\ to\ the\ level\ of\ the\ lowest\ corner\ if\ digging,\ or\ to\ the\ level\ of\ the\ highest\ corner\ if\ placing\ soil\\.=Копание даёт разные результаты в зависимости от местности.\n\nНа некоторых типах местности оно добывает характерные для них ресурсы: например, песок на пляже или глину на мелководье.\n\nНа изменяемой местности, например в лесах и на равнинах, копание понижает поверхность и даёт грунт. Грунт можно вернуть, поднимая землю: удерживайте $col[246,229,34]{Shift} при взаимодействии с поверхностью с грунтом в руках.\n\nОбычно копание или подсыпка меняет ближайший к месту щелчка угол между клетками. Если дополнительно удерживать $col[246,229,34]{Ctrl}, действие выравнивает четыре угла выбранной клетки: по самому низкому при копании или по самому высокому при подсыпке.
