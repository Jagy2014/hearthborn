A\ Hearth\ Fire\ is\ a\ tether\ tying\ a\ Hearthling\ to\ the\ Hearthlands\\.\ You\ can\ fast\ travel\ to\ your\ Hearth\ Fire\ at\ most\ times,\ and\ you\ may\ sometimes\ be\ forced\ to,\ if\ your\ current\ position\ has\ for\ some\ reason\ become\ untenable\\.\n\nYou\ acquire\ a\ starting\ Hearth\ Fire\ when\ you\ are\ first\ burned\ into\ the\ world,\ and\ you\ are\ strongly\ recommended\ to\ always\ have\ one\\.=Костёр жизни связывает поселенца с этим миром. Обычно к нему можно быстро переместиться; иногда обстоятельства вынуждают вернуться к нему.\n\nПервый костёр жизни появляется при создании персонажа. Настоятельно рекомендуется всегда иметь такой костёр.
A\ Sawmill\ can\ be\ built\ inside\ a\ Wind-\ or\ Watermill,\ and\ allows\ you\ to\ automatically\ cut\ to\ boards\ any\ logs\ placed\ in\ it\\.=Лесопилку можно построить внутри ветряной или водяной мельницы. Она автоматически распиливает помещённые в неё брёвна на доски.
A\ Village\ Buoy\ increases\ the\ claimed\ area\ of\ your\ village\\.=Деревенский буй расширяет территорию владений деревни.
A\ Watermill\ provides\ sufficient\ power\ for\ two\ machines,\ which\ can\ be\ built\ anywhere\ inside\ the\ mill\\.\ Note\ that\ the\ wheel\ of\ the\ mill\ must\ be\ submerged\ in\ water,\ while\ the\ foundation\ of\ the\ mill\ must\ be\ built\ on\ land\\.=Водяная мельница обеспечивает энергией два механизма, которые можно построить в любом месте внутри неё. Колесо должно быть погружено в воду, а основание мельницы - находиться на суше.
A\ bubbling\ of\ muck,\ the\ coaly\ smell\ of\ pitch,\ and\ the\ sight\ of\ bones,\ whitening\ in\ the\ sun,\ tells\ of\ a\ natural\ Tarpit\ ahead\\.=Бульканье грязи, угольный запах смолы и кости, белеющие на солнце, выдают природную смоляную яму впереди.
