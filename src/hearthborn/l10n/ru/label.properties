A\ Bill\ of\ Possession\ can\ be\ applied\ to\ any\ carryable\ object,\ returning\ a\ stub\ item\\.\ The\ stub\ item\ allows\ its\ bearer\ to\ lift\ and\ carry\ the\ tagged\ object\ with\ full\ rights\ of\ ownership\\.=Документ о владении можно применить к любому переносимому объекту, получив корешок документа. Его предъявитель может поднимать и переносить отмеченный объект с полными правами владельца.
A\ Coronation\ Stone\ is\ the\ source\ and\ focal\ point\ of\ a\ Realm's\ power\\.\ By\ tapping\ in\ to\ the\ leylines\ of\ authority,\ you\ can\ sense\ the\ direction\ to\ the\ Coronation\ Stone\ of\ the\ Realm\ you\ are\ currently\ in\\.=Коронационный камень - источник и средоточие силы королевства. Прикоснувшись к потокам власти, вы можете определить направление к коронационному камню текущего королевства.
