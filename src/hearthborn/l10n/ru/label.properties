A\ massive\ building\ project\ requiring\ the\ Totemic\ Skull\ of\ a\ mighty\ beast\ to\ construct\\.\ The\ gate\ has\ all\ the\ functionality\ of\ a\ normal\ gate,\ in\ that\ it\ can\ be\ closed\ and\ locked,\ but\ it\ needs\ to\ be\ manually\ placed\\.=Масштабная постройка, для которой нужен тотемный череп могучего зверя. Ворота можно закрывать и запирать, как обычные, но размещать их нужно вручную.
