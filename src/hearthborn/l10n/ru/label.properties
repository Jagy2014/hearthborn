Alchemical\ Processing\ consumes\ alchemical\ ingredients\ to\ produce\ new,\ processed\ ingredients,\ combining,\ and\ often\ reducing,\ the\ potential\ effects\ present\ in\ the\ materials\ used\ to\ produce\ them,\ to\ create\ cleaner\ ingredients\ with\ less\ risk\ of\ harm\\.\n\nAlchemical\ raw\ materials,\ such\ as\ Herbs\ or\ Minerals,\ all\ have\ four\ potential\ effects\\.=Алхимическая обработка расходует ингредиенты, создавая новые обработанные материалы. Их возможные эффекты объединяются, а зачастую их число уменьшается, позволяя получить более чистые ингредиенты с меньшим риском вредных последствий.\n\nАлхимическое сырьё, например травы или минералы, имеет по четыре возможных эффекта.
