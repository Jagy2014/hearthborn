\\$col\\[255,255,255\\]\\{•\ The\ Primitive\ Tent\ Can\ be\ folded\ up,\ transported,\ and\ pitched\ again\ elsewhere\\.\n\ •\ Once\ the\ Tent\ has\ been\ pitched,\ whoever\ pitched\ it\ will\ be\ considered\ the\ owner\ of\ it\\.\n\ •\ It\ is\ always\ a\ crime\ of\ Vandalism\ to\ enter\ a\ Tent\ unless\ the\ door\ is\ set\ as\ open,\ or\ unless\ you\ have\ party\ permissions\ to\ enter\ it\\.\n\ •\ It\ is\ only\ a\ crime\ to\ enter\\.\ The\ Tent\ confers\ no\ claim\ protection\ to\ things\ inside\ it\\.\n\ •\ It\ is\ not\ possible\ to\ log\ out\ inside\ a\ tent\\.\\}=$col[255,255,255]{• Простую палатку можно свернуть, перенести и установить в другом месте.\n • Владельцем считается тот, кто установил палатку.\n • Вход в палатку считается вандализмом, если владелец не открыл вход или не дал разрешение вашей группе.\n • Преступлением считается только вход. Палатка не защищает находящиеся внутри вещи правом владения.\n • Внутри палатки нельзя выйти из игры.}
\\$i\\{A\ faint\ croaking\ can\ be\ heard\ whenever\ the\ wind\ rustles\ these\ flowers,\ smelling\ faintly\ of\ marshland\ and\ damp\ soil\\.\\}=$i{Когда ветер шелестит этими цветами, пахнущими болотом и сырой землёй, слышится тихое кваканье.}
\\$i\\{A\ flutter\ of\ lemon,\ chasing\ spring\ winds\ over\ grass\ waking\ from\ winter's\ sleep\\.\\}=$i{Лимонный трепет крыльев гонится за весенним ветром над травой, пробуждающейся от зимнего сна.}
\\$i\\{A\ foot\ that\ trod\ lightly,\ on\ freshly\ fallen\ snow,\ sprouted\ to\ strange\ bloom\\.\\}=$i{Лапка, легко ступавшая по свежему снегу, расцвела причудливым цветком.}
\\$i\\{A\ mass\ of\ red-hot\ molten\ glass,\ reflecting\ the\ fire\ inside\ it,\ and\ longing\ to\ cool\ to\ a\ more\ perfect\ form\\.\\}=$i{Масса раскалённого расплавленного стекла отражает огонь внутри себя и жаждет остыть, обретя более совершенную форму.}
\\$i\\{A\ shower\ of\ golden\ coins,\ by\ the\ sun\ strewn\ over\ heath\ and\ meadow,\ in\ bitter\ bribe\ to\ those\ unbidden\\.\\}=$i{Золотые монеты солнце рассыпало по лугам и пустошам - горькая плата незваным гостям.}
\\$i\\{A\ sword\ held\ high,\ and\ a\ battle\ cry,\ frozen\ to\ time,\ and\ cool\ to\ the\ touch\\.\\}=$i{Поднятый меч и боевой клич, застывшие во времени и холодные на ощупь.}
\\$i\\{Bumbling,\ bouncing,\ rolling\ forward,\ ever\ on,\ and\ ever\ on,\ for\ evermore\ 'til\ evermore\\.\\}=$i{Неуклюже жужжа, подпрыгивая и кувыркаясь, всё вперёд и вперёд - во веки веков.}
\\$i\\{Mushy,\ squishy,\ full\ of\ water,\ and\ a\ strange\ creature\ of\ the\ fathoms\ blue\\.\\}=$i{Мягкое, упругое, полное воды - диковинное создание синих глубин.}
\\$i\\{Only\ the\ faintest\ ripple\ of\ thought,\ ever\ crested\ these\ still\ waters\\.\\}=$i{Лишь едва заметная рябь мысли когда-либо тревожила эти тихие воды.}
\\$i\\{Served\ freshly\ cooked,\ with\ spring\ in\ its\ wobbles,\ fresh,\ chewy,\ and\ juicy\\.\\}=$i{Подано с пылу с жару: упругое, свежее, тягучее и сочное.}
\\$i\\{Somewhere\ deep\ inside,\ its\ final\ thoughts\ of\ pain\ and\ suffering\ still\ reverberate\\.\\}=$i{Где-то в глубине всё ещё отдаются последние мысли о боли и страдании.}
\\$i\\{The\ finest\ strands\ of\ softest\ fur,\ left\ behind\ by\ accident,\ or\ terrible\ misfortune\\.\\}=$i{Тончайшие пряди нежнейшего меха, оставленные случайно или по ужасному несчастью.}
\\$i\\{The\ first\ triumphant\ trumpet\ blast\ of\ Spring,\ melting\ away\ the\ snowy\ drift\ to\ herald\ the\ Fae\ Queen's\ return\\.\\}=$i{Первый победный трубный глас весны растапливает сугробы, возвещая возвращение королевы фей.}
\\$i\\{This\ flower\ whispers,\ in\ glistening,\ cold,\ frost,\ of\ how\ the\ last\ is\ the\ fairest\ of\ the\ seasons\\.\\}=$i{В сверкающем холодном инее этот цветок шепчет: последнее время года - прекраснейшее.}
