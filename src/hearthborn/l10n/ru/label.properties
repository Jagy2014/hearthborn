Display\ amount\ of\ cave\ dust\ fallen\ on\ tile\ when\ mining\ if\ you\ were\ present\ when\ it\ happened\\.\n\nHolding\ \\$b\\{\\$col\\[255,128,0\\]\\{SHIFT\\}\\}\ while\ activating\ this\ will\ turn\ on\ minesweeper\ cursor\:\n•\ \\$col\\[255,128,0\\]\\{Clicking\\}\ will\ add\ 'danger'\ \\[\\$font\\[monospaced,10\\]\\{\\$col\\[240,32,100\\]\\{\\$b\\{×\\}\\}\\}\\]\ marker\ on\ the\ tile\\.\n•\ \\$col\\[255,128,0\\]\\{ALT\\+Click\\}\ will\ add\ 'safe'\ \\[\\$font\\[monospaced,10\\]\\{\\$col\\[32,220,80\\]\\{\\$b\\{·\\}\\}\\}\\]\ marker\ to\ the\ tile\\.\n•\ \\$col\\[255,128,0\\]\\{SHIFT\\+Click\\}\ will\ add\ 'maybe'\ \\[\\$font\\[monospaced,10\\]\\{\\$col\\[193,87,251\\]\\{\\$b\\{\\?\\}\\}\\}\\]\ to\ the\ tile\\.\n•\ \\$col\\[255,128,0\\]\\{CTRL\\+Click\\}\ will\ remove\ marker\ from\ the\ tile\\.\n\nThese\ markers\ can\ be\ placed\ on\ tiles\ with\ numbers,\ if\ needed\\.␀=Показывает количество обвалившейся при добыче пыли на клетке, если вы присутствовали при обвале.\n\nУдерживайте $b{$col[255,128,0]{SHIFT}} при включении, чтобы активировать курсор сапёра:\n• $col[255,128,0]{Щелчок} ставит метку «опасно» [$font[monospaced,10]{$col[240,32,100]{$b{×}}}].\n• $col[255,128,0]{ALT+щелчок} ставит метку «безопасно» [$font[monospaced,10]{$col[32,220,80]{$b{·}}}].\n• $col[255,128,0]{SHIFT+щелчок} ставит метку «возможно» [$font[monospaced,10]{$col[193,87,251]{$b{?}}}].\n• $col[255,128,0]{CTRL+щелчок} удаляет метку с клетки.\n\nПри необходимости метки можно ставить на клетки с числами.
