# UTF-8 Russian translation catalog
gfx/fx/siegerange=Показывать радиусы действия всех осадных орудий на экране.
gfx/hud/buffs/boostspeed=Попутный ветер дует вам в спину, и вы чувствуете, словно летите над землей.
gfx/hud/buffs/chasingthedragon=Вы гнались за мерцающим синим драконом сквозь бескрайние алые поля, и оказались, абсолютно не помня, как попали сюда на самом деле, плавающим в теплом море шелка.
gfx/hud/buffs/fishpray=Вы просили и обрели. Пока этот бафф активен, ваши рыболовные способности значительно усилены.
gfx/hud/buffs/ganja=Вы теряетесь в густом травяном тумане и не уверены, как найти дорогу обратно. Зато с другой стороны вы ощущаете, что способны скушать целую лошадь.
gfx/hud/buffs/libertycap=$i{Вы съели немало грибов «Колпак свободы», и теперь странный ветер гуляет в вашем сознании, открывая прежде неведомые его уголки.}
gfx/hud/buffs/minesong=Вы поете песню шахтера, пока трудитесь, и гора уступает вам больше руды и камня за это.
gfx/hud/buffs/outlaw=Вы совершили серьезное преступление.\n\nВы нарушили Закон Мира, и, пока следы вашего преступления еще горячи, Мир не защитит вас. Будучи Преступником, ваш персонаж не может выйти из игры и останется, даже когда вы покинете игру.
gfx/hud/buffs/realm=Вы находитесь на территории славного Королевства и наслаждаетесь его благословением.
gfx/hud/buffs/redhanded=Вы недавно совершили серьезное преступление.\n\nВы не можете телепортироваться, имея статус Пойман на горячем, и, пока следы вашего преступления еще горячи, Мир не защитит вас. Будучи Пойманным на горячем, ваш персонаж не может выйти из игры и останется, даже когда вы покинете игру.
gfx/hud/buffs/smokefire=Вы затянулись табаком, и теперь от вас пахнет всем тем огнём, сквозь который вам довелось пройти. Огонь и Дым увеличивает ваши Интеллект и Духовность, но снижает Проворность.
gfx/hud/buffs/travelwear=Быстрое перемещение далось вам не просто так. Вы слишком устали и должны поспать либо отдохнуть каким-то иным способом, чтобы снова получить возможность пользоваться камнем Путешествий.
gfx/hud/buffs/vincant=Вы промолвили Заклинание Мести и следующий Назгул, посланный вами, будет самым страшным.
gfx/hud/buffs/visitor=Вы прошли через ворота и тем самым стали гостем этого места.Во время визита вы не можете совершать преступления.
gfx/hud/buffs/waylaid=Что-то блокирует дорогу, по которой вы перемещались, дав вам баф "Сбившийся с пути". Пока бафф активен, вы можете обойти или устранить препятствие и продолжить путешествие от любого путевого столба дороги, на которой вы сбились с пути.
gfx/hud/halp/ui=$font[serif,20]{00. Базовые взаимодействия}\n\n$font[serif,16]{1. Основы}\n• $col[246,229,34]{ЛКМ} - идти, $col[246,229,34]{ПКМ} - взаимодействовать.\n\n• В любой момент зажмите $col[246,229,34]{среднюю кнопку мыши}, чтобы вращать камеру.\n\n• Все открытые подсказки лежат в меню $col[246,229,34]{«Помощь!»}.\n$img[paginae/act/halp]\n\n\n$font[serif,16]{2. Инвентарь}\n• По умолчанию $col[246,229,34]{Tab} открывает личный инвентарь.\n\n• $col[246,229,34]{ЛКМ} по предмету в инвентаре поднимает его, $col[246,229,34]{ПКМ} - взаимодействует с ним (если можно).\n\n• $col[246,229,34]{Shift+ЛКМ} быстро переносит предмет в открытый контейнер.\n\n• $col[246,229,34]{Shift+Ctrl+ЛКМ} переносит этот предмет и все такие же в открытый контейнер.\n\n• $col[246,229,34]{Ctrl+ЛКМ} бросает предмет на землю.\n\n• $col[246,229,34]{Ctrl+Alt+ЛКМ} бросает этот предмет и все такие же на землю.\n\n• $col[246,229,34]{Shift+колесо} над открытым контейнером прокручивает предметы внутрь или наружу.\n\n• Некоторые действия с миром делаются так: возьмите предмет и $col[246,229,34]{ПКМ} по объекту. Например, сосуд наполняется, если держать его и $col[246,229,34]{ПКМ} по воде.\n\n\n$font[serif,16]{3. Ездовые животные}\n• Спешиться: $col[246,229,34]{Ctrl+ЛКМ} по земле.
gfx/hud/mmap/prov=$col[246,229,34]{Shift+колесо мыши} над этой кнопкой меняет прозрачность слоя провинций.
gfx/invobjs/addertongue=$i{Раздвоенный от противоречий, почерневший от каждой прошептанной лжи, он даже после смерти извивается, притворяясь живым.}\n
gfx/invobjs/ancientroot=Поедание Древнего корня лечит все раны на некоторое значение. Древние корни пропадают со временем.
gfx/invobjs/b12axe=Увеличивает время отката атак на 25%.
gfx/invobjs/bloodsoil=На какую-то часть этого мира вы предъявили свои права, и эти узы Крови и Земли служат символом, подтверждающим это. Пока они находятся в окне обучения, а вы продолжаете зарабатывать очки обучения, связь будет крепкой. Её нужно постоянно поддерживать, иначе и она, и ваше право собственности однажды исчезнут.
gfx/invobjs/brain=$i{Где-то в глубине всё ещё отдаются последние мысли о боли и страдании.}
gfx/invobjs/brain-tiny=$i{Лишь едва заметная рябь мысли когда-либо тревожила эти тихие воды.}
gfx/invobjs/brandingiron=Тавро может быть использовано для клеймения скота, чтоб обозначить его как вашу собственность. Для использования, нагрейте тавро в очаге или печи для обжига.
gfx/invobjs/brimstone=Сера пропадает со временем.
gfx/invobjs/brimstonebutterfly=$i{Лимонный трепет крыльев гонится за весенним ветром над травой, пробуждающейся от зимнего сна.}
gfx/invobjs/camomilecompress=Компресс из ромашки может быть применен против ран Что-то сломано, Тупая травма и Воспаленная рана. \n\nУдерживайте курсором Компресс из ромашки и нажмите правой кнопкой мыши на рану, которую вы хотите обработать, на экране «Здоровье и раны» листа персонажа.
gfx/invobjs/carrytagh=Эта половина свидетельства о владении позволяет владельцу поднимать и переносить предмет, на котором закреплена вторая половина, с полными правами собственности.\n
gfx/invobjs/castingmaterial=Песок и глина - распространённые материалы для литейных форм.
gfx/invobjs/cheesetray=Поддон с сыром вмещает четыре куска творога и, будучи помещенным в сырную стойку, превращает его в сыр.
gfx/invobjs/clay-fine=Некоторые виды глины, например ямная или мыльная, считаются тонкими и нужны для особых изделий.
gfx/invobjs/coldcompress=Холодный компресс можно применить для лечения Шишек и Сотрясения.\n\nСо временем он тает.\n\nДержа мышкой Холодный компресс, кликните правой клавишей мышки на нужную рану на странице "Здоровье и Раны" листа вашего персонажа.
gfx/invobjs/diversweight=«Груз ныряльщика» позволяет собирать ресурсы под поверхностью глубокой воды.
gfx/invobjs/dowrod=Палочка поиска воды указывает вам направление, в котором уровень подземных вод растет. Это знание можно использовать, чтобы найти место для более лёгкой постройки колодца.
gfx/invobjs/dumbledore=$i{Неуклюже жужжа, подпрыгивая и кувыркаясь, всё вперёд и вперёд - во веки веков.}
gfx/invobjs/exquisiterot=Изысканная гниль – эффективный дубильный материал.
gfx/invobjs/exquisiterotu=Изысканная гниль – эффективный дубильный материал. Перед тем как использовать, гниль требуется на некоторое оставить мокнуть в дубильном чане.
gfx/invobjs/feltinlay=При успешной инкрустации предмета войлочная вставка открывает два новых слота для инкрустации вместо одного.\n
gfx/invobjs/fetter=Кандалы Назгула привязывают духа мщения к рунному дольмену и посылают на поиски мести.
gfx/invobjs/fetterbroken=Эти оковы Назгула, значит привязанный к ним призрак был побежден.
gfx/invobjs/firebrand=Кликните правой клавишей мыши, чтобы зажечь подходящий объект.
gfx/invobjs/flintsteel=Кликните правой клавишей мыши, чтобы зажечь подходящий объект.
gfx/invobjs/gametime=Этот жетон включает в себя месяц оплаченного игорового времени и вы можете добавить его к текущему аккаунту правым кликом.
gfx/invobjs/gauze=Бинт может быть использован для лечения травм типа Сильный порез, Глубокие порезы, Поцелуй клинка, Ссадины и травм тупым оружием, однако для его использования необходимо освободить правый слот на голове.\n\nДля лечения, держа мышкой бинт, откройте раздел "Здоровье и раны"на вашем листе персонажа, кликните правой клавишей на нужную рану и нажмите Лечить.
gfx/invobjs/graygrease=Возьмите жир в руку и щёлкните правой кнопкой по ране, которую хотите вылечить, в разделе «Здоровье и раны» листа персонажа.\n
gfx/invobjs/hand-give=Рука дающая – абстрактный предмет, связывающий ячейку товара на прилавке с контейнером. Из контейнера с Рукой дающей продукты будут извлекаться и продаваться через торговый прилавок.
gfx/invobjs/hand-take=Рука берущая – абстрактный предмет, связывающий ячейку цены на прилавке с контейнером. Товары, полученные прилавком в процессе торговли, будут помещены в контейнер с Рукой берущей.
gfx/invobjs/hartshornsalve=Мазь из рога используется для лечения Жестоких ушибов, Фингала и травм от тупого оружия.\n\nДля этого, держа мышкой мазь, откройте раздел "Здоровье и раны"на вашем листе персонажа, кликните правой клавишей на нужную рану и нажмите Лечить.
gfx/invobjs/hats/pastadish=$i{Подано с пылу с жару: упругое, свежее, тягучее и сочное.}\n
gfx/invobjs/herbs/camomile=Ромашка имеет целебные свойства и при употреблении может исцелить несколько очков ранений, распределенных между травмами определенных видов.
gfx/invobjs/herbs/crocus=$i{Первый победный трубный глас весны растапливает сугробы, возвещая возвращение королевы фей.}
gfx/invobjs/herbs/frostflower=$i{В сверкающем холодном инее этот цветок шепчет: последнее время года - прекраснейшее.}
gfx/invobjs/herbs/mandrake=Корни Мандрагоры пропадают со временем.
gfx/invobjs/herbs/rabbitfrost=$i{Лапка, легко ступавшая по свежему снегу, расцвела причудливым цветком.}
gfx/invobjs/herbs/seasponge=$i{Мягкое, упругое, полное воды - диковинное создание синих глубин.}
gfx/invobjs/herbs/tansy=$i{Золотые монеты солнце рассыпало по лугам и пустошам - горькая плата незваным гостям.}
gfx/invobjs/herbs/toadflax=$i{Когда ветер шелестит этими цветами, пахнущими болотом и сырой землёй, слышится тихое кваканье.}
gfx/invobjs/herbs/waybroad=Подорожник может быть применен к ране Глубокий порез. Это мягкое лекарство, но оно исцеляет медленно.\n\nУдерживайте Подорожник и нажмите правой кнопкой мыши на рану, которую хотите лечить на экране «Здоровье и раны» листа персонажа.
gfx/invobjs/herbs/yarrow=Тысячелистник можно использовать для лечения Ожогов муравьиной кислотой, Мелких травм и Царапин с порезами чтобы вылечить их на некоторое значение.
gfx/invobjs/icicle=Как только вы расколите Вечный лед, все предметы в вашем окне изучения будут моментально завершены. Вечный лед тает со временем.
gfx/invobjs/jar-u=Этот предмет нужно сначала обжечь в печи, чтобы его можно было использовать.
gfx/invobjs/key=Использование ключа позволяет вам открывать двери/замки, для которых он сделан, но только изнутри. (Визуально двери обычно открываются наружу.)
gfx/invobjs/key-big=Мастер-ключ позволяет вам открывать двери/замки с любой стороны, а также менять сами замки.
gfx/invobjs/leaf-heartwood=Листья Сердца леса восстанавливают Прыжковую усталость, если их съесть.
gfx/invobjs/leech=Пиявки преобразуют травмы типа Отёк, Раздражение, Разукрашенное лицо и травмы от тупых предметов в Ожоги от пиявок, которые медленно залечиваются сами по себе.
gfx/invobjs/leechbloat=Эта пиявка наелась. Если вы снимете её, то она снова нагуляет аппетит через некоторое время.
gfx/invobjs/lock=После изготовления замок ставится на ворота: возьмите его на курсор и кликните правой кнопкой по воротам. При установке вы получите мастер-ключ от этих ворот и замка.\n\nЗамок можно привязать к уже существующему мастер-ключу: возьмите ключ на курсор и кликните правой кнопкой по ещё не установленному замку. Установка привязанного замка не даст новый ключ - на него будет работать тот ключ, к которому вы его привязали.
gfx/invobjs/lock-metal=После изготовления замок ставится на ворота: возьмите его на курсор и кликните правой кнопкой по воротам. При установке вы получите мастер-ключ от этих ворот и замка.\n\nЗамок можно привязать к уже существующему мастер-ключу: возьмите ключ на курсор и кликните правой кнопкой по ещё не установленному замку. Установка привязанного замка не даст новый ключ - на него будет работать тот ключ, к которому вы его привязали.
gfx/invobjs/lock-steel=После изготовления замок ставится на ворота: возьмите его на курсор и кликните правой кнопкой по воротам. При установке вы получите мастер-ключ от этих ворот и замка.\n\nЗамок можно привязать к уже существующему мастер-ключу: возьмите ключ на курсор и кликните правой кнопкой по ещё не установленному замку. Установка привязанного замка не даст новый ключ - на него будет работать тот ключ, к которому вы его привязали.
gfx/invobjs/lock-wood=После изготовления замок ставится на ворота: возьмите его на курсор и кликните правой кнопкой по воротам. При установке вы получите мастер-ключ от этих ворот и замка.\n\nЗамок можно привязать к уже существующему мастер-ключу: возьмите ключ на курсор и кликните правой кнопкой по ещё не установленному замку. Установка привязанного замка не даст новый ключ - на него будет работать тот ключ, к которому вы его привязали.
gfx/invobjs/mandrakespirited=Корни мандрагоры портятся со временем.
gfx/invobjs/matchbox=Нажмите правой кнопкой мыши по зажигаемому объекту, чтоб поджечь его.
gfx/invobjs/moltenglass=$i{Масса раскалённого расплавленного стекла отражает огонь внутри себя и жаждет остыть, обретя более совершенную форму.}
gfx/invobjs/mudointment=Мазь из грязи может быть применена против травм Царапины и порезы, Разукрашенное лицо и Ушиб. \n\nУдерживайте курсором Мазь из грязи и нажмите правой кнопкой мыши на рану, которую вы хотите обработать, на экране «Здоровье и раны» листа персонажа.
gfx/invobjs/opium=Курение опиума может способствовать заживлению травм Воспаленная рана, Ушиб, Сотрясение мозга, Тяжелое увечье и Тупая травма.
gfx/invobjs/packrack=Бык или корова, экипированные вьюком, могут перевозить два объекта и ряд предметов.
gfx/invobjs/pipe-clay-u=Этот предмет необходимо обжечь в печи перед использованием.
gfx/invobjs/rawsalt=Крупные куски кристаллической соли, например «Кристаллы соли» или «Галит».
gfx/invobjs/rootfill=Корневая пломба мгновенно излечивает Глубокий порез, а также превращает Жестокое отсечение в Глубокий порез.\n\nУдерживайте Корневую пломбу и нажмите правой кнопкой мыши на рану, которую вы хотите обработать, на экране «Здоровье и раны» листа персонажа.
gfx/invobjs/saddlebags=Лошадь, экипированная переметной сумой, может перевозить два объекта и ряд предметов.
gfx/invobjs/saltcrystal=Кристаллы Соли увеличивают голод, если их съесть.
gfx/invobjs/silkpurse=Кошельки вмещают монеты, а сами кошельки можно хранить в поясах.\n
gfx/invobjs/small/cheesetray=Поддон для сыра содержит четыре кусочка творога, которые превращаются в сыр, если поместить его в Стойки для сыра.
gfx/invobjs/small/glassrod=Стеклодувная трубка необходима для изготовления многих округлых стеклянных изделий.\n
gfx/invobjs/small/packrack=Бык или корова, экипированные вьюком, могут перевозить два объекта и ряд предметов.
gfx/invobjs/small/saddlebags=Лошадь, экипированная переметной сумой, может перевозить два объекта и ряд предметов.
gfx/invobjs/soapbar=Бруски мыла могут быть использованы для промывания Воспаленных ран.
gfx/invobjs/squirrelhair=$i{Тончайшие пряди нежнейшего меха, оставленные случайно или по ужасному несчастью.}
gfx/invobjs/stack=Чтобы сложить предметы в стак, $col[246,229,34]{кликните правой кнопкой} один предмет на другой и...\n• Удерживайте $col[246,229,34]{Shift}, чтобы добавить в стак все такие предметы поблизости.\n• Удерживайте $col[246,229,34]{Ctrl+Shift}, чтобы сложить в стаки все такие предметы.\n\nНа самих стаках...\n• $col[246,229,34]{Shift+ПКМ} - достать один предмет из стака.\n• $col[246,229,34]{Ctrl+Shift+ПКМ} - достать все предметы из стака.
gfx/invobjs/stingingpoultice=Жгучая припарка может быть использована для лечения Глубоких порезов и Синяков. Для этого, держа мышкой припарку, откройте раздел "Здоровье и раны"на вашем листе персонажа, кликните правой клавишей на нужную рану и нажмите Лечить.
gfx/invobjs/stitchpatch=Заплатку можно применить для лечения ран типа Сильный порез и Кишки наружу, но лечение происходит очень медленно.\n\n Для лечения, держа мышкой заплатку, откройте раздел "Здоровье и раны"на вашем листе персонажа, кликните правой клавишей на нужную рану и нажмите Лечить.
gfx/invobjs/string=Множество вещей можно использовать в роли ниток, например, растительные волокна или кожаные ремешки.
gfx/invobjs/tapeworm=$i{Незваный гость, скрывающийся во тьме и не сулящий ничего доброго.}
gfx/invobjs/tarsticks=Смоляные палочки можно использовать, чтобы разложить костёр, в качестве топлива и как материал для крыш.
gfx/invobjs/tinwarrior=$i{Поднятый меч и боевой клич, застывшие во времени и холодные на ощупь.}
gfx/invobjs/toadbutter=Жабья Слизь может быть применена против ран Тупая травма, Разукрашенное лицо, Фингал и Поцелуй клинка. \n\nУдерживайте курсором Жабью Слизь и нажмите правой кнопкой мыши на рану, которую вы хотите обработать, на экране «Здоровье и раны» листа персонажа.
gfx/invobjs/totemskull=Череп исполинского существа, обладающий значительной силой и величием, например череп мамонта или кашалота.
gfx/invobjs/weavegrass=Любая пригодная для плетения трава или солома, например «Камыш», «Высокая трава» или «Солома».
paginae/act/alchbook=Книга алхимии хранит открытые вами рецепты алхимических эликсиров.
paginae/act/crime=Ваш персонаж откажется совершать преступления, пока вы не активируете режим преступника. Каждый раз, совершая преступления, вы будете оставлять следы, которые могут быть использованы другими игроками. чтобы выследить вас.\n\nБерегитесь! Все четыре типа серьезных преступлений -- воровство, вандализм, побои и убийство -- поставят вас "Вне закона" на некоторое время, не давая персонажу выйти из игры.\n\nСовершение серьёзных преступлений может легко оставить вас без персонажа.
paginae/act/croster=Открыть учёт скота.
paginae/act/dig=Копание даёт разные результаты в зависимости от местности.\n\nНа некоторых типах местности оно добывает характерные для них ресурсы: например, песок на пляже или глину на мелководье.\n\nНа изменяемой местности, например в лесах и на равнинах, копание понижает поверхность и даёт грунт. Грунт можно вернуть, поднимая землю: удерживайте $col[246,229,34]{Shift} при взаимодействии с поверхностью с грунтом в руках.\n\nОбычно копание или подсыпка меняет ближайший к месту щелчка угол между клетками. Если дополнительно удерживать $col[246,229,34]{Ctrl}, действие выравнивает четыре угла выбранной клетки: по самому низкому при копании или по самому высокому при подсыпке.
paginae/act/equipment=Пытается экипировать предметы из пояса, а уже надетые предметы убрать в пояс.
paginae/act/fns=Простые приспособления для разведения огня.
paginae/act/grass=Любые семена культурных растений можно использовать для посадки травы.
paginae/act/halp=В этом меню собраны игровые подсказки и справка клиента.
paginae/act/havenhearth=Основные действия и постройки, связанные с положением в мире, появлением персонажа и владением.
paginae/act/hearth=Костёр жизни связывает поселенца с этим миром. Обычно к нему можно быстро переместиться; иногда обстоятельства вынуждают вернуться к нему.\n\nПервый костёр жизни появляется при создании персонажа. Настоятельно рекомендуется всегда иметь такой костёр.
paginae/act/info=Включить или выключить отдельные элементы информации об объектах.
paginae/act/inspect=С помощью действия "Осмотреть" можно оценивать качество объектов.
paginae/act/itemcomb=Переключает автоматическое складывание предметов, собранных в мире: сорванных, срубленных, выкопанных и т.п.
paginae/act/laywoodchips=Посыпать щепой.
paginae/act/nopeace=Ваш персонаж откажется проходить сквозь врата в частной собственности, если сделав это, он станет Посетителем этой собственности. \n\nПерсонажи которые проходят сквозь частные врата обычно становится посетителями, что не позволяет совершать преступления против посещаемой собственности.
paginae/act/permshare=Переключает, будут ли распространяться ваши права доступа на вашу группу.
paginae/act/push=Толкать объекты.
paginae/act/repair=Ремонт расходует ресурсы из инвентаря и восстанавливает состояние повреждённых объектов. Нужные ресурсы зависят от объекта.
paginae/act/siegeptr=Показать дальность осады.
paginae/act/survey=Благодаря терраформированию вам доступны серьезные проекты по изменению окружающей природы путем выравнивания, подъема и снижения уровня и других вариантов взаимодействия. Терраформирование позволяет вам устанавливать уровни высот на определенных площадях с помощью добавления, убирания или простого перемещения земли.
paginae/act/swim=Ваш персонаж не полезет в омут, если "Плавание" не активировано. Будьте осторожны, плавание очень быстро истощает выносливость и, если она закончится, вы получите некоторый урон от удушья, при длительном получении которого можно умереть. Увеличение параметра "Телосложение" замедляет отток выносливости при плавании.
paginae/act/toggles=Дествия этой группы либо опасны, либо достаточно значимы, чтобы организовать их в режиме вкл/выкл.
paginae/act/tracking=Любое преступление -- проникновение, воровство, вандализм, нападение, побои и убийство -- оставляют подсказки согласно своим типам, и эти подсказки -- "Следы" -- могут быть использованы для того, чтобы найти преступника, с целью задать вопросы и, возможно, свершить правосудие. "След воровства" также позволит вам выследить непосредственно украденный предмет.\n\nСледы отображаются на карте и мини-карте в виде воняющих следов, но их можно видеть только при включенном Выслеживании.
paginae/act/travel-hearth=Быстро переместиться к своему костру жизни.
paginae/add/alchemy=Открывает окно алхимии для просмотра и записи ингредиентов, рецептов и проверенных сочетаний.
paginae/add/auto/aggro_all=Пытается атаковать всех находящихся поблизости игроков, не состоящих в вашей группе.
paginae/add/auto/aggro_one=Пытается атаковать ближайшее к курсору существо или переключить на него цель. Не выбирает игроков и лошадей, на которых едете вы или участники вашей группы.
paginae/add/auto/aggro_one_pvp=Пытается атаковать ближайшего к курсору игрока или переключить на него цель.
paginae/add/auto/mount_horse=Подзывает свистом ближайшую домашнюю лошадь и садится на неё, когда она подойдёт. Если лошадь совсем рядом, садится без свиста.
paginae/add/equip/bow=Пытается экипировать $img[gfx/invobjs/small/huntersbow,c,h=12]Охотничий лук или $img[gfx/invobjs/small/rangersbow,c,h=12]Лук следопыта.
paginae/add/equip/spear=Пытается экипировать $img[gfx/invobjs/small/boarspear,c,h=12]Кабанье копьё.
paginae/add/equip/sword-n-board=Пытается экипировать $img[gfx/invobjs/small/roundshield,c,h=12]Деревянный круглый щит и один из мечей:\n$img[gfx/invobjs/small/bronzesword,c,h=12]Бронзовый меч\n$img[gfx/invobjs/small/fyrdsword,c,h=12]Меч ополченца\n$img[gfx/invobjs/small/hirdsword,c,h=12]Меч дружинника.
paginae/add/equip/t-sacks=Пытается экипировать $img[gfx/invobjs/small/travellerssack,c,h=12]Мешки путешественника в обе руки.
paginae/add/foven4=Кладёт в ближайшую печь $col[32,245,255]{4} ветки из инвентаря.
paginae/add/fsmelter12=Кладёт в ближайшую плавильню $col[32,245,255]{12} кусков угля из инвентаря.
paginae/add/fsmelter9=Кладёт в ближайшую плавильню $col[32,245,255]{9} кусков угля из инвентаря.
paginae/add/info/animal-fleece=Отмечать животных, которых можно постричь.
paginae/add/info/barrel=Показывать содержимое бочек.
paginae/add/info/cheese=Показывать стадию созревания сыра на стойке.
paginae/add/info/health=Показывать степень повреждения объектов.
paginae/add/info/plant-growth=Показывать стадию роста культур.
paginae/add/info/quality=Показывать качество осматриваемых объектов.
paginae/add/info/sign=Показывать содержимое вывесок.
paginae/add/info/timer=Показывать таймеры плавилен и подобных объектов.
paginae/add/info/tree-content=Показывать семена, листья, кору и ветви деревьев и кустов значками.
paginae/add/info/tree-growth=Показывать рост деревьев и кустов.
paginae/add/inspect=Режим осмотра показывает имя ресурса объекта или клетки под курсором. Удерживайте $b{$col[255,128,0]{SHIFT}}, чтобы увидеть дополнительные сведения.
paginae/add/quest_help=Открывает список невыполненных условий активных заданий. Последние условия отмечены звездой, а условия заданий кредо - значком книги.
paginae/add/refill_drinks=Пытается наполнить все бурдюки, фляги и кувшины водой из ближайшей бочки с пресной водой или водоёма.
paginae/add/track=Отслеживает выбранный объект указателем, как у задания. CTRL+ПКМ по указателю удаляет его.
paginae/atk/artevade=Очки инициативы оппонентов: +1\n\nУменьшает: 20% · µ $col[128,255,160]{Сбивающая}, 20% · µ $col[128,192,255]{Изумляющая}, 20% · µ $col[255,255,128]{Сметающая}, 20% · µ $col[255,128,128]{Подавляющая}\nОткат: 40\n
paginae/atk/barrage=Оружие: любое холодное\n\nВес атаки: согласно оружию · µ\nТип атаки: $col[255,128,128]{Подавляющая}\nБреши: +10% $col[255,128,128]{Загнанный}\nУрон: согласно оружию · 25%\nОткат: 20\n\nЕсли у вашего противника больше 25% $col[255,128,128]{Подавляющей} бреши, Быстрые Удары также дают вам 1 очко инициативы против этого оппонента.\n\n$i{Если не указано иное, оружие использует в качестве веса атаки значение навыка Ближний бой вашего персонажа.}
paginae/atk/bloodlust=Вес блока: $img[gfx/hud/chr/unarmed,h=1ln] · 75% · µ\nОткат: 10\n\nКогда вас атакуют:\nБафф Жажда Крови заряжается на 25% · Δ. Когда вы атакуете противника, вес вашей атаки будет увеличен на четырехкратное значение баффа.\n
paginae/atk/chinup=Вес блока: $img[gfx/hud/chr/unarmed,h=1ln] · µ\nОткат: 10
paginae/atk/chop=Оружие: любое рубящее\nОчки инициативы: 1\n\nВес атаки: согласно оружию · µ\nТип атаки: $col[128,255,160]{Сбивающая}\nБреши: +15% $col[128,255,160]{Неусточивый}\nУрон: согласно оружию\nОткат: 40\n\n$i{Если не указано иное, оружие использует в качестве веса атаки значение навыка Ближний бой вашего персонажа.}
paginae/atk/cleave=Оружие: любое тяжелое рубящее\nОчки инициативы: 4+2\n\nВес атаки: согласно оружию · µ\nТип атаки: $col[128,192,255]{Изумляющая}, $col[255,128,128]{Подавляющая}\nБреши: +25% $col[255,128,128]{Загнанный}\nУрон: согласно оружию · 150%\nОткат: 80\n\n$i{Если не указано иное, оружие использует в качестве веса атаки значение навыка Ближний бой вашего персонажа.}
paginae/atk/combmed=Вес блока: $img[gfx/hud/chr/unarmed,h=1ln] · µ\nОткат: 10\n\nКогда вас атакуют:\nБафф Боевая Медитация заряжается на 25% · Δ. Когда вы атакуете противника, время отката вашей атаки будет сокращено на значение баффа.\n\nПока Боевая Медитация активна, все ваши атаки имеют 25% своего обычного веса.
paginae/atk/dash=Очки инициативы оппонентов: +2\n\nОткат: 80 / µ\n\nРывок полностью снимает вашу самую малую брешь.
paginae/atk/divehide=Нырок в укрытие.
paginae/atk/dorg=Вес блока: $img[gfx/hud/chr/unarmed,h=1ln] · 75% · µ\nОткат: 10\n\nКогда вас атакуют:\nВы получаете 0.75 · Δ очка инициативы против вашего оппонента.
paginae/atk/fdodge=Уменьшает: 15% · µ $col[128,255,160]{Сбивающая}\nОткат: 35\n\nЗа каждое очко бреши, потерянное вами при помощи Финта, ваш противник получает удвоенное количество очков бреши.
paginae/atk/flex=Вес атаки: $img[gfx/hud/chr/unarmed,h=1ln]\nУменьшает: 10% · µ $col[128,192,255]{Изумляющая}, 10% · µ $col[255,128,128]{Подавляющая}\nБреши оппонента: +15% $col[128,192,255]{Оглушенный}\nОткат: 30\n
paginae/atk/fullcircle=Оружие: любое холодное\n\nВес атаки: $img[gfx/hud/chr/melee,h=1ln] · 90% · µ\nТип атаки: $col[255,255,128]{Сметающая}, $col[255,128,128]{Подавляющая}\nБреши: +15% $col[128,255,160]{Неусточивый}, +5% $col[255,128,128]{Загнанный}\nУрон: согласно оружию\nОткат: 40\n\nПолный Круг атакует вашу главную цель и всех противников в пределах досягаемости.\n\n$i{Если не указано иное, оружие использует в качестве веса атаки значение навыка Ближний бой вашего персонажа.}
paginae/atk/gojug=Очки инициативы: 2+2\n\nВес атаки: $img[gfx/hud/chr/unarmed,h=1ln] · µ\nТип атаки: $col[128,255,160]{Сбивающая}, $col[255,128,128]{Подавляющая}\nБреши: +15% $col[128,255,160]{Неусточивый}, +10% $col[255,128,128]{Загнанный}\nУрон: 40\nТяжкие повреждения: 30%\nОткат: 45
paginae/atk/guard=Защитная стойка.
paginae/atk/haymaker=Вес атаки: $img[gfx/hud/chr/unarmed,h=1ln] · µ\nТип атаки: $col[255,255,128]{Сметающая}\nБреши: +15% $col[255,255,128]{Шатающийся}\nУрон: 20\nТяжкие повреждения: 15%\nОткат: 50
paginae/atk/jump=Уменьшает: 20% · µ $col[255,255,128]{Сметающая}\nОткат: 25
paginae/atk/kick=Очки инициативы: 1\n\nВес атаки: $img[gfx/hud/chr/unarmed,h=1ln] · µ\nТип атаки: $col[255,255,128]{Сметающая}\nБреши: +20% $col[255,255,128]{Шатающийся}\nУрон: 25\nТяжкие повреждения: 15%\nОткат: 45
paginae/atk/knockteeth=Очки инициативы: 1\n\nВес атаки: $img[gfx/hud/chr/unarmed,h=1ln] · µ\nТип атаки: $col[255,128,128]{Подавляющая}\nБреши: +20% $col[255,128,128]{Загнанный}\nУрон: 30\nТяжкие повреждения: 25%\nОткат: 35\n
paginae/atk/lefthook=Вес атаки: $img[gfx/hud/chr/unarmed,h=1ln] · µ\nТип атаки: $col[128,192,255]{Изумляющая}\nБреши: +15% $col[128,192,255]{Оглушенный}\nУрон: 15\nТяжкие повреждения: 10%\nОткат: 40
paginae/atk/lowblow=Вес атаки: $img[gfx/hud/chr/unarmed,h=1ln] · µ\nТип атаки: $col[128,192,255]{Изумляющая}\nБреши: +10% $col[128,255,160]{Неусточивый}\nУрон: 20\nТяжкие повреждения: 30%\nОткат: 50\n\nУдар ниже пояса дает вам 1 очко инициативы против вашего оппонента.
paginae/atk/oakstance=Вес блока: $img[gfx/hud/chr/unarmed,h=1ln] · 150% · µ\nОткат: 10\n\nКогда вас атакуют:\nваша самая большая брешь уменьшается на 5% · Δ.\n\nПока Стойка Дуба активна, все ваши атаки имеют 50% своего обычного веса.\n
paginae/atk/oppknock=Очки инициативы: 4\n\nВес атаки: $img[gfx/hud/chr/unarmed]\nОткат: 45\n\nУлучшить Возможность увеличивает самую большую брешь вашего противника на 40% · µ.
paginae/atk/parry=Вес блока: $img[gfx/hud/chr/melee,h=1ln] · 80% · µ\nОткат: 10\n\nКогда вас атакуют:\nБреши: +10% $col[128,192,255]{Оглушенный}\n\nТребуется экипированный меч, чтоб наносить парированием брешь оппоненту.\n
paginae/atk/pow=Вес атаки: $img[gfx/hud/chr/unarmed,h=1ln] · 80% · µ\nТип атаки: $col[128,255,160]{Сбивающая}\nБреши: +15% $col[128,255,160]{Неусточивый}\nУрон: 10\nТяжкие повреждения: 5%\nОткат: 30
paginae/atk/punchboth=Вес атаки: $img[gfx/hud/chr/unarmed,h=1ln] · µ\nТип атаки: $col[128,255,160]{Сбивающая}, $col[255,255,128]{Сметающая}\nБреши: +15% $col[255,255,128]{Шатающийся}\nУрон: 10\nТяжкие повреждения: 7.5%\nОткат: 40\n\nУдарить по Двоим атакует вашу главную цель и еще одного противника в пределах досягаемости.
paginae/atk/qdodge=Уменьшает: 20% · µ $col[128,255,160]{Сбивающая}\nОткат: 25\n
paginae/atk/ravenbite=Оружие: любой топор\nОчки инициативы: 4\n\nВес атаки: согласно оружию · µ\nТип атаки: $col[128,255,160]{Сбивающая}, $col[255,255,128]{Сметающая}\nБреши: +15% $col[128,255,160]{Неусточивый}, +15% $col[255,255,128]{Шатающийся}\nУрон: согласно оружию · 110%\nОткат: 40\n\n$i{Если не указано иное, оружие использует в качестве веса атаки значение навыка Ближний бой вашего персонажа.}
paginae/atk/regain=Уменьшает: 20% · µ $col[128,255,160]{Сбивающая}, 20% · µ $col[255,255,128]{Сметающая}\nОткат: 35\n
paginae/atk/ripapart=Очки инициативы: 6\n\nВес атаки: $img[gfx/hud/chr/unarmed,h=1ln] · µ\nТип атаки: $col[128,255,160]{Сбивающая}, $col[128,192,255]{Изумляющая}, $col[255,255,128]{Сметающая}, $col[255,128,128]{Подавляющая}\nБреши: +7.5% $col[128,255,160]{Неусточивый}, +7.5% $col[128,192,255]{Оглушенный}, +7.5% $col[255,255,128]{Шатающийся}, +7.5% $col[255,128,128]{Загнанный}\nУрон: 50\nТяжкие повреждения: 30%\nОткат: 60
paginae/atk/shield=Вес блока: $img[gfx/hud/chr/melee,h=1ln] · 250% · µ\nОткат: 10\n\nЕсли маневр Поднять щит выполняется без щита, его вес блока будет 50% вместо 250%.
paginae/atk/sidestep=Уменьшает: 20% · µ $col[128,192,255]{Изумляющая}\nОткат: 25
paginae/atk/sideswipe=Оружие: любое рубящее\n\nВес атаки: согласно оружию · µ\nТип атаки: $col[255,255,128]{Сметающая}\nБреши: +7.5% $col[255,255,128]{Шатающийся}\nУрон: согласно оружию · 75%\nОткат: 25\n\n$i{Если не указано иное, оружие использует в качестве веса атаки значение навыка Ближний бой вашего персонажа.}
paginae/atk/sos=Оружие: любой меч\nОчки инициативы: 2\n\nВес атаки: согласно оружию · µ\nТип атаки: $col[128,192,255]{Изумляющая}, $col[255,255,128]{Сметающая}\nБреши: +30% $col[255,255,128]{Шатающийся}\nУрон: согласно оружию\nОткат: 50\n\nШторм мечей атакует до пяти оппонентов в пределах досягаемости, начиная с главной цели. Цели получюат 100%, 125%, 150%, 175% и 200% повреждений соответственно урону оружия.\n\n$i{Если не указано иное, оружие использует в качестве веса атаки значение навыка Ближний бой вашего персонажа.}
paginae/atk/stealthunder=Вес атаки: $img[gfx/hud/chr/unarmed,h=1ln] · µ\nТип атаки: $col[128,192,255]{Изумляющая}, $col[255,255,128]{Сметающая}\nБреши: +10% $col[128,192,255]{Оглушенный}\nУрон: Нет\nОткат: 40\n\nМало того, что эта атака не блокируется, Кража грома отнимает 3 очка инициативы вашей цели и передает 2 из них вам. Может применяться на небольшом расстоянии.
paginae/atk/sting=Оружие: любое колющее\nОчки инициативы: 2\n\nВес атаки: согласно оружию · µ\nТип атаки: $col[128,255,160]{Сбивающая}, $col[128,192,255]{Изумляющая}\nБреши: +20% $col[128,192,255]{Оглушенный}, +10% $col[255,255,128]{Шатающийся}\nУрон: согласно оружию · 125%\nОткат: 50\n\n$i{Если не указано иное, оружие использует в качестве веса атаки значение навыка Ближний бой вашего персонажа.}
paginae/atk/takeaim=Откат: 30 / µ\n\nВзять прицел дает вам 1 очко инициативы против вашего оппонента, и может быть применен на расстоянии.\n\nВремя отката увеличивается на 20% за каждое имеющиеся у вас очко инициативы.
paginae/atk/takedown=Очки инициативы: 3\n\nВес атаки: $img[gfx/hud/chr/unarmed,h=1ln] · µ\nТип атаки: $col[255,255,128]{Сметающая}, $col[255,128,128]{Подавляющая}\nБреши: +30% $col[255,255,128]{Шатающийся}\nУрон: 40\nТяжкие повреждения: 30%\nОткат: 50
paginae/atk/think=Очки инициативы: 0+4\n\nОткат: 40 / µ\n\nОбдумать дает вам 2 очка инициативы против вашего оппонента, и может быть применено на расстоянии.\n\nВремя отката увеличивается на 20% за каждое имеющиеся у вас очко инициативы.
paginae/atk/toarms=Вес блока: $img[gfx/hud/chr/melee,h=1ln] · µ\nОткат: 10
paginae/atk/uppercut=Вес атаки: $img[gfx/hud/chr/unarmed,h=1ln] · 0.8 · µ\nТип атаки: $col[128,255,160]{Сбивающая}, $col[128,192,255]{Изумляющая}\nБреши: +15% $col[255,255,128]{Шатающийся}\nУрон: 30\nТяжкие повреждения: 5%\nОткат: 30
paginae/atk/watchmoves=Очки инициативы оппонентов: +1\n\nВес атаки: $img[gfx/hud/chr/unarmed,h=1ln]\nУменьшает: 30% · µ $col[128,192,255]{Изумляющая}\nОткат: 45\n\nНаблюдай дает вам 1 очко инициативы против вашего оппонента.
paginae/atk/yieldground=Уменьшает: 30% · µ $col[128,255,160]{Сбивающая}, 30% · µ $col[255,128,128]{Подавляющая}\nВаши бреши: +10% $col[128,192,255]{Оглушенный}, +10% $col[255,255,128]{Шатающийся}\nОткат: 30\n
paginae/atk/zigzag=Очки инициативы оппонентов: +2\n\nУменьшает: 50% · µ $col[255,255,128]{Сметающая}, 50% · µ $col[255,128,128]{Подавляющая}\nОткат: 50
paginae/bld/anf=Постройки для обустройства и содержания ферм, полей и животных.
paginae/bld/barrel=Бочка способна хранить вещества и жидкости, предотвращая их порчу.
paginae/bld/barterhand=Столб бартера накрывают дающей или принимающей рукой: он забирает и кладёт товар из контейнеров и куч в радиусе.
paginae/bld/beds=Сон в качественной кровати ускоряет заживление ран и уменьшение усталости от путешествий.
paginae/bld/beehive=Улей ускоряет рост растений в области своего действия и в процессе производит мёд с воском.
paginae/bld/belltower=Массивная опора для колокола. Потяните верёвку ($col[246,229,34]{ПКМ}), чтобы позвонить. Звук зависит от металла, из которого сделан колокол.
paginae/bld/birdhouse=Голубей можно держать и кормить в скворечнике, но там они не размножаются. Приручённый голубь гнездится в скворечнике и возвращается туда, если его отпустить.\n\nВозьмите приручённого голубя и кликните правой кнопкой по скворечнику, чтобы поселить его.
paginae/bld/bnc=В этой категории находятся неподвижные сооружения.
paginae/bld/bpyre=Горящий шалаш из веток около 15 минут дымит на диких пчёл и позволяет разорить гнездо.
paginae/bld/catapult=Катапульта - осадное орудие, которое может метать огромные булыжники в стены и строения.\n\nКатапульта заряжается маленьким камнями и получает урон при передвижении и использовании.
paginae/bld/cellardoor=В большинстве домов на нижнем этаже можно выкопать погреб киркой и получить дополнительный уровень.
paginae/bld/chickencoop=Куры в курятнике с кормом и водой несут яйца. Если в момент кладки там есть петух, яйца позже вылупятся - кладите их в инвентаре курятника хотя бы на две клетки ниже кур.
paginae/bld/cistern=Цистерна – это недвижимое, но большое хранилище для жидкостей.
paginae/bld/claim=Установка символа Частной собственности позволяет вам использовать очки Обучения чтобы установить и затем расширить область, объявляемую личной. В этой области объекты не подвергаются воздействию времени а также в некоторой степени защищены от воров и вандалов(Частная собственность распространяется и на подземные территории).\n\n Все заявленные в частную собственность территории будут представлены в виде предмета "Связь Крови и Земли" в Отчете об Обучении(Ctrl + T).\n\nВы можете настроить привилегии доступа для ваших друзей или целых групп в списке ваших знакомых (Ctrl + B).
paginae/bld/column=Каменная колонна защищает свод от обрушения в области своего действия.
paginae/bld/compostbin=Ящик для компоста, наполненный практически любым разлагающимся материалом, перерабатывает его в почву.
paginae/bld/coronationstone=Построить камень коронации для основания Королевства.
paginae/bld/crucible=Тигель нужен для тонкой плавки: слитки в болванки и обратно, бронза из олова и меди. Горит и углём, и дровами, но часть рецептов требует уголь.
paginae/bld/cupboard=Шкаф довольно хрупок, поэтому его нельзя устанавливать на улице.
paginae/bld/decor=Мебель, предназначенная преимущественно для украшения или показа предметов.
paginae/bld/demijohn=Большая бутыль может быть использована для брожения и других видов трансформации жидкостей, если это возможно, например, для превращения виноградного сока в вино или уксус. Большинство жидкостей не подвержены брожению.
paginae/bld/dframe=На сушилке сушат сырые шкуры и семена с ветра.
paginae/bld/diversweight=Груз ныряльщика позволяет собирать ресурсы со дна глубокой воды.
paginae/bld/dolmen=Рунный дольмен позволяет вам вызывать Назгулов, чтобы отомстить за совершенные преступления.
paginae/bld/dovecote=Дикие голуби могут на время поселиться в голубятне, особенно если есть еда, вода, место и уединение.
paginae/bld/dressingtable=За туалетным столиком можно сменить причёску и бороду.
paginae/bld/dugout=Выдолбите колоду и выжгите сердцевину. Держите источник огня и кликните правой кнопкой по долблёнке, чтобы поджечь.
paginae/bld/ene=Вспомогательные сооружения и конструкции, расширяющие функциональные возможности других построек, собраны здесь.
paginae/bld/fineryforge=В горне из чугунных болванок получают крицу, которую затем проковывают на наковальне в кованое железо.
paginae/bld/fireplace=Очаг даёт долгий огонь; на него ставят вертел или решётку. Некоторые продукты можно запекать в очаге.
paginae/bld/furn=Предметы для обустройства помещений и украшения.
paginae/bld/gemwheel=Станок гранильщика может быть использован для улучшения степени обработки драгоценных камней от грубого до гладкого, кабошона, груши, сердца, и до бриллиантовой огранки. При каждой обработке существует риск, что в случае неудачи размер и качество обработки самоцвета будут уменьшены на одну степень.\n\nСтанок гранильщика не может применяться для огранки драгоценных камней большего размера, чем камень, который был использован при его постройке.
paginae/bld/glasspaneframe=Охлаждая расплавленное стекло на зеркале из ртути, можно получить ровные стеклянные панели.
paginae/bld/granary=Зернохранилище - это большое, но недвижимое хранилище для зерна и семян.
paginae/bld/gravecairn=Могила может быть использована для захоронения погибшего предка, что, в свою очередь, вознаградит вас частью его очков опыта, а именно 20% за тело и дополнительно 10% за череп.
paginae/bld/greenhouse=В теплицах можно выращивать растения даже зимой, но посадочные участки внутри необходимо регулярно мульчировать заново.
paginae/bld/iconsign=Знак может отображать любой предмет из инвентаря. Держите предмет мышкой и затем кликните правой кнопкой на знак.
paginae/bld/kiln=В печи для обжига обжигают кирпич, керамику и прочее сырьё.
paginae/bld/knarr=Кнорр - крупный транспортный корабль, способный вместить до 10 человек и с 64 отделениями для груза.
paginae/bld/knarrdock=Деревянный причал для судов. Корабль можно быстро перенести к доку, назначенному домашним.
paginae/bld/knarrsail=Парус кнорра делается и ставится отдельно от корабля, но без него судно не ходит.
paginae/bld/lanternpost=Между двумя стойками можно натянуть верёвку: держите верёвку и кликайте стойки правой кнопкой по очереди. На верёвку вешают фонари.
paginae/bld/leanto=Если шалаш заявлен во владение, в нём можно спрятать два предмета. Вы считаетесь их законным владельцем: чтобы их забрать, вору придётся совершить вандализм или кражу.
paginae/bld/liquidcontainers=Ёмкости для жидкостей.
paginae/bld/lnf=Мебель, создающая или использующая свет, огонь или дым.
paginae/bld/loom=Ткацкий станок довольно хрупок, поэтому его нельзя устанавливать на улице.
paginae/bld/machinemill=Мельничный станок ставится внутри ветряной или водяной мельницы и сам перемалывает зерно, которое в него положили.
paginae/bld/mannequin=На манекене может храниться один полный комплект снаряжения для показа и удобной смены.
paginae/bld/minebeam=Шахтная балка защищает свод от обрушения в области своего действия.
paginae/bld/minepyre=Шахтный костёр размягчает пол пещеры, чтобы копать шахту глубже. Постройте, подожгите и дайте прогореть.
paginae/bld/minesupport=Подпорка защищает свод от обрушения в области своего действия.
paginae/bld/minevator=Шахтный подъёмник возит грузы между ярусами шахты. Постройте его и продлите на нижние уровни.
paginae/bld/moundbed=Живое тепло холмовой грядки хранит вокруг неё лето. В радиусе холмовой грядки зима не властна.\n\nЕсли сначала полить, на холмовых грядках можно сажать травы.
paginae/bld/noticeboard=Доска объявлений позволяет вам вывешивать исписанные пергаменты для прочтения их другими.
paginae/bld/oven=В кухонной печи пекут хлеб, выпечку и другие блюда.
paginae/bld/picklingcrock=Ёмкости для засолки позволяют засаливать продукты, например яйца, сельдь, огурцы или оливки, если в них достаточно рассола.
paginae/bld/postbox=В почтовый ящик можно класть предметы, даже если он закрыт и заперт. Возьмите предмет и кликните правой кнопкой по ящику.
paginae/bld/primsled=Простые сани для перевозки груза по суше. Пустые их можно нести на спине, гружёные - тащить за собой.
paginae/bld/primsmelter=Дровяная печь, в которой можно плавить медную, оловянную, свинцовую, золотую и серебряную руду. Использование мехов ускоряет плавку.
paginae/bld/primtent=$col[255,255,255]{• Простую палатку можно свернуть, перенести и установить в другом месте.\n • Владельцем считается тот, кто установил палатку.\n • Вход в палатку считается вандализмом, если владелец не открыл вход или не дал разрешение вашей группе.\n • Преступлением считается только вход. Палатка не защищает находящиеся внутри вещи правом владения.\n • Внутри палатки нельзя выйти из игры.}
paginae/bld/quern=Чтобы заняться работой по камню кликните указателем в виде долота на нужный камень.
paginae/bld/rabbithutch=Кролики размножаются в клетке, если есть корм и вода.
paginae/bld/raft=Плоты можно использовать для переправы предметов через глубокую воду. Они состоят из двух частей. Чтобы построить плот, соберите обе части на воде.\n\nСтоя на плоту, кликните по нему правой кнопкой, затем левой - по предмету, который хотите погрузить.
paginae/bld/rnl=Дорожные указатели и другие постройки для быстрого перемещения.
paginae/bld/ropewalk=На верёвочном станке из нитей скручивают верёвку.
paginae/bld/rscaffold=Землю перед подпорными лесами можно поднять выше обычного, сформировав насыпь.
paginae/bld/runestone=Чтобы заняться работой по камню кликните указателем в виде долота на нужный камень.
paginae/bld/sawmill=Лесопилку можно построить внутри ветряной или водяной мельницы. Она автоматически распиливает помещённые в неё брёвна на доски.
paginae/bld/sleigh=Упряжные сани - повозка, которую тянет рабочее животное, часто северный олень. Вмещают двух пассажиров и груз.
paginae/bld/smelter=Угольная плавильня плавит все виды руды.
paginae/bld/smokeshed=В коптильне коптят мясо и улучшают его FEP. Эффект зависит от породы дров.
paginae/bld/snekkja=Снеккья - небольшое океанское судно: до 4 человек и 16 единиц груза. Скорость растёт с качеством.
paginae/bld/snekkjasail=Парус снеккьи делается и ставится отдельно, но без него судно не ходит.
paginae/bld/steelcrucible=Стальные тигли превращают бруски кованого железа в сталь путём насыщения углеродом. Если топливо закончится раньше, процесс прервётся и начнётся заново.
paginae/bld/still=Дистиллятор перегоняет вещества: вино в бренди, солёную воду в пресную, живицу теребинта в скипидар.
paginae/bld/stoneendstone=Дорожные указатели служат началом и концом проложенных между ними дорог, образующих маршруты быстрого перемещения.\n\nВозможных маршрутов: 4\nДальность размещения: большая
paginae/bld/studycircle=Когда изучение диковинки завершается, вы автоматически берёте и начинаете изучать следующую диковинку с учебного стола.
paginae/bld/studydesk=По завершению изучения курьезов, вы автоматически будете извлекать для изучения новые из размещенных в вашем столе для изучения.
paginae/bld/symbelfire=Совместное поедание пищи (персонажи должны быть в группе и сидеть за столами все, без исключения) в зоне действия Пиршественного костра даёт вам бонусы, которые тем больше, чем выше показатель Харизмы у участников.
paginae/bld/tarkiln=Смоляная печь долго пережигает дерево в уголь и даёт дёготь.
paginae/bld/totemgate=Масштабная постройка, для которой нужен тотемный череп могучего зверя. Ворота можно закрывать и запирать, как обычные, но размещать их нужно вручную.
paginae/bld/trellis=Некоторые растения -- например, виноград -- могут быть выращены только на шпалерах.
paginae/bld/vilgate=Установка деревенского идола позволит вам основать деревню ценой 30000 очков обучения. Деревни могут быть использованы для расширенного захвата земель в частную собственность, а также, для управления большим количеством людей.
paginae/bld/vstand=На торговом прилавке задают предложения автоторговли.\n\nКрасная принимающая рука забирает товар из внешних контейнеров, зелёная дающая кладёт оплату наружу.
paginae/bld/wagonstation=Высокий помост, чтобы садиться в повозку. Повозку можно быстро перенести на станцию, назначенную домашней.
paginae/bld/wardrobe=Гардероб может содержать три полных комплекта снаряжения для удобной смены.
paginae/bld/watermill=Водяная мельница обеспечивает энергией два механизма, которые можно построить в любом месте внутри неё. Колесо должно быть погружено в воду, а основание мельницы - находиться на суше.
paginae/bld/well=Из колодца черпают воду. Стоимость постройки зависит от уровня грунтовых вод.
paginae/bld/wildernessbeacon=Чтобы зажечь Маяк, дайте ему имя. Пока Маяк горит, вновь появившийся персонаж может использовать его, как точку появления в мире. Маяк сгорает через один час или если был использован.
paginae/bld/windmill=Мельница даёт силу одному механизму, который ставится внутри неё.
paginae/bld/winerack=Храните ваши марочные вина в стильном винном шкафу.
paginae/bld/wnf=Чтобы построить стены или ограду, для начала вам необходимо заложить угловой стоб. В дальнейшем от него вы можете протягивать стены, сооружая ворота и новые угловые столбы. Заметьте, что ворота будут гораздо эффективнее, если вы установите на них замок.
paginae/bld/woodendstone=Дорожные указатели служат началом и концом проложенных между ними дорог, образующих маршруты быстрого перемещения.\n\nВозможных маршрутов: 1\nДальность размещения: малая
paginae/bld/woodensign=Деревянный знак отображает текст, который может прочитать любой желающий. Стройте и пишите, что захотите.
paginae/craft/alchemy=Создавайте сильнодействующие эликсиры, сочетая, перегоняя и преобразуя природные ингредиенты, чтобы раскрыть весь их потенциал.
paginae/craft/alchproc=Алхимическая обработка расходует ингредиенты, создавая новые обработанные материалы. Их возможные эффекты объединяются, а зачастую их число уменьшается, позволяя получить более чистые ингредиенты с меньшим риском вредных последствий.\n\nАлхимическое сырьё, например травы или минералы, имеет по четыре возможных эффекта.
paginae/craft/antpaste=Возьмите пасту в руки и щёлкните ПКМ по нужной ране в разделе «Здоровье и раны» листа персонажа.
paginae/craft/b12axe=На 25% увеличивает время отката атак.
paginae/craft/brandiron=Тавро может быть использовано для клеймения скота, чтоб обозначить его как вашу собственность. Для использования, нагрейте тавро в очаге или печи для обжига.
paginae/craft/camomilecompress=Компресс из ромашки может быть применен против ран Что-то сломано, Тупая травма и Воспаленная рана. \n\nУдерживайте курсором Компресс из ромашки и нажмите правой кнопкой мыши на рану, которую вы хотите обработать, на экране «Здоровье и раны» листа персонажа.
paginae/craft/carrytagw=Документ о владении можно применить к любому переносимому объекту, получив корешок документа. Его предъявитель может поднимать и переносить отмеченный объект с полными правами владельца.
paginae/craft/cheesetray=Поддон для сыра содержит четыре кусочка творога, которые превращаются в сыр, если поместить его в Стойки для сыра.
paginae/craft/chewingstraw=$i{Загадка: влажная росой с красного луга, травинка, растоптанная белыми конями. Кто я?}
paginae/craft/claypipeu=Этот предмет нужно сначала обжечь в печи, чтобы его можно было использовать.
paginae/craft/cne=Одежду и снаряжение можно надеть на вашего персонажа при перетаскивании их на экран снаряжения (Ctrl + E). Заметьте, что все снаряжение использует свои собственные слоты и некоторые их них могут мешать друг другу.
paginae/craft/coldcompress=Холодный компресс можно применить для лечения Шишки и Сотрясения.\n\nСо временем он тает.\n\nДержа мышкой Холодный компресс, кликните правой клавишей мышки на нужную рану на странице "Здоровье и Раны" листа вашего персонажа.
paginae/craft/coldcut=Удерживайте Холодную нарезку и нажмите правой кнопкой мыши на рану, которую хотите обработать, на экране «Здоровье и раны» листа персонажа.
paginae/craft/corndollylantern=$i{Плетение за плетением, как времена года за годами, свет в честь урожая.}
paginae/craft/curios=Курьезы - это те самые интересные штуки, которые можно изучать в разделе "Отчет об обучении"вашего листа персонажа (Ctrl + T). Очки обучения, добытые таким способом, могут быть потрачены на развитие характеристик, изучение навыков и присваивание земель.
paginae/craft/cutgem=Огранка камня может поднять уровень огранки на один. Если бросок не удался, камень расколется на два камня, каждый на уровень ниже и по размеру, и по огранке, чем исходный. Базовый шанс успеха - 25%, и он стремится к 75% с ростом указанных в рецепте характеристик и навыков.
paginae/craft/dowrod=Палочка поиска воды указывает вам направление, в котором уровень подземных вод растет. Это знание можно использовать, чтобы найти место для более простой постройки колодца.
paginae/craft/dynres=Загрузите изображение и сделайте с него эскизы. Эскизы можно выводить на особые знамёна и геральдическую одежду.
paginae/craft/exquisiterotu=Изысканная гниль – эффективный дубильный материал. Перед тем как использовать, гниль требуется на некоторое оставить мокнуть в дубильном чане.
paginae/craft/fanm=Ассортимент медикаментов для облегчения болей. Лечебные процедуры обычно проводятся путем удержания курсором и нажатия правой кнопкой по ране, на которую вы хотите нанести применить средство, в списке ран вашего персонажа.
paginae/craft/ferrysilver=Кольцо Паромщика спасёт вас от утопления, но только один раз. Если кольцо на вас и вы тонете, то вместо этого кольцо будет уничтожено, а вы окажетесь на берегу, с которого последний раз ступили в воду.
paginae/craft/firebrand=Разведение огня создает временно горящую лучину, которую можно использовать, чтобы разжечь печь, груду дров и т.п. Медлить не стоит, потому что лучина быстро гаснет.
paginae/craft/flines=Удочкам и удилищам нужна леска, чтобы ими можно было пользоваться.
paginae/craft/flintsteel=Кремень и огниво можно использовать для розжига костра и других воспламеняемых объектов. Держа мышкой Кремень и огниво используйте правый клик, чтобы развести огонь.
paginae/craft/food=Еда восстанавливает вам энергию и может увеличить характеристики. Каждый раз во время еды, если конечно вы не совсем объелись, вы получаете особые очки FEP, добавляющиеся к FEP-метру на листе вашего персонажа (Ctrl + T). Когда FEP-метр оказывается заполнен, он сбрасывается до нуля, и происходит событие, в зависимости от того, чем был заполнен FEP-метр. Обычно это - увеличение характеристики, но, иногда, эффект может быть отрицательным, если вы съели что-то не то.\n\nЕда снижает ваш уровень голода, понижая также и эффективность последующих блюд.\n\nРазмер FEP-метра равен вашей самой высокой характеристике.\n\nПоедание пищи различного типа позволяет сократить FEP-метр для конкретного раза.
paginae/craft/gauze=Бинт можно использовать для лечения травм типа Сильный порез, Глубокие порезы, Ссадины, Поцелуй клинка и травм тупым оружием, однако для его использования необходимо освободить правый слот на голове.\n\nДля лечения, держа мышкой бинт, откройте раздел "Здоровье и раны"на вашем листе персонажа, кликните правой клавишей на нужную рану и нажмите Лечить.
paginae/craft/glasscopy=Стеклянный ключ - это подчинённый ключ, который после первого использования разбивается.
paginae/craft/glassrod=Стеклодувная трубка нужна для многих округлых стеклянных изделий.
paginae/craft/gpotdough=Садовый горшок позволяет вам пересаживать некоторые травы, собранные в дикой природе. Для посадки, заполните горшок почвой и водой.
paginae/craft/gridiron=Решётку можно закрепить на камине или жаровне, держа её и кликнув по камину или жаровне правой кнопкой.
paginae/craft/handimpressionu=Отпечаток ладони может быть изучен сразу или обожжен для получения более долгосрочного и эффективного курьеза.
paginae/craft/hartshornsalve=Мазь из рога используется для лечения Жестоких ушибов, травм от тупого оружия, и фингала.\n\nДля этого, держа мышкой мазь, откройте раздел "Здоровье и раны"на вашем листе персонажа, кликните правой клавишей на нужную рану и нажмите Лечить.
paginae/craft/hls=Различные удочки и снасти
paginae/craft/instruments=Экипируйте инструменты и используйте правую клавишу мыши для игры.\n\n Игра производится с помощью клавиш Z, S, X, D, C, V, G, B, H, N, J, M, модифицированных Ctrl и Shift.
paginae/craft/kebabub=Рулет для кебаба нужно зажарить на вертеле, прежде чем его можно будет съесть.
paginae/craft/keylock=Сделав замок, вы можете установить его на ворота, держа мышкой и кликнув на них правой клавишей. Установка замка даст вам Мастер-ключ от него и соответствующих ворот.\n\nВы можете привязать замок к уже существующему Мастер-ключу, держа его в руках и кликнув правой клавишей на замок. Установка привязанного замка не даст вам нового ключа, однако с такими воротами будет работает привязанный ранее ключ.
paginae/craft/leadvination=$i{Судьбы, гибкие и переменчивые, в извивающихся каплях свинца.}
paginae/craft/leatherpurse=В кошельках хранятся монеты, а сами кошельки можно носить на поясе.
paginae/craft/lnk=Предметы для установки замков на ворота и контейнеры.
paginae/craft/lobsterpot=Наживите ловушку сырым мясом, потрохами или приманкой и поставьте в глубокую воду.
paginae/craft/makepat2=Сделать набросок изображения, загруженного на сервер Haven & Hearth через страницу вашего аккаунта. Наброски могут быть использованы для оформления специальных баннеров и геральдической одежды. Для создания наброска необходимо иметь краски цветов, представленных на зарисовываемом изображении.
paginae/craft/mastercopy=Этот рецепт позволяет вам создать копию Мастер-ключа.\n\nМастер-ключ позволяет вам открывать двери/замки с любой стороны, а также менять сами замки.
paginae/craft/matchbox=Коробка спичек может использоваться для разведения огня в кострах и других поджигаемых объектах. Возьмите коробку спичек и нажмите правой кнопкой мыши на объект, который вы хотите зажечь.
paginae/craft/metallock=После изготовления замок ставится на ворота: возьмите его на курсор и кликните правой кнопкой по воротам. При установке вы получите мастер-ключ от этих ворот и замка.\n\nЗамок можно привязать к уже существующему мастер-ключу: возьмите ключ на курсор и кликните правой кнопкой по ещё не установленному замку. Установка привязанного замка не даст новый ключ - на него будет работать тот ключ, к которому вы его привязали.
paginae/craft/moltenglass=$i{Масса раскалённого расплавленного стекла отражает огонь внутри себя и жаждет остыть, обретя более совершенную форму.}
paginae/craft/mudointment=Мазь из грязи может быть применена против ран Царапины и порезы, Разукрашенное лицо и Ушиб. \n\nУдерживайте курсором Мазь из грязи и нажмите правой кнопкой мыши на рану, которую вы хотите обработать, на экране «Здоровье и раны» листа персонажа.
paginae/craft/nidbane=Кандалы Назгула привязывают духа мщения к рунному дольмену и посылают на поиски мести.
paginae/craft/nutrattle=$i{Погремушка шепчет сказки о дубах, что растут до облаков, и о буках, дремлющих в тихих лощинах.}
paginae/craft/oddends=Различные неэкипируемые и одноразовые предметы.
paginae/craft/packrack=Бык или корова, экипированные вьюком, могут перевозить два объекта и ряд предметов.
paginae/craft/parchment=Вы можете записать что-нибудь на пергаменте и использовать его, как записку.
paginae/craft/picklebrine=Рассол используют в банке для засолки различных продуктов, например свёклы, огурцов и сельди.
paginae/craft/picklingjar=Рассол используют в банке для засолки различных продуктов, например свёклы, огурцов и сельди.
paginae/craft/pitbakeds=Печенные изделия могут и должны быть запечены в очаге или печи, чтоб их можно было есть.
paginae/craft/pots=Керамические контейнеры и инструменты. Обычно гончарные изделия сначала нужно обжечь в печи для обжига, прежде чем ими можно будет пользоваться.
paginae/craft/producesack=Мешок для запасов вмещает содержимое одной кучи любого вида. Держите мешок и кликните правой кнопкой по куче, чтобы собрать её.
paginae/craft/purses=В кошельках хранятся монеты, а сами кошельки можно носить на поясе.
paginae/craft/pyritespark=Искра из пирита может быть использована для поджигания костра либо иных зажигаемых объектов. Удерживайте искру и нажмите правой кнопкой мыши по объекту, который желаете поджечь.
paginae/craft/rawglass=Сырое стекло получается из расплавленного: если оставить расплав в контейнере, он остынет в сырое стекло.
paginae/craft/roastspit=Вы можете установить вертел на очаг правым кликом мышки, держа его в руках.
paginae/craft/rootfill=Корневая пломба мгновенно излечивает Глубокий порез, а также превращает Жестокое отсечение в Глубокий порез.\n\nУдерживайте Корневую пломбу и нажмите правой кнопкой мыши на рану, которую вы хотите обработать, на экране «Здоровье и раны» листа персонажа.
paginae/craft/saddlebags=Лошадь, экипированная переметной сумой, может перевозить два объекта и ряд предметов.
paginae/craft/saptap=Сокоотвод медленно собирает сок с деревьев вроде клёна или берёзы. Держите сокоотвод и кликните правой кнопкой по подходящему дереву, чтобы установить его.
paginae/craft/signaturemeat=Рецепты, для которых нужно мясо конкретных животных.
paginae/craft/silkpurse=Кошельки вмещают монеты, а сами кошельки можно хранить в поясах.\n
paginae/craft/slavecopy=Использование этого рецепта позволяет вам создать обычный ключ путём копирования с Мастер-ключа.\n\nИспользование ключа позволяет вам открывать двери/замки, для которых он сделан, но только изнутри. (Визуально двери обычно открываются наружу.)
paginae/craft/snt=Раздел "Посуда" содержит в себе предметы для сервировки стола. Чем лучше посуда, тем медленнее вы будете насыщаться.
paginae/craft/snuffbox=Небольшой сосуд для трубочного зелья, опиума и прочих лечебных веществ.
paginae/craft/soapbar=Бруски мыла могут быть использованы для промывания Воспаленных ран.
paginae/craft/steellock=После изготовления замок ставится на ворота: возьмите его на курсор и кликните правой кнопкой по воротам. При установке вы получите мастер-ключ от этих ворот и замка.\n\nЗамок можно привязать к уже существующему мастер-ключу: возьмите ключ на курсор и кликните правой кнопкой по ещё не установленному замку. Установка привязанного замка не даст новый ключ - на него будет работать тот ключ, к которому вы его привязали.
paginae/craft/stingingpoultice=Жгучая припарка можно использовать для лечения Глубоких порезов и Синяков. Для этого, держа мышкой припарку, откройте раздел "Здоровье и раны"на вашем листе персонажа, кликните правой клавишей на нужную рану и нажмите Лечить.
paginae/craft/stitchpatch=Заплатку можно использовать для лечения ран типа Сильный порез и Кишки наружу, но лечение происходит очень медленно.\n\n Для лечения, держа мышкой заплатку, откройте раздел "Здоровье и раны"на вашем листе персонажа, кликните правой клавишей на нужную рану и нажмите Лечить.
paginae/craft/swag=Галантерейная фурнитура - это предметы, которые можно использовать для наделения экипировки новыми свойствами.
paginae/craft/tardoll=$i{Хмурая, угрюмая фигура, ссутулившаяся и потерянная в липких мыслях.}
paginae/craft/tarsticks=Смоляные палочки можно использовать, чтобы разложить костёр, в качестве топлива и как материал для крыш.
paginae/craft/tinwarrior=$i{Меч взметнут, боевой клич застыл во времени и холоден на ощупь.}
paginae/craft/toadbutter=Жабье масло может быть применено против ран Тупая травма, Разукрашенное лицо, Фингал, Поцелуй клинка и Ожоги от пиявок. \n\nУдерживайте курсором Жабье масло и нажмите правой кнопкой мыши на рану, которую вы хотите обработать, на экране «Здоровье и раны» листа персонажа.
paginae/craft/tusksnuff=Нюхательный порошок из клыка вепря - опасное снадобье: ненадолго сильно поднимает силу пропорционально нанесённому вам урону. Когда мгновенный эффект спадает, часть урона ещё какое-то время остаётся.
paginae/craft/utensils=Различная утварь и приспособления для готовки и обработки пищи.
paginae/craft/vessels=Сосуды для переноски различных жидкостей.
paginae/craft/wallshelf=Настенные полки крепятся на стены домов и хранят предметы.
paginae/craft/woodlock=После изготовления замок ставится на ворота: возьмите его на курсор и кликните правой кнопкой по воротам. При установке вы получите мастер-ключ от этих ворот и замка.\n\nЗамок можно привязать к уже существующему мастер-ключу: возьмите ключ на курсор и кликните правой кнопкой по ещё не установленному замку. Установка привязанного замка не даст новый ключ - на него будет работать тот ключ, к которому вы его привязали.
paginae/craft/wroughtiron=В процессе создания кованного железа возможны неудачи и превращение заготовки обратно в Чугун. Некоторые попытки могут быть лучше других, так что качество конечного продукта могут немного увеличиваться/уменьшаться в зависимости от перековываемой заготовки.
paginae/craft/yulegift=Вы можете сложить подарки в Подарочную коробку, чтобы подарить друзьям на Рождество.
paginae/decks/deck1=Колода 1
paginae/decks/deck2=Колода 2
paginae/decks/deck3=Колода 3
paginae/decks/deck4=Колода 4
paginae/decks/deck5=Колода 5
paginae/decks/decks=Колоды
paginae/exp/abyssalchasm=Прохладный ветерок пробегает по вашим ногам, и только слабое эхо с глубины удерживает вас от того, чтобы сигануть вниз головой в этот шрам на теле земли, разверзнувшийся перед вами. Вы нашли Адский провал и дурные ветры дуют оттуда.
paginae/exp/beastsense=Внезапно вы слышите легкий шорох и где-то впереди видите великолепного зверя, полного первобытной мощи и красоты. Воистину, природа прекрасна.
paginae/exp/beaverking=Вы видели, как пал Король бобров: его трон опрокинули, а корону похитили, и она бесследно исчезла. Этот урок вы запомнили надолго.\n\n$col[255,255,0]{\n • +5% урона по бобрам.}
paginae/exp/carrylight=В ваших руках, сложенных "лодочкой", притаился огонёк пламени, защищенный от легкого бриза и извивающийся подобно шелку. В мире вокруг вас правят тьма и холод, вплотнуб подбираясь к домам из света и жизни. Этот момент не сможет длиться вечно, но он даёт вам шанс нести в этот мир тепло. Очень редкая лучина горит так долго.
paginae/exp/caveorgan=Мрачные, призрачные ноты эхом доносятся из нутра этой колоссальной сталагмитной структуры подземного мира, когда скверный дым извергается наружу. Кто знает, какие тайные проходы соединяют ее с более глубокими слоями Мира?
paginae/exp/cavingin=За очередным поворотом дороги вы внезапно замечаете скрытый за деревом вход в неведомую пещеру. Победят ли жажда приключений и любопытство? Войдете ли вы внутрь?
paginae/exp/cellarsomething=Темные углы этого места иногда могут бы по-настоящему пугающими. Где-то процокали коготки и вы готовы поклясться, что видели что-то большое с горящими красными глазами.
paginae/exp/charexit=Вы горите в огне целую вечность, невыносимая боль пронзает тело, заставляя биться в конвульсиях, и затем, с облегчением вы замечаете легкое дуновение прохладного ветерка где-то высоко над огнем и болью. Ветер усиливается, отгоняя прочь жар ярости и, спустя некоторое время не остается ничего. Ничего, кроме ветра.
paginae/exp/claypit=Своеобразное медленное бурление в сочетании с повышенной влажностью, запахом перегноя и просто земли, позволяет вам безошибочно определить, что перед вами Глиняный карьер.
paginae/exp/coralreef=Крики чаек, солёные брызги и отчётливый запах даров моря опережают крик дозорного: впереди показался коралловый риф.
paginae/exp/crystalpatch=Сияющее чудо природы, превращающее мир в сотни миров и наполняющее все вокруг глубоким, чистым звоном.
paginae/exp/dawnbreak=Говорят, чем ближе рассвет, тем темнее ночь, и никогда это не было настолько правдиво, как сегодняшним утром, когда, наконец, солнце появилось над горизонтом, изгоняя тени прошедшей ночи. Этот рассвет действительно особенный.
paginae/exp/doom=Чувство чего-то очень нехорошего наполняет воздух и касается всего сущего. Где-то были произнесены запретные слова и начат тёмный ритуал. Теперь, если его не остановить, то весь мир может погибнуть, чтобы потом воскреснуть вновь. Возможно.
paginae/exp/drawingblood=Остриё вашего инструмента глубоко вонзается в распростертую перед вами тушу, выплескивая поток горячей крови. Некая очень глубокая, тревожащая мысль о повторении всего в жизни и возвращения в вечность кратко проноситься в вашем сознании, но вы быстро прогоняете ее, возвращаясь к своим приятным обязанностям.
paginae/exp/dreamletgo=Вы слегка разжимаете кулак, и, неожиданно, что-то исчезает в легком хлопке розового дыма и сахарной пудры. То ли вы выбросили что-то, то ли обронили. Возможно, вы отдали это миру. Как бы то ни было, ваш прекрасный сон растаял и его больше нет.
paginae/exp/drivingdark=Свет пронзает окружающую вас тьму, изгоняя её в самые дальние уголки и открывая новые возможности вокруг вас
paginae/exp/dryad=Явление из иного мира, изгибающее корни деревьев и заставляющее дрожать осины, словно искажая природу вокруг своего пути, величественно прорывается сквозь листву.
paginae/exp/fairystone=Древний камень, исполненный колдовской силы, хранит память о танцах в дни солнцестояния и в полнолуние. Там, где когда-то ступали крохотные ноги, до сих пор пахнет грибами.
paginae/exp/fallingstar=Красная звезда, угасая в последнем величии и обвитая пламенем, мчится по небосводу Очага. Быть может, вы найдёте её, когда она упадёт на Очаг?
paginae/exp/familiarface=Где-то далеко на глубине вы замечаете знакомое лицо, глядящее на вас. Легкая улыбка касается его губ и приносит спокойствие. Журчание воды окружает вас.
paginae/exp/fashionlove=Вы понимаете, что с этой вещью придётся расстаться, но все равно, замираете в благоговении перед настоящим произведением искусства, созданным вашими собственными руками.
paginae/exp/flowerfragrance=Воздух вокруг наполнен приятным ароматом, и вы чувствуете, как жизнь, обернутая в божественную простоту, пульсирует вокруг вас.\n\nЭти цветы пахнут просто прекрасно.
paginae/exp/gatebuilding=Перед вами стоят врата, которых только что здесь не было. Там, где прежде было только снаружи, теперь есть и внутри. На миг вам кажется, будто само пространство изменилось. Ощущение проходит, а врата остаются.
paginae/exp/genderbread=И было сказано, что двойственной сущности внутренней магии мира просуществует до скончания веков, когда человек человеку станет волком, и последняя надежда будет утрачена. Мужчина ты или женщина, дух? Будущая дорога требует выбора.\n\nСлева от тебя - путь женщины, справа - мужчины.\n\nВыбирай мудро.
paginae/exp/geyser=Бурлящий котел, дышащий серой и новыми возможностями, возвышается перед вами.
paginae/exp/goldfields=Повсюду, куда ни глянь, - золотые колосья, ожидающие своего жнеца, переливающиеся на солнце и наполняющие воздух вокруг запахами травы и земли. Этими полями можно любоваться сколько угодно, и предстоящая вам работа не преуменьшает их величия.
paginae/exp/graveflowers=С тяжким сердцем вы возлагаете цветы у порога склепа, последнего пристанища хартлинга, воспоминания о ком уже быстро тают, как дерзкое подношение времени, смерти и тлену.
paginae/exp/greathall=Величественное сооружение возвышается на некотором расстоянии перед вами, и всё вокруг говорит о минувших сражениях. Ваш дух ощущает множество путей впереди, но ваша плоть достигла конца своего пути здесь, в Зале Богов. Пиры и битвы ждут тебя до скончания веков, храбрый путник!
paginae/exp/grove=Вокруг стоят высокие, похожие друг на друга деревья, словно выросшие из одного семени. Сладкий аромат и прохлада тени тысяч листьев не оставляют сомнений: вы стоите в Могучей роще.
paginae/exp/guanopile=Жужжание бесчисленных мух вместе с писком почти такого же числа летучих мышей и глубокая гнилостная вонь фекалий могут означать лишь одно: вы обнаружили значительную Гору гуано.
paginae/exp/haven=Вы видите свет и находите себя в окружении густого тёмного леса на краю небольшой тропинки, убегающей в непроглядную зелень. Воздух вокруг вас наполнен запахами хвои, земли и прошедших столетий.Вы ощущаете лёгкость, почти невесомость, но при этом чувствуете себя тяжелее, чем когда бы то ни было. Знаки прошлого окружают и переполняют вас.
paginae/exp/haveseat=Очень неплохо иногда давать отдых своим усталым костям, прилечь где-нибудь в теньке. Или присесть.
paginae/exp/headwaters=Река поднимается все выше и убегает всё дальше, пока, наконец, не приводит вас сюда, к Истокам. В этом ручейке вода никогда не бывает прежней.
paginae/exp/heaveho=Бум! Вы оторвали эту штуку от земли! У неё не было ни единого шанса!
paginae/exp/icespire=Перед вами сияющий пик изо льда и серебра, упирающийся в небо, хранимый холодом окружающих гор, мерцающий подобно сотне бриллиантов на солнце. Вы нашли Ледяной пик.
paginae/exp/irminsul=На поляне перед вами стоит тёмное, угрюмое дерево. По стволу размазана кровь, словно здесь совершили нечестивый обряд.
paginae/exp/jotunmussel=Прямо перед вами, будто брошенная рукой Йотуна, лежит огромная раковина, мерцая на солнце и напоминая легенды о таинственных сокровищах.
paginae/exp/leapfree=Время замирает и вы, подобно мухе, застрявшей в янтаре времени, зависаете в воздухе. А через мгновение продолжаете движение и грохот спешащего мимо мира поистине оглушителен.
paginae/exp/lilypadlotus=Задолго до того, как вы увидите цветущий лотос, ветер принесёт его сладкий аромат с нотками нектара, лета и дикого мёда.
paginae/exp/mandrakeshriek=Кровь стынет у вас в жилах, когда полуночный крик баньши пронзает темноту. Корень у вас в руках оживает и бросается наутёк прежде, чем вы успеваете среагировать
paginae/exp/medicinemix=Острый насыщенный запах с нотками сливок, как будто от лука или мака, поднимается от лежащей перед вами припарки, напоминая о бескорыстных радостях труда целителя.
paginae/exp/monolith=Перед вами возвышается высокий столб из цельного камня. Он весь в крови, людской или звериной, и кажется зловещим предзнаменованием.
paginae/exp/motherlode=Когда оседает пыль, вы внезапно замечаете её, мерцающую во тьме, словно позабытое сокровище. Вы обнаруживаете рудоносную жилу.
paginae/exp/mountaindawn=Далеко-далеко огромный пылающий шар поднимается в небо, посылая лучи своего тепла сквозь древние холодные горы. Захватывающий вид.
paginae/exp/mountainsummit=Высоко над вами вздымается вершина горы, холодная, суровая и вечная. Кажется, она тянется к самим облакам и звёздам.
paginae/exp/natgal=Внезапно ваш топор рассекает ни что иное как сырой застоявшийся воздух, когда, в последний раз вонзившись в камень, крошит тонкую стену и открывает естественную галерею, протянувшуюся далеко во тьму.
paginae/exp/newland=Смешанное чувство восхищения и беспокойства переполняет вас на границе двух земель, ждущей, чтоб вы пересекли её.
paginae/exp/nidbane=Ветра недобро гудят при приближении Назгула. Назгулы - духи мщения, ищущие тех, кто нарушил законы этого мира.
paginae/exp/nightqueen=Вы видели, как пала Ночная королева, и слышали её последний мучительный крик. Он прогремел по огромным тёмным залам, где у ваших ног лежало её перебитое потомство. Этот холод не отпустит вас до последнего вздоха.\n\n$col[255,255,0]{\n • Обычные летучие мыши больше не нападают на вас.}
paginae/exp/nuggetwisdoms=В извивах расплавленного металла перед вами вы видите переплетающиеся нити далекого будущего и недавнего прошлого, отраженные в чистой магии пламени. Несомненно, сие есть крупицы мудрости!
paginae/exp/oldbones=В мрачных мыслях об окончательности смерти и о прохождении через это, вы наблюдаете, как старые кости обретают покой, навсегда предаваемые тишине холодной могилы и вечности.
paginae/exp/pileup=Вы тихонько думаете про себя, что, в принципе, вся суть жизни заключается в перекладывании одних вещей поверх других.
paginae/exp/plantfuture=Вы нежно притрамбовываете сырую почву вокруг ростка, и, буквально на одно мгновение, можете увидеть целое будущее этого растения, от этого момента до могучего древа, и ваше действие его посадки внезапно наполняется особым смыслом.
paginae/exp/poundmetal=Это такое особенное ощущение, ковать металл, придавая ему форму молотом и мускулом. Металлический отзвук вашего ритма разносится далеко по округе.
paginae/exp/quenching=Вы жадно набрасываетесь на воду, поглощая её огромными глотками, в то время, как перед вами, словно в тумане танцует Хульдра. Очень редко случается вам ощущать подобную жажду, и каждый раз вы словно рождаетесь вновь. Теперь вам ясно, что делать дальше.
paginae/exp/rathole=Где-то в стенах этой комнаты шевелится тёмное присутствие. Писк почти невыносим, а в воздухе витает лёгкий запах выдержанного сыра.
paginae/exp/roaringfire=У вас уже заканчивается терпение, когда из груды валежника перед вами неожиданно рождается первая искра, первый могучий огненный червь пробуждается от ваших усилий. Танцуя и шипя он двигается по валежнику, пока, наконец, не исчезает внутри своей деревянной тюрьмы. И долго здесь ещё будет пахнуть горелыми листьями и шерстью.
paginae/exp/saltbasin=Перед вами лежит бассейн, полный белого золота с голубоватым отливом - соли. Вы обнаружили природный Соляной бассейн.
paginae/exp/saycheese=Мягкий соленый, едва горьковатый запах свежеразрезаного сыра приятно щекочет ваши ноздри по мере того, как вы извлекаете его из поддона. Вы улыбаетесь от такого простого удовольствия.
paginae/exp/settingvats=Неужели некому больше сделать это кроме вас? Ужасная вонь проникает во все поры вашего тела, а уж тяжесть... представьте, если б за каждое поднятое ведро вы получали хотя бы золотую песчинку...
paginae/exp/silktouch=Вы даете волокнам материи проскользнуть сквозь пальцы, словно быстрый поток, почти без трения. В этом прикосновении чувствуется легкая нотка прохлады, но кроме нее в этом касании шелка - лишь только мягкость летнего облачка.
paginae/exp/sootcogfire=Едкий запах и танец черных заготовок окружают вас. Где-то далеко вы слышите сопение мехов и ощущаете на своей коже жар от гор сгорающего угля.
paginae/exp/sowingtime=С легким сердцем вы облегчаете свою ношу и отдаёте земле то, что вскоре вернётся вам сторицей, делая в итоге вас обоих немного богаче.
paginae/exp/spelunking=Вы входите в пещеру и, чем дальше вы продвигаетесь, тем глуше становится свет снаружи. Пещера движется дальше и постепенно расширяется в большой грот. Вы чувствуете мурашки на спине, когда легкий ветерок касается вашей щеки, принося с собой запахи грибов и мха.
paginae/exp/spindlepricked=Это похоже на сказку про пряжу, только намного больнее, чем вам представлялось, и алая капля проступает там, где вы только что укололись веретеном. Ау!
paginae/exp/stalagoombadance=Вы не уверены, связано ли это с тем, что вы поели грибов, но вы почти готовы поклясться, что слышите ритмичный бой барабанов, когда цепочка сталагумб, проходит в танце мимо вас.
paginae/exp/strikeearth=Вы поднимаете лопату и с силой вонзаете её в землю ещё и ещё. Земля разлетается в разные стороны и ощущение приближения осуществления ваших планов переполняет вас. Боги улыбаются вашим амбициям.
paginae/exp/strikeroot=Что ж, хоть это и заняло некоторое время, но вы распутали треклятые корни и вы вытащили эту штуку наружу. Знать бы, что теперь с ней делать...
paginae/exp/swanlake=Блики бегут по нежной ряби на материи реальности, когда величественное видение, призрачно белое, скользит по водной дали.
paginae/exp/talkingstone=Вам становится жутко, когда вы понимаете, что персонаж, которого вы искали, – это не что иное, как вот этот неподвижно лежащий перед вами старый валун, считающий облака, звезды и годы. Вы слышете его шепот отовсюду.
paginae/exp/talkingtree=По какой-то причине некая высшая сила вынудила вас отправиться на поиски этого дерева, и, к своему огромному удивлению, вы слышите, словно эхо, звучащее ниоткуда и отовсюду сразу, как оно говорит с вами мягким соблазнительным голосом. Быть может, оно чего-то желает?
paginae/exp/tarpit=Бульканье грязи, угольный запах смолы и кости, белеющие на солнце, выдают природную смоляную яму впереди.
paginae/exp/thesymbel=Не всякая трапеза подобна торжественному банкету в ярко освещенном зале в компании королей, под звуки симфоний гудящих рогов и ревущих огней, с щедро льющейся медовухой, но вот эта – подобна.
paginae/exp/thingwall=По древнему обычаю тинги созывают лишь в особых местах, где старые боги на заре времён посадили могучий дуб у каменного стола. Перед вами тингвелл, и вы внимаете его зову.
paginae/exp/timber=С последним взмахом топора дерево устремляется к земле зеленым каскадом листьев и веток. Кажется, вы довольны.
paginae/exp/treadgrass=Трава щекочет вас, напоминая о детстве, ваши губы расплываются в улыбке, которая устремляется в мир, который еще не ведал зла.
paginae/exp/turntable=С глухим стуком вы устанавливаете стол, поднимая каскад давнишней пыли и паутины, и тщетная нежда внезапно оборачивается свершившимся фактом: Столы готовы.
paginae/exp/uddershudder=Когда вы садитесь надоить молока, тревожащее, если не совершенно противное чувство наполняет вас. Вы ощущаете себя совсем близко к животному и к целому окружающему миру.
paginae/exp/watercraft=В предвкушении смелого приключения вы спускаете свое судно на воду и готовитесь взойти на борт.
paginae/exp/weepingwillow=О чем рыдает стариковская ива? О давно прошедшей юности и потерянных друзьях, о заржавевшем топоре и лихих временах? Среди ветвей вам слышатся его тихие всхлипывания.
paginae/exp/wellwishing=Грохочет ведро, опускаясь в темно-синие глубины, и возвышенная красота окружающего мира внезапно открывается перед вам. И в этот миг ваше сердце загадывает секретное желание.
paginae/exp/windthrow=Когда-то на заре времен , когда Старые боги были молоды, свободны и веселы, могучее дерево упало здесь. Теперь здесь всего лишь тень минувшего, лишь старая трухляшка. Вы обнаружили Древний ствол.
paginae/exp/woodheart=Медленно пульсирующее Сердце леса вырисовывается перед вами в древней чаще.
paginae/gov/bordercairn=Территориальные каирны расширяют территорию вашего Королевства.\n\nСтоимость содержания: 10 очков власти в день
paginae/gov/cstatue=Статуя лидера увеличивает максимальное значение Авторитета деревни.
paginae/gov/cstone=Камень путешествий позволяет переместиться к любому другому подобному камню. Дайте вашему камню имя, и любой сможет перемещаться к нему от другого камня, просто введя это имя. Так же верно и обратное. В деревне может быть только один Камень путешествий.
paginae/gov/enact/backwater=Ваше Королевство немного похоже на захолустье, но его жители этим гордятся, а дикая природа рождает отважных ребят.\nБыстрее растут салат и лук; барсуки, кроты и белки встречаются чаще, а также вы получаете бонусы к Силе и Выживанию.
paginae/gov/enact/bullmyth=Идея ваших людей о происхождении всего сущего включает в себя сказания о Звездном Быке, несущемуся с громом в Дикой Охоте по небосводу Мира, и разведение домашнего скота всегда было одним из столпов вашей промышленности. У свиней, овец, лошадей и коров в вашем Королевстве короче период беременности.
paginae/gov/enact/centeroflearning=Это Королевство стало центром обучения, таким образом увеличивая количество очков обучения за изучаемые внутри него курьёзы, а также предоставляя бонусы к Знаниям и Интеллекту.
paginae/gov/enact/fecundearth=Ваши Менгиры были окроплены кровью многих жертвоприношений древним богам, и ответной наградой каждый сезон обилен ваш урожай. Пшеница, виноград, лен и тыквы растут быстрее, а жители получают бонус к Огородничеству.
paginae/gov/enact/foundingmythos=В течении веков ваши жители пряли запутанное полотно знаний и мифов, выдвигая ваше Королевство и его судьбы в центр и на передний край упорядоченной вселенной. Крепкая и постоянная вера в Мифы основ обеспечивает жителей постоянным доступом к Магии Мира.\nСтоимость магических заклинаний в королевстве уменьшена, а население получает бонус к Знаниям, Интеллекту и Духовности.
paginae/gov/enact/gamekeeping=С учреждением охотничьих хозяйств, управления стадом и ранней селекции ваше Королевство значительно улучшило качество промысловой дичи. Кабаны, Олени и Лоси, все встречаются более высокого качества, а население получает небольшой бонус к Выживанию.
paginae/gov/enact/guardedmarches=Окраины и удаленные регионы вашего Королевства находятся под неусыпным контролем рейнджеров и верховых патрулей. Оспаривание ваших Пограничных вех стоит дороже.
paginae/gov/enact/heraldicswan=Образ величественного лебедя часто и ярко проявляется в геральдических традициях вашего Королевства, и дух птицы хорошо воспринял это. Где бы ни бродили в вашем Королевстве, везде можно увидеть целые стаи самых прекрасных и восхитительных лебедей.
paginae/gov/enact/localcuisine=Ваше королевство получило некоторую известность благодаря местной кухне и качествам своих поваров. Еда, съеденная на территории вашего Королевства, дает дополнительные очки FEP, а население получает бонус к Кулинарии и Восприятию.
paginae/gov/enact/milkhoney=Ваша земля течёт молоком и мёдом. Собираемые мёд, пчелиный воск и молоко имеют повышенное качество, а награды за задания в вашем королевстве увеличены.\n
paginae/gov/enact/mountaintradition=Ваши люди всегда жили у подножия гор, еще со времен первых поселений, и слышали шепот Глубинного. Добываемые на территории Королевства камень и руда выше качеством, а население получает бонус к Кузнечному мастерству и умению Каменщика. Помните, что Королевство должно распространяться на уровни пещер для того, чтобы это благословение имело эффект там.
paginae/gov/enact/seamarriage=Единение с Морем - это древняя связь между вашим Королевством и стихией. Вы преодолевали синие дали и избороздили просторы пропахали глубокие борозды вдоль рек и озер по всему миру, всегда стремясь к следующему горизонту. В вашем Королевстве ловится рыба и строятся корабли лучше качеством, а ваше население получает бонус к Исследованию, Воле и Плаванию.
paginae/gov/enact/woodlandrealm=Ваше Королевство, под чутким руководством и вниманием людей небезразличным к его нуждам, покрылось могучими дубами и дремучими лесами. Деревья и кусты в вашем Королевстве растут быстрее, а встречающиеся растения и дикая живность более высокого качества.
paginae/gov/fieldcairn=Каменный знак можно использовать, чтобы установить особые привилегии для разных групп жителей деревни в определённом месте, как локальное исключение из деревенских правил. Например, одной группе может быть разрешено воровать и разрушать, но запрещено строить на территории, подчиненной Каменному знаку.
paginae/gov/gov=Действия, относящиеся к администрированию, установке объектов и правил, связанных с деревней, членом которой вы являетесь.
paginae/gov/grotidol=Содержание Гротескного идола стоит значительное количество очков власти, но увеличивает Восприятие, Рукопашный бой и Выживание для всех на территории вашего королевства.\n\nСтоимость: 1000 очков власти в день
paginae/gov/invite=Пригласите новых жителей в вашу деревню, предложив им принять Клятву верности.
paginae/gov/leave=Аннулирует ваше членство в деревне, возвращая к независимости.\n\nДанное действие тратит некоторое количество накопленных очков Авторитета деревни.
paginae/gov/menhir=Содержание Менгира требует значительного количества очков власти, но увеличивает Силу, Огородничество и Исследование для всех в вашем Королевстве.\n\nСтоимость: 1000 очков власти в день
paginae/gov/r-bury=В результате организации Государственных похорон падшему хартлингу, его наследник получит все его параметры в качестве наследства, даже если тело покойного отсутствует.\n\nСтоимость: 50000 очков власти.
paginae/gov/r-diplomacy=С помощью Дипломатии последнего момента вы можете задержать на один час каждый из вызовов, брошенных Пограничным вехам вашего Королевства.\n\nСтоимость: 2500 очков власти за каждую оспариваемую веху, помноженных на 1.5 за каждую уже использованную задержку.
paginae/gov/r-inspire=Изымая из общей казны, вы можете получить очки опыта в обмен на очки власти своего Королевства. Каждый раз при использовании, вы будете получать по 1000 очков опыта, но стоимость в очках власти будет тем выше, чем чаще это действие осуществляется на территории Королевства. Со временем стоимость в очках власти возвращается к нормальному значению. \n\nСтоимость: 2000 очков власти, увеличивается при частом использовании.
paginae/gov/revoke=Отменить действие символа Частной собственности на территории вашей деревни.\n\nДоступно только для символов, установленных после основания деревни.\n\nДанное действие отнимает ощутимое количество очков Авторитета в зависимости от области действия отзываемой Частной собственности.
paginae/gov/showchal=Показать активные вызовы, брошенные вашим Территориальным каирнам.
paginae/gov/sublimeportico=Вы можете пройти сквозь Величественный портик, чтоб отправиться к Камням путешествий, имя которых вам известно. В деревне может быть лишь один портик.
paginae/gov/vbuoy=Деревенский буй расширяет территорию владений деревни.
paginae/gov/vflag=Деревенский баннер увеличивает область, принадлежащую вашей деревне.
paginae/halp/camera=$font[serif,20]{01. Камера}\n\n$font[serif,16]{Мышь}\n• Зажмите $col[246,229,34]{среднюю кнопку}, чтобы вращать камеру.\n• $col[246,229,34]{Колесо} - зум.\n\n$font[serif,16]{Горячие клавиши (по умолчанию)}\n• $col[246,229,34]{← →} поворот влево / вправо.\n• $col[246,229,34]{↑ ↓} наклон.\n• $col[246,229,34]{+} / $col[246,229,34]{−} приблизить / отдалить.\n• $col[246,229,34]{Home} сброс камеры.\n• $col[246,229,34]{Ctrl+стрелки} привязка на запад / восток / север / юг.\n\nКлавиши меняются в $col[246,229,34]{Настройки → Привязки клавиш}.
paginae/halp/inv=$font[serif,20]{03. Инвентарь}\n\n$font[serif,16]{Ваниль}\n• $col[246,229,34]{ЛКМ} взять, $col[246,229,34]{ПКМ} использовать.\n• $col[246,229,34]{Shift+ЛКМ} быстро перенести в открытый контейнер.\n• $col[246,229,34]{Shift+Ctrl+ЛКМ} перенести все такие же.\n• $col[246,229,34]{Ctrl+ЛКМ} бросить, $col[246,229,34]{Ctrl+Alt+ЛКМ} бросить все такие же.\n• $col[246,229,34]{Shift+колесо} над контейнером - прокрутить предметы внутрь или наружу.\n• Возьмите предмет и $col[246,229,34]{ПКМ} по миру (наполнить сосуд из воды и т.п.).\n\n$font[serif,16]{Дополнительный инвентарь}\nПКМ по кнопке списка $img[gfx/hud/btn-extlist,c] открывает подробную справку. Кратко:\n• $col[246,229,34]{ЛКМ} по кнопке показывает группы; $col[246,229,34]{ПКМ} прячет сетку, пока открыт список.\n• На окне есть Sort / Stack / Unstack.\n• $col[246,229,34]{Alt+F} фильтр - подходящие группы поднимаются вверх.\n\n$font[serif,16]{Руки}\nВиджеты рук/пояса и сумок включаются в $col[246,229,34]{Настройки → UI}.
paginae/halp/keys=$font[serif,20]{02. Горячие клавиши}\n\nЗначения по умолчанию. Свои можно поставить в $col[246,229,34]{Настройки → Привязки клавиш}.\n\n$font[serif,16]{Окна}\n• $col[246,229,34]{Tab} инвентарь, $col[246,229,34]{Ctrl+E} экипировка, $col[246,229,34]{Ctrl+T} персонаж, $col[246,229,34]{Ctrl+O} настройки, $col[246,229,34]{Ctrl+A} карта, $col[246,229,34]{Ctrl+C} чат.\n\n$font[serif,16]{Крафт и действия}\n• $col[246,229,34]{Alt+C} список крафта, $col[246,229,34]{Alt+B} список построек, $col[246,229,34]{Alt+A} список действий.\n• $col[246,229,34]{Alt+X} база крафта, $col[246,229,34]{Alt+Shift+C} последний крафт.\n\n$font[serif,16]{Руки и питьё}\n• $col[246,229,34]{Ctrl+1} / $col[246,229,34]{Ctrl+2} левая / правая рука, $col[246,229,34]{Ctrl+3} пояс.\n• $col[246,229,34]{Alt+D} пить, $col[246,229,34]{Alt+H} спрятать предмет на курсоре.\n\n$font[serif,16]{Мир}\n• $col[246,229,34]{Alt+Q} автосбор, $col[246,229,34]{Alt+W} ближайшие ворота, $col[246,229,34]{Ctrl+Q} сесть на лошадь.\n• $col[246,229,34]{Alt+I} инфо объектов, $col[246,229,34]{Ctrl+H} хитбоксы, $col[246,229,34]{Alt+R} радиусы, $col[246,229,34]{Ctrl+Z} привязка к тайлу.\n• $col[246,229,34]{Alt+F} фильтр предметов, $col[246,229,34]{Alt+S} окно учёбы.\n\nОсмотр, ростер, сыр и боты - в меню действий, их тоже можно повесить на клавиши.
paginae/halp/ui=$font[serif,20]{00. Базовые взаимодействия}\n\n$font[serif,16]{1. Основы}\n• $col[246,229,34]{ЛКМ} - идти, $col[246,229,34]{ПКМ} - взаимодействовать.\n\n• В любой момент зажмите $col[246,229,34]{среднюю кнопку мыши}, чтобы вращать камеру.\n\n• Все открытые подсказки лежат в меню $col[246,229,34]{«Помощь!»}.\n$img[paginae/act/halp]\n\n\n$font[serif,16]{2. Инвентарь}\n• По умолчанию $col[246,229,34]{Tab} открывает личный инвентарь.\n\n• $col[246,229,34]{ЛКМ} по предмету в инвентаре поднимает его, $col[246,229,34]{ПКМ} - взаимодействует с ним (если можно).\n\n• $col[246,229,34]{Shift+ЛКМ} быстро переносит предмет в открытый контейнер.\n\n• $col[246,229,34]{Shift+Ctrl+ЛКМ} переносит этот предмет и все такие же в открытый контейнер.\n\n• $col[246,229,34]{Ctrl+ЛКМ} бросает предмет на землю.\n\n• $col[246,229,34]{Ctrl+Alt+ЛКМ} бросает этот предмет и все такие же на землю.\n\n• $col[246,229,34]{Shift+колесо} над открытым контейнером прокручивает предметы внутрь или наружу.\n\n• Некоторые действия с миром делаются так: возьмите предмет и $col[246,229,34]{ПКМ} по объекту. Например, сосуд наполняется, если держать его и $col[246,229,34]{ПКМ} по воде.\n\n\n$font[serif,16]{3. Ездовые животные}\n• Спешиться: $col[246,229,34]{Ctrl+ЛКМ} по земле.
paginae/quest/burydead=Кости вашего предка и его дух не обрели покоя и освобождения в последнем погребальном обряде, и эта мысль не даёт вам покоя, требуя от вас...
paginae/quest/ccquest=Ваш дух пробудился над бассейном холодной воды, отражающим древние леса. Отыщите волшебника, назовите ему своё имя, и пройдите сквозь огонь, чтобы обрести материальность.
paginae/quest/eatdrink=Все эти телодвижения заставили вас проголодаться, желудок урчит и напоминает: пора добыть еду и питьё, пока не умерли с голоду. Когда вы трудитесь, шкала энергии тратится, чтобы восстановить выносливость. Энергию восполняет еда, а вода ускоряет восстановление выносливости за счёт энергии. Еда также даёт очки пищи (FEP): когда шкала заполняется, она обнуляется и повышает одну из базовых характеристик. Стоит попробовать, и начать можно с...
paginae/quest/farming=Сажать, сеять и всё, что растёт, не выходит у вас из головы, требуя от вас...
paginae/quest/firecraft=Вы хотите узнать пути сквозь сажу и огонь, и чтобы выжечь в уме новые озарения, вам нужно...
paginae/quest/fishing=В глубине полно сокровищ, что поддаются крючку и наживке. Облегчите бремя нетронутой природы...
paginae/quest/forage=Растения, травы и цветы растут вокруг повсюду. Если повысить исследование или восприятие, вы сможете находить и узнавать больше растений. Попробуйте...
paginae/quest/forging=Пламя, ревущее перед внутренним взором, нашептало вам о ремесле и потоках расплавленного металла, побуждая вас...
paginae/quest/gearshift=Чем больше вы исследуете окружающий мир, тем больше замечаете взаимосвязей и путей развития. Наверное, теперь следует попробовать следующее...
paginae/quest/hunting=Совсем рядом в кустах прячется добыча на шкуру. Зов охоты зовёт вас...
paginae/quest/lumber=Когда в лесу падает дерево, вы нередко оказываетесь рядом, чтобы это услышать. Неукрощённая природа требует от вас...
paginae/quest/metalworking=Расплавленный путь металла и кузнечного дела открылся перед вами, и новые озарения наверняка придут, стоит только вам...
paginae/quest/pottery=Осколки понимания гончарного дела вспыхнули перед внутренним взором. Чтобы вылепить сосуд своего знания, вам нужно...
paginae/quest/questlog=Журнал заданий.
paginae/quest/steelmaking=Недавно вам открылось, что некоторые смеси угля и железа дают материал самых удивительных свойств, и наверняка можно узнать больше, стоит только вам...
paginae/quest/stonework=Вы узнали о камнях и минералах, что усеивают утёсы и горы Хавена. Чтобы высечь из них своё знание, вам нужно...
paginae/quest/tanning=Жёсткость шкур, сушившихся много дней под палящим солнцем, оставила след в ваших мыслях. Чтобы войти в кожу нового понимания, вам нужно...
paginae/quest/wildways=Воздух меняется и мир вокруг, кажется, становится всё более реальным, в отличии от воспоминаний о далеком дремучем лесу, которые медленно тают у вас в голове. Свобода двигаться когда и куда угодно пьянит вас. Любопытство, однако, заставляет вас...
paginae/quest/windquest=Вы услышали в дуновении ветра тихий шепот, быть может имя пока неизвестного покровителя, заставивший вас отправиться в путешествие путями, неизбежно ведущими ему навстречу. И кто знает, какие странные приключения ожидают дальше впереди по дороге, о которой прошептал ветер?
paginae/seid/ancstr=Благодаря молитве о силе, вы можете перенять черту эйнхериев ваших покойных предков и наслаждаться возросшей боевой мощью один полный день, пока действует эта способность.
paginae/seid/capsense=Коронационный камень - источник и средоточие силы королевства. Прикоснувшись к потокам власти, вы можете определить направление к коронационному камню текущего королевства.
paginae/seid/cmbtpray=Каждая молитва восстанавливает один уровень всех боевых приёмов, известных вашему непосредственному предку.
paginae/seid/commune=Вы верите в то, что способны обнаружить пробудившиеся элементы местности общаясь с природой и читая её знаки.\n\nСтоимость: 2000 XP
paginae/seid/conmed=Созерцая и размышляя над предметом исследования, вы можете вдвое уменьшить оставшееся время изучения.\n\nСтоимость: 1500 XP
paginae/seid/digdeeper=Копая глубже колодец, вы можете достичь более глубоких, более прохладных и более свежих источников воды, повышая качество воды в нём. Копать становится тем дороже, чем глубже вы опускаетесь.\n\nСтоимость: 20000 XP, удваивается каждый раз, когда вы копаете глубже.
paginae/seid/fishpray=Где-то в этом мире есть рыба, которая ждет, чтобы ее поймали, и вы знаете заговор, который может в этом помочь.\n\nСтоимость: 1000 XP
paginae/seid/gildingsong=Вам известны тайные слова, способные заговорить даже самый непослушный артефакт. Песня украшения добавляет новую ячейку уже завершенному артефакту.\n\nСтоимость: базовая стоимость 5000 очков опыта, которая увеличивается на x1.5 с каждым уже пришитым украшением, и на x2.0 за каждый раз, когда над артефактом уже была спета Песня украшения.
paginae/seid/greenthumb=Позаботьтесь о чахлом дереве, и оно вновь начнёт расти с новой силой.
paginae/seid/horsewhisper=В момент острой необходимости, вы, как немногие другие, способны мчаться верхом словно ветер. Заклинанием Нашептать Лошади вы можете заставить лошадь мгновенно задействовать свои неиспользованные источники энергии.\n\n Стоимость: 2500 XP
paginae/seid/kinpray=Восстанавливает память обо всех персонажах, которых помнил ваш непосредственный предок, но не их статус знакомства.
paginae/seid/lament=Оплакивание ушедших заменяет надлежащее погребение предков. При каждом использовании вы наследуете долю их характеристик и способностей, пока не достигнете предела наследования. Стоимость в нумене растёт с каждым использованием.
paginae/seid/minesong=Размеренный напев рудокопа, в созвучии с равномерным звоном его кирки, в созвучии с постоянным шумом горы, сулит неизменный гул богатых жил. Вы добываете больше руды и камня, пока поете Песню Рудника.\n\nСтоимость: 1500 XP
paginae/seid/polsil=Полировка серебра позволяет полностью избавиться от изношенности столового прибора \n\nСтоимость: 250 XP.
paginae/seid/provpray=Восстанавливает знание обо всех тингволлах, посещённых вашим непосредственным предком.
paginae/seid/quell=Доброе слово способно успокоить и самых диких зверей. \n\nСтоимость: 5000 XP
paginae/seid/rawhide=Проорите могучим голосом, чтоб испугать всех лошадей поблизости и заставить их некоторое время пятиться. Чем ближе лошадь, тем дольше она будет напугана.\n\nСтоимость: 2500 XP.
paginae/seid/seenpray=Восстанавливает все открытия вашего непосредственного предка.\n\nУчтите: при использовании этой молитвы очки обучения, обычно получаемые за открытия, не начисляются.
paginae/seid/spark=Вам известен секретный трюк, как разжечь огонь щелчком пальцев.\n\nСтоимость: 500 XP
paginae/seid/stargaze=Наблюдая за звёздами, вы можете попытаться определить место падения звезды.
paginae/seid/stuffprayer=Молитва об изобилии может побудить предков даровать вам один предмет из их несметных сокровищ.
paginae/seid/thingsense=Могучие тингволлы служат узлами перемещения по землям. Ощутив краски ветра, вы можете определить направление к тингволлу текущей провинции.
paginae/seid/vincant=Черпая вдохновение из холодной мести и благодаря вашим исключительным познаниям в тёмных искусствах, вы способны послать за ненавистным врагом самого страшного из Назгулов.\n\nСтоимость: 7500 XP
paginae/skills/ahusb=$i{"Harnessed by the Old Gods,\nThe Urox plowed across the skies,\nThe furrow of time."}\n\nВы достаточно изучили животных в окружающем мире, чтобы мысль об их приручении закралась в ваш разум. Вы научились ловить и приручать животных, а также строить курятники, кормушки и стойки приручения.\n\nЧтобы приручить дикое приручаемое животное: \nВо-первых, приманите его клевером.\nЗатем заарканьте его веревкой.\nЗатем привяжите к стойке приручения.\nВскоре животное захочет подраться.\nПобедите в бою столько раз, сколько потребуется но делайте это только когда этого хочет животное.\nОстанавливайте руку, когда животное сдается.\nПовторяйте до тех пор, пока животное не приручится.
paginae/skills/alchemy=Алхимия позволяет смешивать эликсиры из ингредиентов.
paginae/skills/ancw=$i{"In Black smoke, from wet logs,\nThe hour was late,\nWhen Thangest old,\nof memory late, spoke."}\n\nЗнание Поклонения предкам открывает духовную связь с теми, кто уже прошёл через пламя жизни до вас, чтобы начать почитать их культ и память. Принося подобающие дары на Алтарь предков, вы получите странные мистические силы, чтобы влиять на Плетение Судьбы.
paginae/skills/archery=$i{"Where Alfthing fell,\nOn blood-wet grass,\nA broken arrow."}\n\nБазовое знание стрельбы из лука позволяет вам создавать и использовать луки, стрелы и колчаны.
paginae/skills/artifice=$i{"The Great Clockwork of the Hearth,\nTells the time of all times,\nTicks the sun, moves the beast, draws forth the plants to eat."}\n\nВы достигли истинного мастерства в производстве вещей. Успех при добыче руды и ковке железа значительно увеличен.
paginae/skills/baking=$i{"Rising slowly,\nLeavened with time,\nSweet as the ages."}\n\nЧто-то прекрасно пахнет, и вы, кажется, знаете что. Вы научились выпекать хлеб и пироги.
paginae/skills/beekeeping=$i{"Golden Honey flowing,\nFrom flowerbeds and trees,\nThe sweetest things of nature,\nAre brought to us by bees."}\n\nВам слышится знакомое жужжание. Вы научились строить пчелиные ульи.
paginae/skills/boardgames=$i{"Из дома взятый,\nВо мраке ночи,\nПри белом свете луны\nОн стоял в стороне от доски."}\n\nЛюбовь к механизмам и головоломкам со временем нашла игровое выражение в той же любви к играм любого рода, позволяя вам создавать различные настольные игры и подобные изделия.
paginae/skills/boating=$i{"Glimma, mighty ship,\nBuilt from boards of Cherry,\nTo sail into the Sun."}\n\nВы научились строить простую лодку, чтобы, наконец, побывать на дальних озерах и реках.
paginae/skills/butchery=$i{"Blood, from bone,\nTo bubble-bubble,\nRivers red, and foaming.\nMeat, from roaring fires."}\n\nВы продвинулись в искусстве и хитрости разделки и теперь можете полнее разделывать любого зверя, домашнего или дикого. Искусная разделка позволяет извлекать субпродукты - мозг, яички и прочее - и открывает более сложные рецепты из животного сырья.
paginae/skills/cheesemaking=Сыроделие позволяет делать сыры из молока.
paginae/skills/coaling=$i{"Embers in the dark,\nAsh bleeding pitch,\nFire born anew."}\n\nЛеса отдают вам свои самые чёрные сокровища. Вы умеете строить смоляные печи и знаете, как медленно томить дерево в уголь без пламени, попутно добывая дёготь.
paginae/skills/cooking=$i{"Many fell in the west,\nand the weary long did wander,\nto feasts and roaring fire."}\n\nВы расширили свои познания в еде, и теперь вам доступно множество более сложных рецептов и блюд.
paginae/skills/crp=$i{"The three drew up along the Tostan,\nTo there do nail and build,\nA mighty Hall of Oak and Cedars."}\n\nВы научились выпиливать доски из брёвен, что открывает для вас более широкий спектр доступных предметов и строений.
paginae/skills/druidicrite=$i{"By the first moon of the solstice,\nEsthan brought swine to the Irminsul,\nThere hanging them for eight days,\nResting dead on soot-black branches."}\n\nВы бродили среди тёмных чащ и видели восход луны над замшелыми могилами, где кричит мандрагора. Вы достигаете вершины мастерства в садоводстве, выращивании деревьев и разматывании коконов шелкопряда.
paginae/skills/farming=$i{"Watered by sweat there grew,\nGolden in Autumn, that Spring,\nWhere Winds did play and hide,\nIn sun-kissed Wheat and Barley."}\n\nВаши руки устало ложатся на плуг, и, отложив в сторону косу, вы вспоминаете годы тяжелой работы. Вы знаете, как сажать семена, пользоваться плугом и косой.
paginae/skills/firecraft=$i{"Forged in flame,\nborn of smoke,\nembers glowing,\nin the dark."}\n\nВы изучили пути пламени и научились держать огонь в плену дольше. Преобразующая сила огня, особенно над едой, стала вам яснее, и теперь вы можете готовить, создавать и строить вещи, связанные с огнём.
paginae/skills/firstaid=$i{"He saw as his task,\nTo pay every tribute of need.\nFor some water,\nFor others rest,\nUnder the shade of trees."}\n\nВы учитесь создавать и использовать простейшие компрессы, зелья и повязки для лечения ран и болезней.
paginae/skills/fishing=$i{"The fathoms give nothing,\nYield not a single thing,\nBut to the fishermens' snares."}\n\nВы изучаете базовые принципы рыбной ловли и можете создавать удочки, спиннинги, крючки и приманки.\n\nЕсть два вида рыбной ловли: с помощью удочки или спиннинга. При ловле на удочку используются различные типы живой наживки -- червяки, внутренности, муравьи и т.п. -- тогда как при ловле на спиннинг используются приманки. На удочку рыбу можно поймать в любой момент, как она клюнет, однако более требовательный спиннинг требует особого внимания и терпения. Именно с помощью спиннинга можно поймать самые редкие виды рыб.
paginae/skills/forage=$i{"Full in her pride she stood,\nBlossoming through spring and autumn,\nWild with fruit and harvest-flowers."}\n\nВы узнаете пару-тройку вещей о дикорастущих травах и можете собирать те из них, которые доступны вашему взору. Увеличивая "Внимательность" и "Исследование" вы сможете расширить диапазон доступных для собирания трав, однако для некоторых из них потребуется особая удача.
paginae/skills/forestry=$i{"Elfafnr nursed by the springs of Tain,\nThree Oaks for each of the Norns,\nTwo Linden trees for the Old,\nApples for himself."}\n\nВам не безразлична природа и вы научились ухаживать за ней. Благодаря усердной учебе вы узнали много вещей о посадке деревьев и теперь умеете это делать гораздо лучше. Изучение шелковиц также помогает вам лучше разматывать коконы шелкопрядов.
paginae/skills/forging=$i{"Roaring with laughter,\nFlames burn blue and red,\nAnd stone flows like water."}\n\nБолее глубокое понимание плавки металлов при высоких температурах дало вам умение строить кузнечные печи и проковывать чугунную крицу в кованое железо.
paginae/skills/gardening=$i{"Green and cool,\nWarm and welcoming,\nYour garden plot,\nAnd home."}\n\nСадоводство доставляет вам удовольствие, и вы получаете гораздо больше семян при сборе урожая. Чистота и спокойствие разума, достижимые только в саду, позволяют вам более успешно разматывать коконы шелкопрядов.
paginae/skills/glass=$i{"Skybridge,\nHigh road to the home of the Gods,\nGleaming in many colors,\nBroken through a shard of glass."}\n\nХрупкое стекло в ваших руках становится мягким и податливым. Вы научились плавить стекло из песка и щёлочи и выдувать его в форму.
paginae/skills/hearthmagic=$i{"Hildur was a wise one,\nOld crone rich in years,\nThey said she knew the runes,\nRunes to make a broom dance,\nA cat bark,\nA sound of silence."}\n\nВы обнаружили, что некоторые события на грани сна и бодрствования могут быть проявлениями Древней магии и научились делать некоторые предметы, действующие по этим законам.
paginae/skills/hunting=$i{"In a bloodred moment,\nThe beast fell still,\nGiving life through death."}\n\nПохоже, вы достигли достаточного уровня навыков и мужества, чтобы посметь напасть на диких животных, убивать их и освежевывать. Берегитесь! Некоторые животные убьют и съедят вас, если ваших умений окажется недостаточно. Начинайте с малого, с муравьёв и подготавливайте свои навыки прежде, чем переходить к кому-то посерьёзнее.\n\nНекоторые маленькие животные, например, кролики или лягушки, могут быть пойманы голыми руками, если вы сможете их догнать.
paginae/skills/jewelry=$i{"Timeless luster,\nAge and tradition,\nBeauty eternal."}\n\nВы научились работе с драгоценными металлами и другими особыми материалами, что позволяет вам делать ювелирные изделия.
paginae/skills/landscaping=$i{"The line drawn straight,\nLevel, and aligned,\nTo strike the earth."}\n\nЗемля уступает вашему прикосновению. Вы можете ставить разметку участка, чтобы ускорить работы по ландшафту, и строить земляные подмости для более крутых склонов.
paginae/skills/lawspeaking=$i{"Where there was strife, let there be kinship.\nWhere there was hunger, let there be bread.\nWhere, yesteryear, pyres burned, let there be law."}\n\nТрадиционно общество хартлингов с большим уважением относится к должности Старейшины. Пусть его задачи меняются со временем, но его всегда взывают к выполнению обязанностей, когда необходимо разрешить спор, принять или восстановить клятву. Наличие навыка Законодательства позволяет вашему персонажу основывать деревни.
paginae/skills/locks=$i{"This place was not for you,\nWas not meant for your eyes,\nWas locked away for me alone."}\n\nВы научились создавать и устанавливать замки, чтобы защитить сундуки и ворота от несанкционированного доступа.
paginae/skills/lumber=$i{"Birch, and Elm, and Yew, and Fir,\nNine and one,\nHe fell them all,\nAsh, and Beech, and Larch, and Pine.}\n\nВы научились использовать топор для лесозаготовки. Помните, что пни можно выкорчевывать с помощью лопат.
paginae/skills/mechanics=$i{"A dream of soot,\nAnd cogs in rhythmic motion,\nAnd sprawling, clockwork cities."}\n\nБлагодаря усердному изучению основ окружающего мира вы научились создавать более сложные предметы.
paginae/skills/metallurgy=$i{"Deep by the roots of the mountain,\nLocked away behind cold and stone,\nGleaming in the dark, \nClamoring to be found."}\n\nВы достигаете мастерства в работе с металлами, познаете их силу и слабости. Вы добываете руду улучшенного качества, шанс перековки железа значительно увеличивается.
paginae/skills/metalworking=$i{"Embers glow in a furnace,\nA plow glows in the field,\nSwords glow in battle."}\n\nВы научились выплавлять и ковать металл, строить тигли, наковальни и плавильные печи, если вы добыли все необходимые материалы. Также вы находите руду чуть лучшего качества в процессе добычи.
paginae/skills/mining=$i{"King Under The Mountain,\nCrowned in stone and steel,\nHis deep mine and torch-lit halls."}\n\nВы научились основам горного дела, добыче руд, а также сооружать шахты и подпорки, если остальные материалы для их постройки вам доступны.
paginae/skills/murder=Убийство - тяжкое преступление против других персонажей.
paginae/skills/music=$i{"Dreaming rose,\nBy Hearth and Haven,\nSound to please the Völva's ear."}\n\nЗвуки Очага и Сфер над ним обрели в вас форму Музыки, даруя умение создавать и играть на инструментах.
paginae/skills/oral=$i{"Of all the Ancients,\nMost among them saw Walwar,\nYet always spoke he the least."}\n\nСказано, что первые легенды достались людям в наследство от старых богов. И это - одна из них.
paginae/skills/painting=$i{"Ettinaz saw the signs,\nAnd read the Omens right.\nHe made from hides a tapestry,\nTo tell the gruesome tale."}\n\nВы владеете кистью и исскуством смешивания красок для создания узоров согласно файлам, загруженным вами на страницу Haven & Hearth.
paginae/skills/pipeweed=$i{"Coiling rose the smoke,\nUp to soot the rafters,\nOf the hut which Gramteft built,\nWhere pipeweed clads the roof."}\n\nВы отведали лучший трубочный табак Южной Четверти и вели его нежные всходы от зелёных ростков до струек голубого дыма за горизонтом. Вы можете сажать табак и создавать принадлежности для его достойного употребления.
paginae/skills/plantlore=$i{"Growing silently,\nFrom shadows everflowing,\nLight of greenery."}\n\nВы уже кое чему научились в области выращивания диких и культурных растений. Вы получаете больше семян в процессе сбора урожая и более успешно сажаете деревья.
paginae/skills/pottery=$i{"Cracked, the potter's clay,\nPouring water, scraping dry,\nThe Vessel of Eternity.}\n\nВы научились делать горшки, кружки и вазы из глины. Глину можно найти на отмелях и, затем, обработать в печах для обжига.
paginae/skills/rage=$i{"Insults fell on his mind,\nLike sparks on wet leaves,\nUntil the leaves, one day, were dry.}\n\nС вас хватит и кто-то должен за это ответить. Ярость позволяет вам атаковать других персонажей.\n\nБерегитесь! Каждое нарушение закона оставляет след, -- который может быть использован, чтобы выследить вас -- и нахождение вне закона не дает вашему персонажу выйти из игры некоторое время после совершения преступления.
paginae/skills/ropetwin=$i{"One over one,\nHe drew round over round,\nTwinning rope from golden strands"}\n\nВы научились создавать и использовать Верёвочный станок. Вяжите веревки, они вам пригодятся!
paginae/skills/sausagemaking=$i{"Crank of lever,\nPull of pork,\nSplit the bone,\nWield the fork."}\n\nВы начинаете понимать как превратить сырое мясо и кишки в одни из самых вкусных блюд, вы когда-нибудь пробовали.
paginae/skills/sewing=$i{"She stayed up, night on night,\nUnder pale moons and distant stars,\nSewing her shirt for a son lost."}\n\nВы приобрели базовые навыки работы с нитками и волокнами. Теперь вы можете создавать ткань и изделия из неё.
paginae/skills/siege=$i{"Over land and bubbling brooks,\nWere brought to bear,\nStones, borne high by brimstone."}\n\nВы достигли достаточного уровня мастерства в исскустве разрушения, чтобы извлечь из этого дополнительную пользу. Осадное дело позволяет вам строить катапульты и тараны для атаки вражеских поселений и их щитов.
paginae/skills/silk=$i{"Ratjik's shirt was sewn,\nNot from fibre, nor hide,\nNot from animal, nor plant,\nWhat stuff made Ratjik's shirt?"}\n\nВы провели некоторое время среди шелковиц и научились добывать шелк. Разводите шелкопрядов, выкладывайте их яйца на столы травника, кормите личинки шелковичными листьями и разматывайте коконы.
paginae/skills/srv=$i{"Kodving broke the ice,\nSkarm drew him up,\nLogi saved them both."}\n\nСказано, что огонек разума в каждом человеке - это отголосок древнего искусства разведения Огня и Большого пути. Любой человек, появившийся в мире, знает, как развести огонь, построить очаг и вертел, если он, конечно, найдет подходящие материалы.
paginae/skills/steelmaking=$i{"Born in flame,\nYet cold and silent,\nThirsting for blood.\nWho am I?"}\n\nУгли в печи раскаляются, и из неё выходят одни из самых удивительных веществ в мире. Вы научились изготавливать сталь в стальных тиглях, а также намного лучше умеете выковывать железо.
paginae/skills/stonework=$i{"Valind hew these stones,\nBearing in silent witness,\nA boast to his father."}\n\nВы научились извлекать пользу и красоту из обычных скал и камней.
paginae/skills/swim=$i{"Nine drops of rain-water,\nHe carried,\nOver land and black seas."}\n\nВы учитесь тому, как добраться на глубину, однако всегда есть риск не вернуться обратно к родным берегам. Будучи беспечным легко утонуть, а длительность плавания напрямую зависит от величины параметра "Телосложения".
paginae/skills/tanning=$i{"And it gleamed in the sun,\nTheir polished armor made,\nOf red and purple leathers."}\n\nВы научились вонючему, но полезному умению превращать шкуры животных в кожу. Постройте "Дубильный чан", наполните его "Дубильной жидкостью" и положите туда шкуры.\n\nЧтоб создать дубильную жидкость бросьте кору в контейнер с водой или дубильный чан. Дубильная жидкость должна иметь концентрацию не менее 5%.
paginae/skills/theft=$i{"There lay hidden Woglin's gold,\nBanded rings and bands in mounds,\nNo one saw it leave,\nSave Vilgoth and the Moon."}\n\nВаши длинные ловкие пальцы начинают зудеть и подрагивать. Воровство позволяет вам воровать частную собственность. \n\nБерегитесь! Каждое нарушение закона оставляет след -- который может быть использован, чтобы выследить вас -- и нахождение вне закона не дает вашему персонажу выйти из игры некоторое время после совершения преступления.
paginae/skills/tools=$i{"Fashioned alone,\nBy fire at night,\nWith fire in mind,\nThree Ashen staves."}\n\nСказано, что некоторые мистические формы навечно отпечатаны в виде созвездий на небосводе. Вы научились делать каменный топор, если, конечно, у вас найдутся подходящие материалы.
paginae/skills/trade=Торговля открывает обмен с другими игроками и прилавки.
paginae/skills/tres=$i{"Во тьме ночной\nАлгаур нашёл тайную тропу\nСквозь заросли колючек -\nК укромным, потаённым местам."}\n\nВаши ноги могут ступать там, куда им ступать запрещено. Нарушение границ позволяет вам манипулировать чужой частной собственностью без разрешения, например, заглядывать в контейнеры.\n\nКаждое нарушение закона оставляет след -- который может быть использован, чтобы выследить вас.
paginae/skills/tunneling=$i{"Caroubdin, High King\nDemanded of his mountain realm,\nIn the third month of the Conflux,\nRed Gold, and Blue steel."}\n\nВы начинаете лучше разбираться в горной породе, её путях, сущности и коварных капризах. Вы можете сооружать каменные колонны для более безопасной работы под землей и находите более высококачественную руду в процессе добычи.
paginae/skills/vandal=$i{"The Skarm was forded by the late solstice,\nThe Heiskarl brought two by six ships.\nThe city was sacked.}\n\nЧто-то глубоко внутри вас начинает жаждать, чтобы этот мир сгорел. Вы можете уничтожать объекты и совершать другие разрушительные действия на чужой территории без разрешения.Берегитесь! Каждое нарушение закона оставляет след -- который может быть использован, чтобы выследить вас -- и нахождение вне закона не дает вашему персонажу выйти из игры некоторое время после совершения преступления.
paginae/skills/wheelwrighting=$i{"Creaking along,\nIn mud-swollen tracks,\nBut steady,\nAnd sturdy,\nTurns the Wheel of Seasons."}\n\nВы научились делать колесо и большинство связанных с ним устройств, например, тачки, тележки и т.д.
paginae/skills/winemaking=$i{"In autumn vineyards,\nDrunk with song and laughter,\nAnd bittersweet juice,\nRed with love and promise."}\n\nВы узнаете хорошее вино на вкус, а также узнаете как выращивать виноград и выдавливать сок, чтобы заниматься виноделием. Секрет? Настаивайте сок в больших бутылях и храните в бочках.
paginae/skills/woodsmanship=$i{"In the depth of winter,\nLie hidden away,\nAlong secret trails,\nThe seeds of spring."}\n\nПобродив в лесах, вы начинаете понемногу в них разбираться. Теперь ваши деревья растут лучше.
paginae/skills/wzm=$i{"Wicked portents,\nA black ash dripping with blood.\nAnd the entrails whisper\nOf lies and deceit."}\n\nВы начинаете жаждать... большего. Тяга к власти - это первый шаг на пути к доминированию, но это не обойдётся без последствий.
paginae/skills/yeomanry=$i{"Kolbjorn first broke the land around the Veitvast,\nHis family now sits in unbroken line by that water,\nTheir Halls ringing with mead and laughter."}\n\nВы достаточно осмотрелись в мире, чтобы сделать одну из его частей своей. Вы можете строить знаки Частной собственности превращая землю вокруг них в свою личную.
paginae/skills/yrkir/blacksmith=Металл звенит чистыми нотами под громом вашего молота, а ваши мускулы выросли до ужасающих размеров, достаточных, чтоб гнуть сталь. Свою жизнь вы проживаете и организуете в ритме размеренного пульсирующего грохота молотов и вздымающихся мехов, тяжело вздыхающих горячим, полным сажей воздухом, заново вырывающимся, чтобы насытить вечно голодные, вечно пылающие горны, отражающиеся в зеркальной глади расплавленного металла. Вам известны материи, из которых составлен Мир, земля и дерево, и как утолить жажду металлических форм в полыхающей ярости раскаленных добела огней. Небосвод Мира был выкован тонким, словно чешуйка, из единого серебряного самородка и подвешен Творцом над Миром. Грохот Наковальни Кузнеца сулит...\n$col[255,255,0]{\n • Сила +15, Кузнечное дело +15\n • Небольшой бонус качества всего топлива, помещаемого в плавильные печи и горны.\n • Более высокий шанс повысить качество при производстве кованого железа.\n • Небольшой бонус качества при ковке.\n • Небольшая вероятность удвоенного количества продуктов при ковке.}
paginae/skills/yrkir/blacksmith0=В одно мгновение из самых дальних глубин вашего сознания доносится металлический звон, грозящий разбить его вдребезги.
paginae/skills/yrkir/blacksmith1=В голове грохочет, словно сотня молотов бьёт по сотне наковален. Перед вашими глазами в страшных муках извиваются видения клинков и расплавленного металла.
paginae/skills/yrkir/blacksmith2=Наступает тишина. Вы медленно сковываете обломки своего сознания, возвращая им знакомую форму. В ночи слышны лишь удары вашего молота.
paginae/skills/yrkir/blacksmith3=В расплавленном металле вам видятся тысячи ртов из шлака. Они открываются и закрываются, нашёптывая самые тёмные тайны железа и кровавика.
paginae/skills/yrkir/blacksmith4=С наковальни вашего разума летят искры и взметаются языки пламени. Удары молота гремят всё громче, грозя расколоть Наковальню Кузнеца надвое. С каждым ударом всё яснее проступает ваш новый облик.
paginae/skills/yrkir/cavehermit=Поверхность Мира превратилась лишь в далекое воспоминание, а волны истории могут как-угодно катиться далеко наверху, в этом бушующем сумбурном мире света и дня. Вашим миром стал иной, более спокойный, темный, глубокий и более древний, мир спокойствия и размышлений, глубоко внизу в прохладе и мраке самых глубоких пещер, где меркнет взор хартлинга, но вместо него другие чувства обостряются с пугающей силой. Вы проводите свои бесконечные ночи далеко внизу, внизу у корней горы, в мускусном запахе пещерного лука, в касаниях слизи и призрачных симфониях тысяч летучих мышей, визжащих в ужасном созвучии. Ваша стезя - это путь камня и мысли, и единения, в конечном счете, с тьмой пещеристого Подземного мира. Созерцание Бездны Пещерного Отшельника сулит...\n$col[255,255,0]{\n • Значительное повышение риска наткнуться на троллей во время добычи ископаемых.\n • Возможность поедать Сталагумы и Пещерных слизней.\n • +3% к скорости изучения за каждый уровень пещеры, на который вы спускаетесь.\n • Увеличение наносимого урона на дополнительных 5% за уровень пещеры, на который вы спускаетесь.\n • Тролли больше не нападают на вас.}
paginae/skills/yrkir/cavehermit0=Глубоко вдохнув, вы ныряете и третьим глазом всматриваетесь в ночь бездны. Действительность быстро растворяется в камне и мраке, и вам кажется, будто вас похоронили заживо.
paginae/skills/yrkir/cavehermit1=Свет исчез из виду. Вы провалились в глубокую пещеру своего сознания и смотрите, как на её стенах пляшут странные тени мифов и аллегорий.
paginae/skills/yrkir/cavehermit2=Вы заблудились в собственных глубинах. Вас преследует мысль, что вы больше никогда не выберетесь наружу и навечно останетесь во тьме горных недр.
paginae/skills/yrkir/cavehermit3=Вот оно! Едва заметная вспышка, словно пирит ударил о сталь. И вот тени снова пляшут перед глазами, будто подсвеченные коптящим огнём.
paginae/skills/yrkir/cavehermit4=С каждой минутой действительность проясняется, а тени обретают очертания, превращаясь в мысли, идеи и открытия. Вы далеко прошли по огромной пещере своего разума, и ваше преображение почти завершено. Словно в приветствие с поверхности доносится дуновение свежего воздуха.
paginae/skills/yrkir/cook=Повар
paginae/skills/yrkir/cook0=Вы смешали припасы из кладовой своего разума и поставили их вариться на слабом огне. Но суп вышел пресным: в нём не хватает соли.
paginae/skills/yrkir/cook1=На языке мелькает вкус добрых кусков мяса, зажаренных над ревущим огнём с медовухой и мёдом. Но остаётся неприятный привкус крови и железа, словно мясо ещё сырое.
paginae/skills/yrkir/cook2=Вам снятся золотистые буханки, пахнущие перцем, тмином и пряностями далёких земель. Но стоит потянуться, чтобы откусить кусочек, как в руках остаются лишь пар и призраки.
paginae/skills/yrkir/cook3=Вам чудится запах большого окуня, выпотрошенного, начинённого лавровым листом и душистыми травами и запечённого на подушке из укропа. Его кожица хрустит от масла. Вы ужасно голодны.
paginae/skills/yrkir/cook4=Вы почти можете ощутить вкус кулинарного совершенства, к которому так долго стремились. После всех испытаний вашей стряпне недостаёт лишь маленькой щепотки соли.
paginae/skills/yrkir/farmer=В золотистых полях, распростершихся аж до самого синего горизонта, посеяны мифы людей, тесно связанных с почвой, которую они возделывают, и с зерном, которое они мелют. По мере того, как вы становились Фермером, вам хотелось узнать еще больше о них, и сейчас внутри вас прорастают листья мудрости о временах года, и о посевах, и обо всем растущем. В скрипе прорастающих корней вы услышали истории о том, как семя мира однажды было посажено древними богами, еще задолго до того как луна была подвешена над Миром, чтобы освещать его. В стручках гороха вы узрели странные и древние руны, пророчащие грядущий конец мира и его разрушение. Ветер, качая колосья ячменя, зазывает вас вперед, на сбор нового вдохновения. Вспахивание Борозды Фермера сулит...\n$col[255,255,0]{\n • Огородничество +15\n • Бонус качества при доении.\n • Более быстрый рост посевов.\n • Повышение урожайности.\n • Огородничество +50}
paginae/skills/yrkir/farmer0=Вы начали активно проявлять интерес к переменам погоды и медленному круговороту времен года. Иногда вы готовы поклясться, что слышите, как растет мак.
paginae/skills/yrkir/farmer1=Ваши мысли теперь обитают на более зеленых пастбищах, от посадки гороха до различных надлежащих способов прополки пшеницы. Однажды вы вырастили морковь в форме собственного сердца.
paginae/skills/yrkir/farmer2=Словно заботливый капустный червь, вы пробираетесь сквозь поля и плантации, и, куда бы вы ни шли, жизнь вокруг поет тихую серенаду вашим умелым рукам.
paginae/skills/yrkir/farmer3=В ваших заботливых руках дикая природа смирилась и расцвела во всём своём изобилии. Вы выращиваете свёклу с крепкий кулак, а капусту - с голову, полную фермерской мудрости. Такую, как ваша.
paginae/skills/yrkir/farmer4=Вы познали почти все, что можно узнать о путях фермера, миновав, возможно, только священный язык червей, звучащий в их скольжении там, где жизнь возвращается в удобрение, а затем заново превращается в жизнь. Цветы устилают лепестками ваш путь, куда бы вы ни направились.
paginae/skills/yrkir/fisherman=Далеко под волнами проблескивают сокровища мудрости, и в дыхании рыбы вы услышали загадки жизни и смерти. С тех пор, как ваши стопы впервые коснулись воды, песня сирены позвала вас глубже, глубже и дальше вниз, в синеву, чтобы повидать завивающиеся дебри водорослей, где Плотва с Щукой играют в прятки, и бурлящие воды, где танцует Лосось. Рябь на глади тихих вод зовет вас выучить имена существ плавающих в воде и под водой. Натяжение Нити Рыбака сулит...\n$col[255,255,0]{\n • Снижение риска потери рыболовного снаряжения.\n • Поимку более интересного мусора во время рыбалки.\n • Увеличенный шанс на редкий улов.\n • Повышенную скорость плавания.\n • Увеличенное базовое качество пойманной рыбы.}
paginae/skills/yrkir/fisherman0=Вы принялись прослеживать потоки и течения вокруг себя, но пока собираете только самые мелкие фрагменты их истинного значения.
paginae/skills/yrkir/fisherman1=Вы освоились в водах и можете прочесть в чешуе Жереха и Окуня историю их знатного рода. Волны, однако, пока по-прежнему приносят вас обратно к берегу.
paginae/skills/yrkir/fisherman2=Теперь вы уверенно покоряете даже бурные воды и начали постигать доселе неведомые тайны глубин. И угорь не проскользнет сквозь ваши пальцы.
paginae/skills/yrkir/fisherman3=Вы различаете хриплые рыдания Чаек среди шума ветра и морской воды и видели свое отражение в переливающемся перламутре.
paginae/skills/yrkir/fisherman4=Из самого далекого океана, звуча эхом в самом маленьком ручье, вам слышна гремящая, призрачная и далекая песня китов, и вы мечтаете о том, чтоб однажды плыть вместе с ними. Только самый диковинный моллюск всё ещё не открыл вам своих тайн.
paginae/skills/yrkir/forager=Под распростертым пологом леса обилие дикой природы Мира поет вокруг вас, и, словно во сне, вы ощутили всю необъятность форм жизни, вместе с тем испытав непреодолимое желание узнать их имена и пути. Говорят, древние хартлинги пили свет солнца, и как следствие, боги создали лист и корень, чтобы укрыть эту первую древность, что видела их выпущенными на волю. В сагах много мудрости, и аромат ветра зовет вас запомнить ещё больше новых вещей растущих и вьющихся. Блуждание Путем Собирателя сулит...\n$col[255,255,0]{\n • Исследование +10\n • Восприятие +10\n • Бонус скорости во время погони за маленькими животными.\n • Повышенное базовое качество собираемых трав.\n • Сбор удвоенного количества трав с некоторым шансом.}
paginae/skills/yrkir/forager0=Вы пока еще зеленый новичок, но шепот среди деревьев и ручьев уже начал обучать вас видеть и различать имена растущего, а также узнавать их приметы.
paginae/skills/yrkir/forager1=Вы освоились в распространенных травах и цветах, и знаете, где прячутся лисички. Куда бы вы ни пошли, кажется, что деревья обращают на вас внимание.
paginae/skills/yrkir/forager2=Вы блуждали на большие расстояния, и стопы ваших ног стали черными от грязи, измождёнными от колючек, но, тем не менее, ничто не омрачило ваше любопытство, а ваше желание узнать больше о тисе, мирте и шалфее растёт, словно после дождя.
paginae/skills/yrkir/forager3=На нижней стороне листьев Березы выведено ваше имя на языке, известном лишь ей одной. Теперь вам снятся сны только в оттенках зеленого, и вы способны учуять трюфели за несколько верст.
paginae/skills/yrkir/forager4=Пока вы все еще не мастер, но из желудя вашего желания пророс могучий дуб. Жаба поет для вас свои осенние гимны, Крапива пообещала не жалить никогда, и лишь несколько самых малых секретов вам все еще предстоит постигнуть.
paginae/skills/yrkir/gardener=Листья вздрагивают от вашего касания, словно от первых лучей яркого весеннего солнца, отражая немного собственной зелени обратно вам и вашим пальцам. Куда бы вы ни брели, кажется, что семена прорастают из-под ваших стоп, а прикосновение ваших босых подошв возвращает к жизни увядающую траву. Тайны всего растущего известны вам, и вы прослеживаете нити жизни и смерти в очертаниях и линиях роста травы и листьев. Ваша мечта как садовода, – подрезать и придавать буйному изобилию дикой природы приятных и продуманных форм первообраза ухоженного сада. Мифы повествуют о том, что когда-то весь Мир разлился из единого семени. Восхождение по Стеблю Садовода сулит...\n$col[255,255,0]{\n • Возможность выращивать кровавый стебель, Огородничество +5\n • Возможность выращивать пещерный лук, Огородничество +5\n • Уменьшение на половину количества требуемых для садовых горшков почвы и воды.\n • Возможность выращивать колокольчики, Огородничество +10\n • Удвоенный урожай с садовых горшков.}
paginae/skills/yrkir/gardener0=Внезапно нечто проросло глубоко в вашем сознании, словно семя, приютившееся где-то в глубине вашей головы, и вы уже чувствуете, как оно вьется новой жизнью.
paginae/skills/yrkir/gardener1=Мгла величественной зелени стала заполнять ваш взор, подобная пробивающемуся сквозь вуаль листьев и стеблей свету. Из семени в вашем разуме пробился живой, трепещущий росток и упёрся в основание черепа.
paginae/skills/yrkir/gardener2=У вас раскалывается голова, словно вы прожили целую жизнь под ослепительным солнцем. Перед мысленным взором пляшут одуванчики и маки.
paginae/skills/yrkir/gardener3=Всё плывёт перед глазами. Ваши пальцы кажутся пучком извивающихся зелёных стеблей, растущих из древесины ваших рук. Семя в голове пошло в рост с такой силой, что грозит разорвать её надвое.
paginae/skills/yrkir/gardener4=И вдруг всё разом трескается: из вашей головы проливается тёплый душистый дождь из цветов и весенних ароматов. Он мягко ложится над необъятными зелёными полями, полными жизни и обещаний возрождения. Всякий рост причиняет боль, а вы выросли больше многих.
paginae/skills/yrkir/gemhunter=Охотник за самоцветами
paginae/skills/yrkir/gemhunter0=В вашем сердце отзывается пронзительная нота далёкого самоцвета. Его тайная песня зовёт вас из непроглядной ночи.
paginae/skills/yrkir/gemhunter1=Песня самоцвета звучит всё громче. Вы ясно видите путь к нему и представляете, как ограняете собственную душу по его подобию.
paginae/skills/yrkir/gemhunter2=Словно во сне, вы держите в сложенных ладонях самоцвет, которого искало ваше сердце. Он с ослепительной яркостью отражает все краски мира, пока вы размышляете над его тайнами.
paginae/skills/yrkir/gemhunter3=Превозмогая страшную боль, вы вонзаете осколок самоцвета глубоко в душу и отсекаете негодную породу, чтобы обнажить скрытое под ней сияние.
paginae/skills/yrkir/gemhunter4=Ваша огранка почти совершенна. Вы сияете светом обретённой веры и отбрасываете вокруг странные, таинственные отблески.
paginae/skills/yrkir/herder=Пастух
paginae/skills/yrkir/herder0=Вы лишь недавно встали на путь Пастуха, а на днях вам уже почудилось, что вы разобрали одну из нот овечьего блеяния.
paginae/skills/yrkir/herder1=Вы знаете, в какие сезоны кочуют туры, и можете предсказать погоду по дыханию коровы.
paginae/skills/yrkir/herder2=Вы прошли долгий путь и устали от странствий. Вы видели необъятные степи и перегоняли коз через высокие горы.
paginae/skills/yrkir/herder3=Вы изнурены, а до конца пути ещё далеко. Теперь вы можете предсказать судьбу овцы по единственной шерстинке.
paginae/skills/yrkir/herder4=Вы почти овладели ремеслом и близки к цели. Если заглянуть в глаза быку, в них можно увидеть отражение собственной души.
paginae/skills/yrkir/hunter=В глубинах неизведанных лесных царств, следы так легко переплетаются крест-накрест то с другими, то сами с собой, что вовсе теряют всякий смысл под сенью куста и папоротника, и лишь те, кто старательно вчитывается в эти глифы копыта и лапы, смогут затем последовать за ними по более диким, вольным тропам. Уже продолжительное время вы жаждали говорить на этом странном и причудливом языке зверя, крови и почвы, и манящее эхо в далекой зелени обещает научить вас. Следование Тропой Охотника сулит...\n$col[255,255,0]{\n • Стрельба +20\n • Убегающие животные получают больше урона.\n • Увеличение скорости во время преследования животных.\n • Больше мяса от разделки туш.\n • Снаряды не так сильно понижают качество животных.}
paginae/skills/yrkir/hunter0=Вы все еще теряете свою тропу в лесу, но солнце и звезды уже направляют вас обратно, когда такое происходит. Вам известны имена большинства зверей, а также их пути.
paginae/skills/yrkir/hunter1=Ваши чувства обострились, и вы по-новому читаете книгу природы. Вы знаете, где олень утоляет жажду и где барсук роет нору.
paginae/skills/yrkir/hunter2=Вы больше не боитесь. Прежде вы трепетали перед неведомыми просторами леса, а теперь он внушает вам лишь благоговение, благодарность и охотничий азарт.
paginae/skills/yrkir/hunter3=Теперь вы идёте по следу и через ручьи, и через каменистые горы. Вы научились находить верный путь по капле крови и слышали в лунные ночи далёкий волчий вой.
paginae/skills/yrkir/hunter4=Вы долго преследовали неуловимую добычу - мудрость. Теперь она на расстоянии вытянутой руки, и вы слышите её прерывистое дыхание. Медведь и лось склоняются перед вами как перед истинным владыкой леса.
paginae/skills/yrkir/lumberjack=Уже продолжительное время вы бродили среди величественных шпилей лесных массивов, свободных и диких, и заноза в вашей душе постепенно приобретала очертания все возрастающего желания подрезать и придавать им более правильные формы. В треске расколотых бревен вы слышали крики новых форм, жаждущих быть вытесанными на волю, а в отблесках топора и в огне вы увидели благотворный свет, сжигающий и прогоняющий прочь тени неприкаянной лесной глуши. Вы слышали рассказы о том, что когда Древо Мира впервые проклюнулось, Старые Боги приставили к нему первого Лесоруба, стоять на его страже дни и ночи, до конца времен, когда лишь он один будет знать верное время, чтобы свалить великое дерево и разрушить Мир. Постичь ремесло Лесоруба - значит познать формы и породы различных деревьев и древесины, их текстуры и расцветки, виды и возрасты, и как лучше их применить. Вырубка Просеки Лесоруба сулит...\n$col[255,255,0]{\n • Знания +15\n • Увеличение скорости рубки деревьев и бревен.\n • Плотничество +20\n • Увеличение количества поленьев и досок из бревен.\n • Сила +25}
paginae/skills/yrkir/lumberjack0=Вы внимательнее замечаете, как петляет лес вокруг вас, как сменяются чащи и рощи и как тянутся к небу ветви.
paginae/skills/yrkir/lumberjack1=Вы понемногу обрезаете лишние побеги своей души и направляете её желания в нужную сторону. Это больно, но вы чувствуете, как из ран прорастает новая сила.
paginae/skills/yrkir/lumberjack2=Знакомые породы древесины вы знаете, как собственные мозолистые ладони. Ваш топор уже оставил след на лиственнице, осине и вишне.
paginae/skills/yrkir/lumberjack3=Лес содрогается при вашем приближении, и деревья склоняются перед вашим грозным величием. Ваш топор коснулся ликвидамбара, а однажды вы разрубили сосну на золотые щепки.
paginae/skills/yrkir/lumberjack4=По изгибу ствола и рисунку годичных колец вы можете прочесть всё, что случилось и ещё случится с деревом. Вы почти прорубили себе путь сквозь чащу.
paginae/skills/yrkir/miner=Ваша душа навсегда погрузилась в вечную ночь шахты, освещаемую только вспышками ревущего алого пламени, а по вашим жилам несется кровь с примесью тяжелого металла. День и ночь начали терять для вас смысл, а ваши чувства стали острее настроены на жизнь под землей. Вы живете каждый миг, чтобы идти глубже и дальше вниз, вниз к все более глубоким жилам, где корни горы цепко впились в Подземный мир, и где эхом разносится по пещерам хохот троллей. С каждым хрустом суставов и с каждым напряжением отдающих болью мышц, вы ведете свою кирку сквозь вечную пещеру, вырывая сокровища глубин на ту далекую поверхность, что вы так редко видите, и надеетесь наткнуться на золотую жилу. Гора шепчет вам о времени до прихода Древних Богов. Спуск по Штольне Шахтера сулит...\n$col[255,255,0]{\n • Сила +15, Камнеобработка +15\n • Существенный шанс ограничить обвалы.\n • Ускорение переплавки добытой руды.\n • Шанс раздробить клетки при добыче.\n • Повышенное качество добытой породы.}
paginae/skills/yrkir/miner0=В глубине души вы начали разрабатывать новую жилу, и новый опыт принес вам боль. Тем не менее, вам и ранее пришлось расколоть немало камней, так что могло быть и хуже.
paginae/skills/yrkir/miner1=На такой глубине звуки кажутся странно приглушёнными. Всё вокруг вы воспринимаете словно в зеленовато-синем полумраке пещеры.
paginae/skills/yrkir/miner2=Гора начала, пускай и так медленно, все более щедро уступать вам свои секреты и сокровища, но ваше сознание страдает, словно от тысячи мозолей.
paginae/skills/yrkir/miner3=Вы готовы поклясться, что слышите, как где-то глубоко внизу тролли стрекочут на своем странном и загадочном языке, рассказывая о тайных местах, где залегли минералы.
paginae/skills/yrkir/miner4=Стучащее, пульсирующее чувство раздается из-за стены пещеры в вашем сознании. Еще несколько ударов кирки, и Золотая Жила будет вашей.
paginae/skills/yrkir/mystic=Долго и с тоскою вы всматривались в глубины океана и леса, и множественные раздумья над вещами высокими и низкими уводили вас темными, мрачными стезями, а ваши мысли витали в потусторонних ветрах. И теперь вы всегда в сумраке, где-то между сном и явью, где потоки магии Мира струятся по земле, созерцаете всегда открытым третьим глазом бескрайние просторы вселенной. Мистик ищет мудрости и понимания, а в мыслях и поступках - родства и причастия с лесными духами, и со всем естеством и потенциалом природы. Саги гласят о трех норнах, древних и мудрых, что ткут шелк судьбы всех хартлингов, и ведают, где закончится каждое из волокон. Видение Грез Мистика сулит...\n$col[255,255,0]{\n • Воля +15\n • Знания +20\n • +5% скорости изучения.\n • +10% приобретаемого опыта.\n • Уменьшение стоимости магии Мира на 10%}
paginae/skills/yrkir/mystic0=Вы ощущаете присутствие великого Видения сильнее, чем обычно, и каждое дерево, каждый камень вокруг кажется более живым, полным дикой магики.
paginae/skills/yrkir/mystic1=Кажется, словно сама тьма космоса начала заливать вашу душу, но постепенное растворение всех категорий также означает и множество возможностей.
paginae/skills/yrkir/mystic2=Звезды на небосводе стали нести новый смысл, с тех пор как вы стали видеть их как листья на дереве мира, которыми они, как вы теперь знаете, и есть. Вы повидали широкие просторы темных земель, далеко за гранью обычного ощущения и зрения.
paginae/skills/yrkir/mystic3=Мир мерцает загадками потустороннего. Вы слышите, как голоса зверей и корней сливаются в единый, всё нарастающий хор.
paginae/skills/yrkir/mystic4=Вы далеко прошли по тёмным тропам. Теперь остаётся лишь услышать тишину. Отдыхая, вы вновь приводите мир к покою и сосредоточенности.
paginae/skills/yrkir/nomad=Вы устали от привычного окружения, или, быть может, ваши ноги никогда не ведали покоя? В любом случае теперь вы оказались странником в дебрях и просторах открытого пространства, в вечном поиске новых и более отдаленных мест, постоянно стремясь к следующему горизонту. Семь раз вы прошли Мир вдоль и три раза поперек, многие странные и причудливые вещи увидели вы в нем, но необъятность невиданного по-прежнему остается, зазывая дальше, заставляя вас делать следующий шаг. Кочевник не зовет своим домом ни одно из мест, но он всегда дома в своем одиночестве и странствии, сопровождаемый, возможно, лишь только дикими лошадьми и вьючными зверями. Говорят, когда Древние Боги были молоды, они тоже путешествовали на несметные расстояния. Отправление в Путь Кочевника, сулит...\n$col[255,255,0]{\n • Исследование +15\n • Выживание +25\n • Один дополнительный столбец инвентаря.\n • Увеличение длительности запаса сил у лошадей.\n • Один дополнительный ряд инвентаря.}
paginae/skills/yrkir/nomad0=Начало нового путешествия наполняет ваше сердце радостью и томлением. Откуда бы вы ни отправились, первые шаги всегда быстры и легки.
paginae/skills/yrkir/nomad1=Вы прошли немало по этому миру и с каждым шагом всё лучше чувствуете его ритмы и обычаи.
paginae/skills/yrkir/nomad2=Вы странствовали дальше многих и многое повидали. Ноги болят от долгой дороги, но сердце всё так же ноет от жажды странствий.
paginae/skills/yrkir/nomad3=Вы миновали точку невозврата. Возможно, ещё никогда не были так далеко от дома ни телом, ни духом. Ноги покрыты мозолями, а подошвы истончились.
paginae/skills/yrkir/nomad4=Где-то вдали вы уже чуете последний горизонт долгого и трудного пути. Вы мечтаете лишь перешагнуть его и идти дальше, навстречу солнцу. Быть может, там даже Кочевник наконец найдёт дорогу домой.
paginae/skills/yrkir/pearldiver=Искатель жемчуга
paginae/skills/yrkir/pearldiver0=Вы вдохнули свежий воздух в последний раз на долгое время и нырнули под волны в поисках сокровищ диких вод.
paginae/skills/yrkir/pearldiver1=Вы заплыли глубже в пещеры своего разума, и толща воды глухим ритмом давит на барабанные перепонки.
paginae/skills/yrkir/pearldiver2=Давление усиливается, перед глазами мелькают радужные вспышки. Вы чувствуете перемену и изнутри: ваш разум медленно покрывается чешуйками перламутра.
paginae/skills/yrkir/pearldiver3=Воздуха почти не осталось, лёгкие горят от желания вдохнуть, а под вами ещё столько глубины. В вашем сознании уже созрела мысль, идеально круглая и ослепительно сияющая.
paginae/skills/yrkir/pearldiver4=Когда тело начинает сводить от нехватки воздуха, вы вдруг достигаете дна и находите свою награду. Осталось всплыть и показать солнцу, волнам и чайкам новую безупречную жемчужину. Быть может, она всегда росла в вас.
paginae/skills/yrkir/potter=Гончар
paginae/skills/yrkir/potter0=Где-то в сырой глине вашей жизни вы нащупали новую форму, которая только и ждёт, когда её вылепят.
paginae/skills/yrkir/potter1=Неотёсанный сосуд вашей души обрёл очертания за долгие дни и ночи на гончарном круге.
paginae/skills/yrkir/potter2=Печь вашего разума яростно разгорелась. Глина ваших мыслей быстро твердеет, покрываясь блестящей глазурью.
paginae/skills/yrkir/potter3=И вдруг по краю ползёт трещина, грозя расколоть вас надвое и рассыпать на острые осколки стекла и обожжённой глины.
paginae/skills/yrkir/potter4=Но пламя вокруг гаснет, и вы выходите из огненного крещения невредимым, с новой твёрдостью духа. Гончарный круг замедляется: ему осталось сделать лишь несколько оборотов.
paginae/skills/yrkir/quarryman=Вы созерцали гору, пока не осталась лишь только гора, и на некоторое время узкий прямой раскол возник в вашем мировоззрении, бросая вызов, угрожая разрубить его надвое ужасным ударом нового пережитого опыта. Ваши мечты стали твердыми и угловатыми, и вы видите окружающий мир, словно высеченным в камне, и теперь ищите способ вновь воссоздать его в таком образе. Камнелому известны вкусы и порядки минерального мира, а также имена всех камней и скал, из которых он соткан. Из глубин горы вещая нота зазывает вас мыслить и действовать как кварц, как гранит, и как чернейший, лукавейший обсидиан. Некоторые говорят, что корни горы старше даже, чем сами Древние Боги. Раскалывание Расселины камнелома сулит...\n$col[255,255,0]{\n • Знания +15\n • Камнеобработка +20\n • Увеличение скорости раскалывания камней и силы при добыче ископаемых.\n • Сила +20\n • Увеличение базового качество добытых камней.}
paginae/skills/yrkir/quarryman0=Камни вокруг ощущаются более податливыми на ощупь, чем когда-либо раньше, и вы испытываете сильнейшее желание узнать их имена.
paginae/skills/yrkir/quarryman1=Трещина в вашем сознании расширилась, и вы мечетесь между тем, кто вы есть, и тем, кем становитесь. Вы выучили имена всех распространенных камней и валунов.
paginae/skills/yrkir/quarryman2=В прожилках кварца и песчаника вы проследили линию собственной жизни, и сами вытесали в ней новые грани вдоль того пути, которому теперь следуете.
paginae/skills/yrkir/quarryman3=Песня горы наполняет все ваше естество, и повсюду, куда бы вы ни шли, вам виден мир, отражённый и преломлённый в мраморе и дивном хрустале.
paginae/skills/yrkir/quarryman4=Вы почти прошли насквозь. Расселина, которая сначала была маленькой трещиной, успела разрастись и грозит расколоть всё ваше существо, обнажив новый облик, скрытый внутри.
paginae/skills/yrkir/scholar=Учёный
paginae/skills/yrkir/scholar0=Вокруг проступают яркие узоры и странные руны. Вы учитесь внимательнее читать знаки мира и времени.
paginae/skills/yrkir/scholar1=Во рту едкий привкус, словно от чернил и слишком многих проглоченных книг. Вы усердно учились несколько лун, и это начинает сказываться.
paginae/skills/yrkir/scholar2=Вы в лабиринте, который сами построили. В извилистых ходах разума на вас кричат призраки непознаваемого и нелепого, облекая в звук мучительную невозможность понять.
paginae/skills/yrkir/scholar3=На миг наступает покой, и вам открываются новые возможности. В темноте светятся слабые, но понятные знаки, освещая дорогу через лабиринт невежества.
paginae/skills/yrkir/scholar4=Вы ещё не у цели, но уже видите путь: лестницу мудрости, ведущую к познаниям выше луны и звёзд. Вы стали учёным, и Мудрость Учёного уже близка.
paginae/skills/yrkir/strider=Вы чувствуете колебания времен года, а подошвами своих стоп вы способны ощутить дрожь земли от единственного упавшего листа или от своей жертвы, трясущейся в подлеске при вашем приближении. Вы долго блуждали по Лесному Миру и развили навыки, став передовиком в своем ремесле, добывая на жизнь лесным хозяйством, рыболовством и охотой, и, таким образом, вы стали частью дикой природы, а она - частью вас, до такой степени, что теперь вы перемещаетесь в ней почти без усилий, по корню и по скале, словно бегущая река. Говорят, что первым Скороходом была сама Луна, мчащаяся по небосводу наперегонки с Солнцем. Переход на Бег Скорохода сулит ...\n$col[255,255,0]{\n • +50% к Плаванью.\n • Ускорение преодоления обрывов.\n • Бонус качества убитых диких животных.\n • Снижение расхода выносливости при беге по лесу.\n • +15% к урону оружием дальнего боя.}
paginae/skills/yrkir/strider0=Лишь на миг замешкавшись, вы вступаете в незнакомый лес своего разума. Здешняя зелень кажется прохладнее и чуднее любой, что встречалась вам прежде.
paginae/skills/yrkir/strider1=В сознании высятся тени чёрных деревьев. Где-то далеко в тумане тоскливо кричит косуля, словно жалуясь или молясь.
paginae/skills/yrkir/strider2=На середине пути вы очутились в тёмном лесу: прямая тропа потерялась.
paginae/skills/yrkir/strider3=Лес наполнился новым теплом, а шаг стал пружинистым. Всё ещё темно, но из чащи вместо криков доносится громовой смех.
paginae/skills/yrkir/strider4=Краем глаза вы видите, как копытные мчатся рядом с вами в дикой охоте. Стоит повернуть голову, и они исчезают. Ваша добыча близка.
paginae/skills/yrkir/tailor=Ваша тонкая нить прошла сквозь игольное ушко, и сотворила вас заново в совершенно новых тканях. Некоторое время ваши мысли блуждали по более мягким местам и более странных материях, и вы ощутили нарастающую тягу к рукоделию и дивному искусству. Портной помнит все волокна и нити Мира, непрерывно сплетая их в гобелен своей жизни, в услугу себе, другим, и нескончаемому поиску безупречного одеяния для идеального случая. Как для крестьянина, так и для короля, лишь только Портной стоит между ними и холодными временами года, и жестокостью неумолимой стихии, и такая ответственность побуждает лишь лучшее в тех, чья задача - носить этот духовный наряд. Пряденье Волокна Портного сулит...\n$col[255,255,0]{\n • Шитье +15\n • Уменьшение шанса неудачи при украшение одежды на 5%.\n • Двойной шанс дополнительной ячейки украшения при переработке артефактов.\n • Шитье +25\n • Постоянный успех при первом украшение нового артефакта.}
paginae/skills/yrkir/tailor0=Игла вашей жизни прокалывает ткань новых переживаний, и вам не терпится протянуть за ней нить. Вы начали изучать швы и вышивки.
paginae/skills/yrkir/tailor1=Ткань мира кажется всё привычнее на ощупь, и вы осваиваете новое ремесло. Вы знаете тайные узлы, которыми можно крепко связать любую нить.
paginae/skills/yrkir/tailor2=В уколе иглы вы читаете судьбу мира и его обитателей, а по изгибу волокна определяете, где оно выросло и кто его посадил.
paginae/skills/yrkir/tailor3=Вас ещё не дошили, но уже скроили по мерке. Вы знаете обратную сторону каждой пришитой вами пуговицы, и можете рассмотреть ткань волокон судеб Мира в каждом куске полотна.
paginae/skills/yrkir/tailor4=Однажды мотылёк шелкопряда, сев на ваше левое плечо, прошептал вам на ухо главные секреты портняжного ремесла и нарёк вас новым именем. Вы уже почти мастер своего дела, которому не хватает лишь пары последних швов.
paginae/skills/yrkir/wsage=Мудрец
paginae/skills/yrkir/wsage0=В видении вам открылось священное место. Сердце зовёт в паломничество, во славу мира и древних богов.
paginae/skills/yrkir/wsage1=Цель всё ещё далека, и видение начинает меркнуть в памяти. Глубокая жажда в самой сердцевине души гонит вас вперёд.
paginae/skills/yrkir/wsage2=Долгое странствие измотало вас, и вы чувствуете себя потерянным. Где-то далеко ворон кричит от ужаса, предвещая беду.
paginae/skills/yrkir/wsage3=Когда вы огибаете поворот дороги, проблеск солнечного света касается вашего сердца. В движении облаков вам чудится знамение.
paginae/skills/yrkir/wsage4=Вы стоите в тишине близ священного места, к которому вело паломничество. И понимаете, что этот путь привёл вас не столько в новое место, сколько к истокам собственного сердца.
paginae/wound/addervenom=Ледяной ужас пронзает вас, разнося с собой холодный, сочащийся яд змеи, только что укусившей вас. Состояние этой раны будет ухудшаться в течение некоторого времени, прежде чем она начнет заживать.\nДля самозаживления нужна энергия не ниже 8000%.
paginae/wound/allergicreaction=Вы одновременно получили несколько аллергических ран, и организм ответил общей реакцией.\n\nЭта рана со временем заживает медленно.\nДля самозаживления нужна энергия не ниже 8000%.
paginae/wound/antburn=Вы были оплеваны муравьями, и теперь все еще ощущаете на коже легкое жжение. Нет поводов для беспокойства!\n\nЭта рана со временем заживает медленно.\nДля самозаживления нужна энергия не ниже 8000%.
paginae/wound/antpaste=Муравьиная паста
paginae/wound/asphyxiation=Вы пробыли под водой больше, чем было нужно и теперь пожинаете плоды. Кажется, с тех пор вы немного отупели.\n\nЭта рана заживает относительно быстро.\nДля самозаживления нужна энергия не ниже 8000%.
paginae/wound/beesting=Вас ужалила пчела, и это заметно жжёт. Пока рана есть, каждый новый укус больнее.\n\nЭта рана со временем заживает медленно.\nДля самозаживления нужна энергия не ниже 8000%.
paginae/wound/blackeye=Несколько лишних ударов по лицу и его уже ушибленным частям обеспечили вас весьма устойчивым фингалом.
paginae/wound/bladekiss=Острое лезвие нежно коснулось вас, оставив жестокий алый след на месте своего поцелуя.\n\nЭта рана заживает сама, очень медленно (~1 пункт в сутки).\nДля самозаживления нужна энергия не ниже 8000%.
paginae/wound/blisteringheadache=Где-то в глубине черепа оркестр гоблинов отбивает невыносимую дробь. Похоже на отравление.\n\nЭта рана заживает сама (~1 пункт в сутки).\nДля самозаживления нужна энергия не ниже 8000%.
paginae/wound/blunttrauma=От дубины, упавшего валуна или когтей животного вы понесли серьезное жесткое наказание.
paginae/wound/bruise=Удары тупым предметом оставили посиневшие следы на вашей коже.\n\nЭта рана со временем заживёт сама.\nДля самозаживления нужна энергия не ниже 8000%.
paginae/wound/buttered=Вы обильно смазали пару старых ран хорошо взбитой жабьей слизью. По крайней мере, вам кажется, что вы так сделали. ВЫ ощущаете легкое головокружение и помните этого точно. Но всё в порядке!\n\nИнтелект: -1
paginae/wound/chillsandnausea=Вас накрыло странное сочетание озноба и тошноты. Чувствуете себя отвратительно.\n\nЭта рана заживает сама (~1 пункт в час).\nДля самозаживления нужна энергия не ниже 8000%.
paginae/wound/coalcough=Лёгкие горят, как от тлеющего угольного пласта, и вы надрываетесь кашлем.\n\nЭта рана со временем заживает медленно.\nДля самозаживления нужна энергия не ниже 8000%.\n\nКамнеобработка: +15
paginae/wound/concussion=Вы помните, когда упали без чувств? Нет, конечно, и в этом-то и проблема. Вам очень долго били по голове, так что теперь пожинайте результат.\n\nЭта рана со временем заживёт сама.\nДля самозаживления нужна энергия не ниже 8000%.
paginae/wound/crabcaressed=Вас немного потрепало, и эта рана, оставленная нежным касанием краба, по прежнему ощутимо болит. Скорее всего эта рана заживет сама,но, судя по всему, это потребует больше времени, чем вы ожидали.\n\nДля самозаживления нужна энергия не ниже 8000%.
paginae/wound/cruelincision=Вы пострадали от крайне опасного пореза, едва не лишившего вас части тела.
paginae/wound/deepcut=Вы, кажется, порезались, или кто-то сделал это за вас. Глубокий длинный порез на вашей коже теперь смотрит на вас в ответ.
paginae/wound/deepworm=Где-то в тёмных недрах шевелится голод. Вся еда даёт меньше FEP, пока этот червь живёт в вас.\n\nБолезнь: со временем растёт. HHP не снимает. Лечится экстрактом пижмы.
paginae/wound/dragonbite=Вы поцеловали синего дракона, который поначалу был таким ласковым, пока неспешно, но неожиданно коварно, не обернулся, чтобы укусить вас. То ли в последствии чрезмерного употребления, то ли из-за начавшейся ломки, вы страдаете от ужасной боли, испытывая вместе с ней непреодолимую жажду сладкого облегчения и еще одного взгляда на эти бескрайние алые поля.\n\nЭта рана со временем заживёт сама.\nДля самозаживления нужна энергия не ниже 8000%.\n\nВсе характеристики: -10
paginae/wound/fellslash=Страшные алые следы остались на вашей коже там, где по ней прошёлся острый предмет.
paginae/wound/gauzed=Перевязано
paginae/wound/hartshornsalved=Вы нанесли мазь из экстракта оленьего рога на рану, и скоро она заживет.
paginae/wound/henpecked=Птица клюнула вас. Обидно, но не смертельно.\n\nЭта рана со временем заживает медленно.\nДля самозаживления нужна энергия не ниже 8000%.
paginae/wound/infectedsore=Одна из ваших ран, казалось бы, заживала неплохо поначалу, однако со временем осложнилась, начав источать зеленый и желтый гной. Вы понятия не имеете, как она будет заживать.
paginae/wound/jellysting=Вас обожгла медуза.\n\nЭта рана со временем заживает медленно.\nДля самозаживления нужна энергия не ниже 8000%.
paginae/wound/kelphelped=Лечение ламинарией
paginae/wound/lathered=Намылено
paginae/wound/leechburns=Пиявки присосались к вашим жизненным сокам и оставили вам в наследство кровавые метки и прочие неприятные ощущения.\n\nЭта рана со временем заживёт сама.\nДля самозаживления нужна энергия не ниже 8000%.
paginae/wound/mercury=Ртуть
paginae/wound/midgebite=Мошкара искусала вас. Ничего страшного.\n\nЭта рана со временем заживёт сама.\nДля самозаживления нужна энергия не ниже 8000%.
paginae/wound/muddied=Было так больно, что пришлось вываляться в грязи, лишь бы немного ослабить боль. Хоть сами вы чувствуете себя свиньёй, зато ваша рана теперь чувствует себя приятно и прохладно .
paginae/wound/nastylaceration=Мелкая рана разорвалась от новых ударов - теперь это рваная рана, и она по-настоящему болит.\n\nЭта рана со временем заживает медленно.\nДля самозаживления нужна энергия не ниже 8000%.
paginae/wound/nervdmg=Высокая доза яда, пережитая однажды, оставила после себя постоянное чувство усталости.
paginae/wound/nettleburn=Крапива оказалась жгучей, совсем как в названии.\n\nЭта рана заживает сама (~20 минут на пункт).\nДля самозаживления нужна энергия не ниже 8000%.\n\nВыживание: +1
paginae/wound/nicksnknacks=Ничего страшного, но всё-таки кое-что. Вы получили одно или несколько небольших ранений.\n\nЭта рана со временем заживёт сама.\nДля самозаживления нужна энергия не ниже 8000%.
paginae/wound/nidburns=Злой дух поразил вас в отместку за ваши преступления против законы Мира. Эта рана очень медленно заживет со временем.\nДля самозаживления нужна энергия не ниже 8000%.
paginae/wound/pipewheeze=Вам неприятно это признавать, но постоянные хрипы в дыхательных путях, появившиеся в последнее время, могут быть связаны с чрезмерным курением трубочного табака. Если захотите, можете продолжать.
paginae/wound/poulticetreat=Вы применили Жгучую припарку для лечения ранения и будем надеяться, что это поможет.
paginae/wound/punchsore=В миллионе различных мест, о которых вы даже и не знали, зудят следы от хорошей драки. Надеюсь, оно того стоило.\n\nЭта рана со временем заживёт сама.\nДля самозаживления нужна энергия не ниже 8000%.
paginae/wound/quilled=План погладить ежа имел определенные колющиеся изъяны, что вы и обнаружили совсем недавно. Эта рана со временем заживет сама.\nДля самозаживления нужна энергия не ниже 8000%.
paginae/wound/sandfleabites=Песчаные блохи закусали вас.\n\nЭта рана со временем заживает медленно.\nДля самозаживления нужна энергия не ниже 8000%.
paginae/wound/scorpstung=Вас ужалил скорпион, яд гуляет по венам.\n\nБолезнь: урон сначала растёт, затем рана начинает медленно заживать.\nДля самозаживления нужна энергия не ниже 8000%.
paginae/wound/scrapesncuts=Некоторые из ваших прошлых мелких ран разбередили новые сражения.\n\nЭта рана со временем будет медленно заживать.\nДля самозаживления нужна энергия не ниже 8000%.
paginae/wound/sealfinger=Болезнь: со временем медленно растёт.
paginae/wound/severemauling=Вы получили несколько весьма серьезных ударов, несколько из которых пришлось по голове. Выглядит совсем нехорошо.
paginae/wound/somethingbroken=Вы были тяжко травмированы и что-то внутри вас не совсем так, как должно быть.
paginae/wound/soothingcold=Там, где раньше была боль, теперь ваша кожа ощущает себя восхитительно благодаря приложенному успокаивающему целительному холоду.\n\nЭта рана со временем заживет сама.
paginae/wound/soresnout=Ноздри расширены, по носу стучит тупая боль, каждый вдох сопит по-свински.\n\nЭта рана заживает сама (~12 часов на пункт).\nДля самозаживления нужна энергия не ниже 8000%.
paginae/wound/starvation=Вы растрачивали энергию, не имея запасов, и вот последствия. Вы страдаете из-за перенесенного Истощения.\n\nЗаживает только при энергии не ниже 8000% и только пока вы в игре - сон не лечит.
paginae/wound/stitchedup=Где-то за этим хрупким барьером из швов и клея – части вашего тела, норовящие покинуть свое естественное место. Похоже, вам удалось пока сдержать проблему, и вы ожидаете, что рана заживет, пусть и чрезвычайно медленно.
paginae/wound/swampfever=Болезнь: со временем растёт, но иногда может сойти сама.\nДля самозаживления нужна энергия не ниже 8000%.
paginae/wound/swollenbump=По каким-то причинам вы стали обладателем большой и неприятной шишки.
paginae/wound/tansied=Мягкий дождь из солнечных золотых монет осыпал всё, что вас здесь мучило, и опаляет незваных гостей праведным огнём прикладной ботаники.
paginae/wound/tickedoff=В укромной складке поселился лесной вампир - клещ.\n\nЭта рана со временем заживёт сама.\nДля самозаживления нужна энергия не ниже 8000%.
paginae/wound/toadwart=Фу! Жабья слизь давным-давно высохла, но оставила после себя эту Мерзкую бородавку. Вы не уверены, вылечится ли она когда-нибудь.
paginae/wound/unfaced=По некоторым причинам ваше лицо сильно пострадало в драке, однако, не сказать, чтобы это вас сильно беспокоило.
paginae/wound/waybroadtreat=Вы обернули эту рану в подорожник. Возможно, это не лучшее лечение, но вам кажется, что и это должно сработать. Эта рана со временем заживет сама.
paginae/wound/wretchedgore=Вы не решаетесь даже глянуть эту рану, а если бы заставили себя посмотреть, увидели бы, что выглядит она ужасно. Смещенные органы среди крови и обезображенной ткани.
paginae/wound/yarr=Цинга
paginae/xtensions/cellar_digging=Колет камни и заходит в дверь погреба, пока хватает энергии.
paginae/xtensions/cheese=Куда ставить лоток и во что он превратится. На стойке таймер - через сколько часов переставить.
paginae/xtensions/chip_stone=Ищет ближайшие булыжники вокруг персонажа и откалывает с них камень, пока булыжник не кончится или задача не будет отменена.
paginae/xtensions/last_craft=Открывает последний использованный рецепт или прячет окно крафта, если оно уже открыто.
paginae/xtensions/roasting_spit=Кладет еду на вертел камина рядом, жарит и разделывает.
paginae/xtensions/roster=Список построек, которые ты осмотрел приключенческим действием «Осмотреть», и семян в открытых инвентарях.
paginae/xtensions/tar_kiln_emptier=Подходит к готовым смоляным печам, забирает уголь и бросает его на землю.
gfx/hud/chr/tips/base=Базовые характеристики влияют на многие процессы: переноску предметов, ремесло и бой. Их можно повышать, употребляя еду.
gfx/hud/chr/tips/constip=Каждый раз, когда вы едите определённый вид пищи, насыщение этим видом увеличивается. Это уменьшает количество FEP, получаемых от следующей порции такой же еды. Насыщение снижается со временем. Его также можно уменьшить, выпив различные напитки перед едой.
gfx/hud/chr/tips/hunger=Любая еда заполняет шкалу голода, уменьшая количество получаемых FEP. Голод восстанавливается со временем. Его также можно восстановить некоторыми предметами, в частности солью.
gfx/hud/chr/tips/fep=Очки пищевых событий (FEP) набираются при употреблении различной еды. Когда шкала FEP заполняется, случайным образом происходит пищевое событие. Вероятность каждого события зависит от числа соответствующих очков в шкале. Большинство пищевых событий повышает одну из основных характеристик.
Hold\ the\ Cold\ Cut,\ and\ Right-Click\ the\ wound\ you\ wish\ to\ treat\ in\ the\ \"Health\ &\ Wounds\"\ screen\ of\ your\ character\ sheet.\n=Возьмите холодную нарезку и правой кнопкой укажите рану на экране «Здоровье и раны» в листе персонажа.\n

paginae/add/minesweeper=Включает курсор разметки шахты.\nЛКМ: крестик → галочка → вопрос → убрать отметку.\nПКМ по цифре: постоянная ↔ временная.\nEscape - выход. Параметры добычи: Настройки → Безопасность шахты.

# Local automation mini instructions
hearthborn/coracle=Сажает в $col[186,85,255]{коракл} или подбирает его.\n\n1. Вы уже в коракле: скрипт подбирает его.\nЕсли слот плаща свободен, коракл встаёт туда.\nЕсли слот плаща занят, нужна свободная область $col[186,85,255]{4×3}.\n$col[255,64,64]{Предупреждение:} в глубокой воде подбор возможен только у берега. Если вокруг одна глубина, скрипт останавливается.\n\n2. Коракл в инвентаре: заранее встаньте на $col[255,160,48]{мелководье} или в $col[255,160,48]{болото}. Скрипт сбрасывает его и садится.\n$col[255,64,64]{Предупреждение:} глубокая вода и суша останавливают скрипт сразу.\n\n3. Коракла среди вещей нет: садится в ближайший свободный коракл.\n\n$col[255,196,48]{Примечание:} Escape или повторное нажатие на автоматизацию останавливает скрипт. Перед запуском освободите курсор.
hearthborn/skis=Выкладывает ваши лыжи и надевает их; если вы уже на лыжах - подбирает. Может использовать свободные лыжи рядом.\nЕсли место плаща занято, освободите 2×3 клетки инвентаря.\n\nEscape или повторное нажатие на автоматизацию останавливает текущий скрипт. Перед запуском освободите курсор; исключение - горящий факел.
hearthborn/cellar=Повторяет копание подвала и скалывает мешающие обычные валуны. Нужна загруженная дверь подвала. При низкой выносливости пытается пить.\nОстанавливается при энергии ниже 25%; при критически низком здоровье пытается вернуться к очагу. Камни с курсора сбрасываются на землю.\n\nEscape или повторное нажатие на автоматизацию останавливает текущий скрипт. Перед запуском освободите курсор; исключение - горящий факел.
hearthborn/roastspit=Загружает подготовленные сырые продукты на ближайший вертел, жарит, снимает готовое и повторяет.\nНужен очаг с установленным вертелом в пределах двух тайлов, подходящая еда и место в инвентаре. Не строит и не разжигает очаг.\n\nEscape или повторное нажатие на автоматизацию останавливает текущий скрипт. Перед запуском освободите курсор; исключение - горящий факел.
hearthborn/chipstone=Скалывает ближайшие обычные валуны, пока они есть поблизости. Валуны драгоценных камней пропускает.\nКамни с курсора сбрасываются на землю.\n\nEscape или повторное нажатие на автоматизацию останавливает текущий скрипт. Перед запуском освободите курсор; исключение - горящий факел.
hearthborn/drycollect=ЛКМ: собрать готовые продукты с ближайших сушильных рам.\nShift + ЛКМ: развесить сырые шкуры из инвентаря и открытых сумок.\nДля сбора освободите место в инвентаре.\n\nEscape или повторное нажатие на автоматизацию останавливает текущий скрипт. Перед запуском освободите курсор; исключение - горящий факел.
hearthborn/leathercollect=ЛКМ: собрать готовую кожу из ближайших дубильных чанов.\nShift + ЛКМ: загрузить высушенные шкуры из инвентаря и открытых сумок.\nДля сбора освободите место в инвентаре.\n\nEscape или повторное нажатие на автоматизацию останавливает текущий скрипт. Перед запуском освободите курсор; исключение - горящий факел.
hearthborn/branchoven=Кладёт ровно 4 ветки в ближайшую печь в пределах трёх тайлов.\nВетки должны быть в основном инвентаре. Только добавляет топливо, не разжигает печь.\n\nEscape или повторное нажатие на автоматизацию останавливает текущий скрипт. Перед запуском освободите курсор; исключение - горящий факел.
hearthborn/wood5=Кладёт ровно 5 поленьев в ближайшую коптильню в пределах трёх тайлов.\nБерёт поленья из инвентаря, сумок снаряжения и открытых стопок. Только добавляет топливо, не разжигает коптильню.\n\nEscape или повторное нажатие на автоматизацию останавливает текущий скрипт. Перед запуском освободите курсор; исключение - горящий факел.
hearthborn/coal9=Кладёт ровно 9 угля в ближайшую плавильную печь в пределах трёх тайлов.\nУголь должен быть в основном инвентаре. Только добавляет топливо, не разжигает печь.\n\nEscape или повторное нажатие на автоматизацию останавливает текущий скрипт. Перед запуском освободите курсор; исключение - горящий факел.
hearthborn/coal12=Кладёт ровно 12 угля в ближайшую плавильную печь в пределах трёх тайлов.\nУголь должен быть в основном инвентаре. Только добавляет топливо, не разжигает печь.\n\nEscape или повторное нажатие на автоматизацию останавливает текущий скрипт. Перед запуском освободите курсор; исключение - горящий факел.
hearthborn/cheesetrayfiller=Заполняет пустые сырные лотки в открытых окнах: по 4 кусочка творога одного типа на лоток.\nОткройте лотки и положите достаточно одинакового творога в основной инвентарь.\n\nEscape или повторное нажатие на автоматизацию останавливает текущий скрипт. Перед запуском освободите курсор; исключение - горящий факел.
hearthborn/torch=Зажигает ближайшую подходящую печь, плавильню, тигель или котёл горящим факелом.\nНаденьте горящий факел в руку или возьмите его на курсор. Факел из снаряжения возвращается в прежний слот.\n\nEscape или повторное нажатие на автоматизацию останавливает текущий скрипт. Перед запуском освободите курсор; исключение - горящий факел.
hearthborn/trellisharvest=Выбирает «Собрать» у ближайшего созревшего растения на шпалере.\nОдин запуск - одно растение.\n\nEscape или повторное нажатие на автоматизацию останавливает текущий скрипт. Перед запуском освободите курсор; исключение - горящий факел.
hearthborn/trellisdestroy=Отправляет действие «Сломать» ближайшему растению на шпалере.\nПеред запуском проверьте растения рядом: действие уничтожает растение. Один запуск - одно растение.\n\nEscape или повторное нажатие на автоматизацию останавливает текущий скрипт. Перед запуском освободите курсор; исключение - горящий факел.
hearthborn/butcher=Подходит к тушам в пределах 20 тайлов от места запуска.\nИщет путь к свободному месту рядом с тушей; если проход закрыт, пробует другой подход.\nЗаканчивает одну тушу перед следующей: шкура, потрошение, мясо, затем кости. Проверяет свежее меню, ждёт прогресс и поступление предметов, без фиксированного числа повторов.\nНедоступные туши и животных без действий разделки пропускает. Оставьте место в инвентаре для продуктов.\nEscape или ручное движение останавливает скрипт.
hearthborn/fish=Разделывает рыбу из основного инвентаря, пока подходящая рыба не закончится.\nОсвободите место для продуктов разделки.\n\nEscape или повторное нажатие на автоматизацию останавливает текущий скрипт. Перед запуском освободите курсор; исключение - горящий факел.
hearthborn/dismount=Выбирает «Спешить всадника» у ближайшей стоящей лошади.\nДействие должно быть доступно в меню этой лошади.\n\nEscape или повторное нажатие на автоматизацию останавливает текущий скрипт. Перед запуском освободите курсор; исключение - горящий факел.
hearthborn/shoo=Выбирает «Прогнать» у ближайшего стоящего домашнего животного: лошади, овцы, коровы, свиньи или козы.\nДействие должно быть доступно в меню животного.\n\nEscape или повторное нажатие на автоматизацию останавливает текущий скрипт. Перед запуском освободите курсор; исключение - горящий факел.
hearthborn/clover=Даёт один клевер из основного инвентаря ближайшему подходящему стоящему животному.\nНужен клевер и животное, которое его принимает.\n\nEscape или повторное нажатие на автоматизацию останавливает текущий скрипт. Перед запуском освободите курсор; исключение - горящий факел.
hearthborn/rope=Использует верёвку из основного инвентаря на ближайшем подходящем стоящем животном.\nВерёвка остаётся на курсоре для ведения животного.\n\nEscape или повторное нажатие на автоматизацию останавливает текущий скрипт. Перед запуском освободите курсор; исключение - горящий факел.

hearthborn/cattle-roster=Открыть учёт скота.
hearthborn/milk=Встаньте внутри сохранённой области сбора и запустите: взрослых самок этого загона доят по очереди в бочку, молоко переливается в ближайшую цистерну. Вне сохранённых областей выделите новую рамкой на карте.\nНужна пустая бочка рядом. Shift+клик - список областей.\n\nEscape или повторное нажатие на автоматизацию останавливает текущий скрипт. Перед запуском освободите курсор; исключение - горящий факел.
hearthborn/wheat-fields=Сохраните границы поля, хранилище посадочного материала и область куч урожая. Для пустого или смешанного поля выберите культуру для посадки.\nПоддерживаются пшеница, ячмень, лён, конопля на семена, табак, морковь, репа, красный и жёлтый лук, чеснок и порей. «Только убрать» собирает урожай; «Обработать» также отбирает посадочный материал и засевает пустые клетки. Молодые и посторонние растения сохраняются.\nКоманда открывает список полей без запуска работы. Запуск - кнопками в строке поля. Доступны пауза и остановка. Для косы оставьте восемь свободных ячеек; её взмах может задеть растения за выбранными границами.
You\ have\ ingested\ some\ amount\ of\ that\ rumored\ trophy\ of\ spelunking\ gourmets,\ the\ Cavebulb.\ A\ soft\ glow\ emanates\ from\ your\ skin.\n=Вы съели немного той самой легендарной добычи пещерных гурманов - пещерной луковицы. От вашей кожи исходит мягкое сияние.\n
$i{Its\ light\ shone\ bright\ enough\ to\ sense\ the\ danger\ as\ it\ approached,\ but\ too\ dimly\ to\ afford\ escape.}\n=$i{Его свет сиял достаточно ярко, чтобы почувствовать приближение опасности, но слишком тускло, чтобы дать спастись.}\n
$i{A\ motley\ patchwork\ of\ many\ colors,\ boldly\ proclaiming\ that\ the\ first\ one\ now,\ shall\ later\ be\ last.}\n=$i{Пёстрое лоскутное полотно из множества цветов смело провозглашает: кто сейчас первый, тот потом окажется последним.}\n
Design\ your\ very\ own\ full-size\ chess\ set\ with\ relevant\ pieces\ from\ all\ 8x8\ grids.\n=Создайте собственный полноразмерный шахматный набор с подходящими фигурами для всех досок 8x8.\n
Sculptable\ Materials\ include,\ for\ example\:\ stone,\ metal,\ clay,\ and\ blocks,\ or\ boards,\ of\ wood.\n=Материалы для ваяния включают, например: камень, металл, глину, а также деревянные блоки или доски.\n
hearthborn/shear=Стрижёт овец и коз в загоне, где вы стоите (сохранённая область, как для дойки).\n\nEscape или повторное нажатие на автоматизацию останавливает текущий скрипт. Перед запуском освободите курсор; исключение - горящий факел.
A\ Bill\ of\ Possession\ can\ be\ applied\ to\ any\ carryable\ object,\ returning\ a\ stub\ item.\ The\ stub\ item\ allows\ its\ bearer\ to\ lift\ and\ carry\ the\ tagged\ object\ with\ full\ rights\ of\ ownership.\n=Документ о владении можно применить к любому переносимому предмету, получив взамен предмет-заготовку. Заготовка позволяет владельцу поднять и нести помеченный предмет со всеми правами собственности.\n
The\ Kebab\ Roll\ must\ be\ spitroast\ before\ it\ can\ be\ consumed.\n=Ролл с кебабом нужно запечь на вертеле, прежде чем его можно будет съесть.\n
$i{A\ gloomy,\ brooding\ figure,\ slumped\ over,\ and\ lost\ in\ sticky\ thought.}\n=$i{Мрачная, угрюмая фигура, сгорбленная и погружённая в липкие думы.}
hearthborn/water=Берёт пустой мех для воды, наполняет его из ближайшей воды, показывает качество воды в чате, кладёт его обратно и опустошает. Одно нажатие - одна проба.\nРаботает с лодки: держите пустой мех для воды в инвентаре. Мех, в котором уже что-то есть, никогда не выливается.\n\nEscape или повторное нажатие на автоматизацию останавливает текущий скрипт. Перед запуском освободите курсор; исключение - горящий факел.
hearthborn/clay=Копает клетку под вами (с лодки на мелководье), читает качество глины, показывает его в чате и выбрасывает глину. Одно нажатие - один раз копнуть.\nДолжна быть надета лопата. Глину, которая у вас уже есть, сначала выбросьте, чтобы отличить новую.\n\nEscape или повторное нажатие на автоматизацию останавливает текущий скрипт. Перед запуском освободите курсор; исключение - горящий факел.
hearthborn/sand=Копает клетку под вами (на пляже), читает качество песка, показывает его в чате и выбрасывает песок. Одно нажатие - один раз копнуть.\nДолжна быть надета лопата. Песок, который у вас уже есть, сначала выбросьте, чтобы отличить новый.\n\nEscape или повторное нажатие на автоматизацию останавливает текущий скрипт. Перед запуском освободите курсор; исключение - горящий факел.
hearthborn/soil=Копает клетку под вами (на открытой земле), читает качество земли, показывает его в чате и выбрасывает землю. Одно нажатие - один раз копнуть.\nДолжна быть надета лопата. Землю, которая у вас уже есть, сначала выбросьте, чтобы отличить новую.\n\nEscape или повторное нажатие на автоматизацию останавливает текущий скрипт. Перед запуском освободите курсор; исключение - горящий факел.
hearthborn/scout=Сам плывёт вдоль берега: с лодки на воде останавливается каждые несколько клеток и берёт пробу воды, а на мелководье и глины - те же пробы, что у скриптов воды и глины.\nВ окне выбирается, что измерять, с какой стороны берег и как часто брать пробы.\nДержите в инвентаре пустой мех для воды, наденьте лопату и выбросьте глину, которая у вас уже есть.\n\nEscape или повторное нажатие на автоматизацию останавливает текущий скрипт. Перед запуском освободите курсор; исключение - горящий факел.
hearthborn/hands=Открывает окно с кнопкой для каждого вида снаряжения для рук, которое лежит в вашем инвентаре: лук, копьё вепря, меч и щит, мешки путника. Кнопка надевает этот вид в руки, а то, что было в руках, возвращается в инвентарь.\nКурсор должен быть свободен.\n\nEscape или повторное нажатие на автоматизацию останавливает текущий скрипт. Перед запуском освободите курсор; исключение - горящий факел.
paginae/wound/snakejuicy=Ух! Ну и крепкий этот змеиный сок! Слегка жжёт, а по телу ещё пробегает не совсем неприятное покалывание. Похоже, сок всё-таки пошёл на пользу.
WOOO\!\ Daymn,\ son\!\ That\ Snake\ Juice\ went\ down\ rough\ and\ tumble\!\ There's\ a\ slight\ burning\ sensation,\ and\ a\ lingering\ nerve\ tingle\ which\ is\ not\ entirely\ unpleasant.\ It\ feels\ like\ it\ may\ have\ done\ some\ good.\n=Ух! Ну и крепкий этот змеиный сок! Слегка жжёт, а по телу ещё пробегает не совсем неприятное покалывание. Похоже, сок всё-таки пошёл на пользу.

$i{Free\ riders,\ fallen\ off\ the\ back\ of\ their\ mighty\ steed,\ but\ still\ echoing\ its\ nearby\ call.}\n=$i{Вольные всадники, слетевшие со спины могучего скакуна, но всё ещё вторящие его зову неподалёку.}\n
