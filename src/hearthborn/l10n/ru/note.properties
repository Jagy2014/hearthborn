# UTF-8 Russian translation catalog
gfx/invobjs/leaf-mulberrytree=$col[180,220,140]{$i{Заметка: корм шелкопряда. Один лист = 8 кормлений. Гусеница ест каждые ~3 ч 40 мин, ей нужно 4 раза. Клади листья в шкаф вместе с гусеницами, но гусениц не стакай.}}
gfx/invobjs/silkcocoon=$col[180,220,140]{$i{Заметка: сварить кокон → 1–2 шёлковых волокна (садоводство/лесничество дают шанс на второе, друидический обряд - всегда два). Или подождать 2 игровых дня (~14 ч 35 мин) - вылупится мотылёк/бабочка для размножения.}}
gfx/invobjs/silkegg=$col[180,220,140]{$i{Заметка: клади яйца на стол травника. Вылупляются за 1 игровой день (~7 ч 18 мин). Если стол хуже яйца - качество гусеницы упадёт.}}
gfx/invobjs/silkmoth-f=$col[180,220,140]{$i{Заметка: посади с мотыльком в один контейнер (оптимум 8+8 в шкаф). Через 8 ч реальных умрут и оставят 5–10 яиц. Без пары умрут без яиц. Качество яиц - среднее родителей ±5.}}
gfx/invobjs/silkmoth-m=$col[180,220,140]{$i{Заметка: посади с бабочкой в один контейнер (оптимум 8+8 в шкаф). Через 8 ч реальных умрут и оставят 5–10 яиц. Без пары умрут без яиц. Качество яиц - среднее родителей ±5.}}
gfx/invobjs/silkworm=$col[180,220,140]{$i{Заметка: ест лист шелковицы каждые 12 ч игровых (~3 ч 40 мин реальных). Один лист = 8 кормлений (хватит на 2 гусениц). После четырёх кормлений превращается в кокон. Не складывай гусениц в стопку: не едят и умирают. Листья стопкой можно. Пропуск больше одного кормления - смерть. Лист хуже гусеницы снижает её качество.\n\nВремя: каждые ~3 ч 40 мин × 4 кормления → кокон (~14 ч 40 мин). Кокон: сварить сразу → 1–2 шёлковых волокна, или через ~14 ч 35 мин вылупится мотылёк.}}
gfx/terobjs/quern=$col[180,220,140]{$i{Заметка: качество жёрнова не влияет на муку. Софткэп - земледелие и ловкость; у мельничного станка его нет.}}
paginae/bld/anvil=$col[180,220,140]{$i{Заметка: на улице гниёт даже на владении. Качество наковальни и молота входит в почти весь металлический крафт.}}
paginae/bld/churn=$col[180,220,140]{$i{Заметка: качество маслобойки влияет на масло. Молоко весит сильнее станка.}}
paginae/bld/dframe=$col[180,220,140]{$i{Заметка: качество сушилки не влияет на качество шкур и семян - только на скорость сушки. На улице быстро гниёт.}}
paginae/bld/htable=$col[180,220,140]{$i{Заметка: качество результата - среднее предмета и стола. Исключение: семена с ветра (WWW) стол не меняет.}}
paginae/bld/kiln=$col[180,220,140]{$i{Заметка: качество изделия - сырьё сильнее, топливо и печь слабее. Количество предметов не меняет расход топлива.}}
paginae/bld/loom=$col[180,220,140]{$i{Заметка: на улице портится, даже на владении - лучше ставить в доме.}}
paginae/bld/machinemill=$col[180,220,140]{$i{Заметка: качество станка не влияет на муку (мука = зерно). Софткэпа земледелия нет, в отличие от жёрнова.}}
paginae/bld/oven=$col[180,220,140]{$i{Заметка: качество - тесто сильнее, печь и топливо слабее. Лишнее топливо сжигает выпечку в золу, если не вынуть вовремя. Не мешайте блюда с разным временем.}}
paginae/bld/potterswheel=$col[180,220,140]{$i{Заметка: без круга качество керамики вдвое ниже и крафт вдвое дольше. Круг добавляет своё качество в изделие.}}
paginae/bld/quern=$col[180,220,140]{$i{Заметка: качество жёрнова не влияет на муку. Софткэп - земледелие и ловкость; у мельничного станка его нет.}}
paginae/bld/smelter=$col[180,220,140]{$i{Заметка: качество слитка - руда сильнее, печь и топливо слабее. Шлак = качество руды.}}
paginae/bld/swheel=$col[180,220,140]{$i{Заметка: качество прялки влияет на нить и пряжу. На улице портится.}}
paginae/bld/ttub=$col[180,220,140]{$i{Заметка: кожа = шкура сильнее, жидкость слабее, чан ещё слабее. Лишняя кора не ускоряет дубление, но может поднять качество жидкости.}}
paginae/craft/butter=$col[180,220,140]{$i{Заметка: качество маслобойки влияет на масло (молоко весит сильнее).}}
paginae/craft/flour=$col[180,220,140]{$i{Заметка: можно молоть от 1 до 5 зёрен за раз, не обязательно 5. Жёрнов не влияет на качество; мельничный станок снимает софткэп земледелия.}}
paginae/craft/goldthread=$col[180,220,140]{$i{Заметка: шёлк и ртуть влияют сильнее прялки. Можно использовать как нить в рецептах.}}
paginae/craft/magnifyingglass=$col[180,220,140]{$i{Заметка: крафтится в тигле, наковальня не нужна. Качество - среднее олова и стекла.}}
paginae/craft/metalhook=$col[180,220,140]{$i{Заметка: наковальня не нужна. Качество крючка влияет на качество рыбы - простой способ поднять Q улова.}}
paginae/craft/silkthread=$col[180,220,140]{$i{Заметка: качество ветки влияет так же сильно, как шёлковые нити. Прялка тоже входит в качество.}}
paginae/craft/tanfluid=$col[180,220,140]{$i{Заметка: концентрация выше 5% не ускоряет дубление. Если кора лучше воды - больше коры поднимает качество жидкости.}}
paginae/craft/yarn=$col[180,220,140]{$i{Заметка: качество прялки влияет на пряжу.}}
paginae/halp/ui=$font[serif,16]{4. Стопки}\nЧтобы сложить предметы в стак, $col[246,229,34]{кликните правой кнопкой} один предмет на другой и...\n• Удерживайте $col[246,229,34]{Shift}, чтобы добавить в стак все такие предметы поблизости.\n• Удерживайте $col[246,229,34]{Ctrl+Shift}, чтобы сложить в стаки все такие предметы.\n\nНа самих стаках...\n• $col[246,229,34]{Shift+ПКМ} - достать один предмет из стака.\n• $col[246,229,34]{Ctrl+Shift+ПКМ} - достать все предметы из стака.
gfx/hud/halp/ui=$font[serif,16]{4. Стопки}\nЧтобы сложить предметы в стак, $col[246,229,34]{кликните правой кнопкой} один предмет на другой и...\n• Удерживайте $col[246,229,34]{Shift}, чтобы добавить в стак все такие предметы поблизости.\n• Удерживайте $col[246,229,34]{Ctrl+Shift}, чтобы сложить в стаки все такие предметы.\n\nНа самих стаках...\n• $col[246,229,34]{Shift+ПКМ} - достать один предмет из стака.\n• $col[246,229,34]{Ctrl+Shift+ПКМ} - достать все предметы из стака.
